<script>
const DOCS = [{"id": "analysis", "name": "Product analysis", "md": "# FitSphere v1: Product Analysis\n\nAnalysed 2026-11-05 from `docs/designs/fitsphere-v1.md`, `docs/PRODUCT_BRIEF.md` and the canvas sources in `docs/mockups/` (66 desktop and 67 phone screens). No design was changed during this analysis.\n\n## 1. Product in one paragraph\n\nFitSphere is one mobile-first website for adults (18+) in India. Athletes learn boxing, strength and conditioning (S&C) and gym fitness from coach-reviewed lessons, train from coach programs, log every session, and ask an AI guide that cites its sources. Coaches build programs, invite athletes by link, watch their logs and send feedback. Coaches also sell coaching through a marketplace, where athletes compare, hire and pay them. A second coach reviews every lesson before it goes live. An admin grants roles and checks coach credentials.\n\n## 2. Roles\n\n| Role | Gets in by | Main areas |\n|---|---|---|\n| Guest | Visiting the site | Landing, libraries, lessons, programs, coach marketplace, help, legal |\n| Athlete | Email link or Google, 18+ sign-up | Today, Learn, Progress, Ask AI, Account, hiring a coach |\n| Coach | Application approved by an admin | Athletes, Clients, Programs, My lessons, marketplace profile, earnings |\n| Reviewer | Coach who is also given the reviewer role by an admin | Review queue, plus coach areas |\n| Admin | The founder | People and roles, coach applications, credential checks, review queue |\n\nOne account can hold several roles. A coach also uses the athlete side through the \"Athlete site\" link.\n\n## 3. Feature areas\n\n| ID | Area | Features | Screens |\n|---|---|---|---|\n| F1 | Sign-in and sign-up | Email link, Google, 4-step sign-up, 18+ block, separate consent for health data | A-SignIn, A-CheckEmail, A-Onboard1, C-Onboarding, A-OnboardGym, A-Ready, A-Under18 |\n| F2 | Library | Three categories (Boxing, S&C, Gym & Fitness), filters, lesson and exercise pages, rep ranges per goal, search, save, complete, skill path, Sample label | C-Library, P-LibrarySC, G-Library, C-Lesson, P-Drill, G-Exercise, P-Search, T-Saved |\n| F3 | Content workflow | Coach writes, second coach reviews, publish or send back, no self-approval, broken-video flag | K-Lessons, K-Editor, R-Queue, R-Review |\n| F4 | Programs | Builder (weeks, sessions, items, prescriptions), versions, invite links, reset, join, leave, remove | K-Programs, C-Builder, K-Invite, K-ConfirmReset, A-Invite, T-MyPrograms, K-ConfirmRemove, P-Programs, P-Program, G-Program |\n| F5 | Training | Today (merged across programs), boxing round player, S&C and gym set logger with last-time numbers and next target, done summaries | C-Today, G-Today, T-TodayEmpty, C-Session, T-SessionSC, G-Workout, T-SessionDone, G-WorkoutDone |\n| F6 | Progress | Sessions, adherence, records, skill ratings, sets per muscle, optional body weight | C-Progress, G-Progress |\n| F7 | Coaching | Dashboard with flags, athlete detail, feedback and replies | C-CoachDash, K-Athlete, T-Feedback |\n| F8 | Marketplace | Discovery, filters, coach profile with computed stats, compare, shortlist, hire request, chat, checkout, renewal, refunds, verified reviews, coach clients, profile editor, earnings, credential checks | P-Coaches, P-Coach, X-* (11 screens) |\n| F9 | AI guide | Cited answers, no-match mode, injury safety, daily limit, actions | C-AI, lesson AI block |\n| F10 | Account and privacy | Profile, consent switches, data download, delete account | T-Account, T-ConfirmDelete |\n| F11 | Admin | People and roles, coach applications, credential checks | R-Roles, P-ForCoaches, P-Applied, X-Verify |\n| F12 | Public and system | Landing, about, help, privacy and terms, 404, visitor phone menu | C-Landing, P-About, P-Help, P-Legal, P-NotFound, M-Menu |\n\n## 4. User journeys\n\nEach journey lists its screens in order. These become the end-to-end tests.\n\n| ID | Journey | Path |\n|---|---|---|\n| J1 | Guest discovers and joins | Landing → Library → Lesson → Join free → Check email → Sign-up 1–4 → Today (empty) |\n| J2 | Under-18 is stopped | Sign-up 1 → Under-18 block (nothing saved) |\n| J3 | Athlete joins a coach's program | Invite link → sign in or join → Join program → Today |\n| J4 | Athlete trains boxing | Today → Session player → log rounds → Session done → Progress |\n| J5 | Athlete trains in the gym | Gym Today → Workout (last time, next target) → Workout done → Gym progress |\n| J6 | Athlete asks the AI | Lesson or Ask AI → cited answer → open lesson or add to Today; pain → referral and coach flag |\n| J7 | Athlete hires a coach | Find a coach → profile → compare or shortlist → Hire → chat → coach accepts → checkout → coaching starts → Today |\n| J8 | Athlete reviews a coach | My programs → Review the coach (paid, finished engagement only) |\n| J9 | Athlete leaves, cancels or deletes | My programs → Leave (confirm) · Account → Delete (confirm) |\n| J10 | Coach joins | For coaches → apply → admin approves → coach header appears |\n| J11 | Coach builds and shares | Programs → Builder → publish → Invite → share link |\n| J12 | Coach monitors and responds | Dashboard → flag → Athlete detail → feedback → athlete sees it |\n| J13 | Coach publishes a lesson | My lessons → Editor → submit → reviewer approves → live in library |\n| J14 | Coach sells coaching | Profile editor (packages, slots) → request → accept → client pays → earnings and payout |\n| J15 | Admin runs the platform | People and roles · applications · credential checks |\n\n## 5. Assets\n\n| Asset | Source | Status |\n|---|---|---|\n| Fonts | Anton (display) and Inter (body) from Google Fonts, both under the Open Font License | Ready to self-host with `next/font` |\n| Colours | Ink #111111, paper #FFFFFF, mist #F5F5F5, lines #E5E5E5 / #CACACB, greys #707072 / #9E9EA0 / #39393B, volt #D4F000, status green #00653A, amber #8A4600, red #A3001A | Ready as tokens |\n| Icons | Inline stroke SVGs (search, back, next, check, close, plus, play, link, alert, send, heart, star, shield, chat, tab icons) | Ready to turn into one icon component |\n| Photos | 30 Unsplash photos (`docs/mockups/images/`, credits in `CREDITS.md`) | **Demo only.** Real coach photos and lesson thumbnails must replace them before launch |\n| Video | YouTube links per lesson | Coaches supply them |\n| Copy | All screen text is demo copy; coach names, reviews and numbers are fictional | Real content from founding coaches |\n\n## 6. Design observations for owner approval\n\nStatus 2026-11-05: **all six approved and resolved.** Details, screenshots and checks: `docs/designs/design-review-2026-11-05.md`.\n\n| ID | Observation | Resolution |\n|---|---|---|\n| D1 | Page titles are stale on two screens: \"Sign up step 3: Ready\" is now step 4, and \"Onboarding\" has no step number | Done: titles renamed |\n| D2 | The 67 phone screens were generated from desktop layouts by a script and have not been reviewed by eye | Done: reviewed from screenshots; 4 fixes applied to all phone screens |\n| D3 | Wide tables (coach dashboard, my lessons, clients) scroll sideways on phones | Done: stacked cards on phones for coach dashboard, my lessons, clients |\n| D4 | The prototype cannot reach the Under-18 screen by clicking; it is a branch from step 1 | Kept as a server-side branch |\n| D5 | Today, Progress and Gym Today show two different demo users (Kabir for boxing, Neha for gym) | Kept; one data model documented (architecture §4.3) |\n| D6 | Some screens are missing; see section 5 of `risks-and-gaps.md` (1:1 session booking, cancel paid coaching, notifications, coach empty states, report abuse) | Done: 9 new screens; G5, G7, G8 still open |\n"}, {"id": "architecture", "name": "Architecture", "md": "# FitSphere v1: Architecture\n\nStatus: **Proposed. Owner approval needed** (board task S0-01). Items marked *Decision* are open; the rest follows from the approved design doc.\n\n## 1. Shape of the system\n\nOne web app, one database. No microservices.\n\n| Layer | Proposal | Why | Decision |\n|---|---|---|---|\n| Frontend | Next.js App Router, React Server Components, TypeScript strict | Pages render on the server (fast on cheap phones); one codebase for UI and server logic | *O-01* |\n| Server logic | Server Actions for user actions; Route Handlers only for webhooks, AI streaming and cron | Fewer moving parts than a separate API service; actions are typed end to end | *O-01* |\n| Database | Supabase Postgres with row-level security (RLS) | Access rules live in the database, so a UI bug cannot leak data | Approved |\n| Auth | Supabase Auth: email link and Google | No passwords to store | Approved |\n| Files | Supabase Storage, private buckets (credentials), public bucket (coach photos) | Signed URLs for private files | Proposed |\n| Realtime | Supabase Realtime for chat; polling fallback | Built in; no extra service | *Q-07* |\n| Payments | Razorpay Orders, Subscriptions, Route | UPI, cards, net banking and split payouts in India | *O-04* |\n| AI | Claude via the Anthropic API, server-side; retrieval with Postgres full-text search | No embeddings vendor in v1 | Approved |\n| Email | Supabase Auth for sign-in; Resend for product email | Simple API, templates in code | Proposed |\n| Hosting | Vercel (Mumbai functions) + Supabase (Mumbai) | Low latency in India; data stays in India except AI calls | Approved |\n| Monitoring | Error tracking and product analytics | Success criteria need retention numbers | *Q-12* |\n\n## 2. Frontend\n\n### 2.1 Route map\n\nRoute groups share a layout and a server-side role guard.\n\n| Route | Screen(s) | Access |\n|---|---|---|\n| `/` | C-Landing | Public |\n| `/learn/boxing`, `/learn/sc`, `/learn/gym` | C-Library, P-LibrarySC, G-Library | Public |\n| `/learn/[category]/[slug]` | C-Lesson, P-Drill, G-Exercise | Public (published only) |\n| `/search` | P-Search | Public |\n| `/programs`, `/programs/[slug]` | P-Programs, P-Program, G-Program | Public |\n| `/coaches`, `/coaches/[slug]` | P-Coaches, P-Coach | Public |\n| `/for-coaches`, `/for-coaches/applied` | P-ForCoaches, P-Applied | Public |\n| `/about`, `/help`, `/legal/privacy`, `/legal/terms` | P-About, P-Help, P-Legal | Public |\n| `/join/[code]` | A-Invite | Public; join needs sign-in |\n| `/sign-in`, `/sign-in/check-email`, `/auth/callback` | A-SignIn, A-CheckEmail | Public |\n| `/welcome/1` … `/welcome/4`, `/welcome/not-eligible` | Sign-up steps, A-Under18 | Signed in, sign-up unfinished |\n| `/today` | C-Today, G-Today, T-TodayEmpty | Athlete |\n| `/train/[sessionId]` | C-Session, T-SessionSC, G-Workout | Athlete |\n| `/train/[sessionId]/done` | T-SessionDone, G-WorkoutDone | Athlete |\n| `/progress`, `/progress/gym` | C-Progress, G-Progress | Athlete |\n| `/ask` | C-AI | Athlete |\n| `/account`, `/account/programs`, `/account/feedback`, `/account/saved`, `/account/shortlist`, `/account/delete` | T-Account, T-MyPrograms, T-Feedback, T-Saved, X-Shortlist, T-ConfirmDelete | Athlete |\n| `/coaches/compare`, `/hire/[coachSlug]`, `/messages/[conversationId]`, `/checkout/[orderId]`, `/hired/[engagementId]`, `/review/[engagementId]` | X-Compare, X-Hire, X-Chat, X-Checkout, X-Hired, X-Review | Athlete |\n| `/coach` | C-CoachDash | Coach |\n| `/coach/athletes/[athleteId]` | K-Athlete, K-ConfirmRemove | Coach (own athletes only) |\n| `/coach/clients`, `/coach/profile`, `/coach/earnings` | X-CoachRequests, X-CoachProfile, X-Earnings | Coach |\n| `/coach/programs`, `/coach/programs/[id]`, `/coach/programs/[id]/invite` | K-Programs, C-Builder, K-Invite, K-ConfirmReset | Coach (own programs) |\n| `/coach/lessons`, `/coach/lessons/[id]` | K-Lessons, K-Editor | Coach |\n| `/review`, `/review/[itemId]` | R-Queue, R-Review | Reviewer |\n| `/admin/people`, `/admin/credentials` | R-Roles, X-Verify | Admin |\n| `not-found` | P-NotFound | Everyone |\n\n### 2.2 Reusable components\n\nBuilt once in `src/components/`, each with a component test. Names follow the screens.\n\n- **Primitives (`ui/`):** Button (ink, light, grey, volt, ghost; small and large), IconButton, Icon (one set, `name` prop), Tag, Chip (toggle), TextField, TextArea, Select, Checkbox, RadioCard, Switch, Tabs, SegmentedControl, Dialog, ConfirmDialog, Toast, ProgressBar, StepProgress, Avatar, Rating, EmptyState, ErrorState, Skeleton, VisuallyHidden.\n- **Layout (`layout/`):** PublicHeader (with demo strip), AppHeader, CoachHeader, BottomTabs, MobileMenu, Footer, PageTitle (Anton display head), SplitAuthLayout (photo + form), PlayerLayout (dark), AccountLayout (side menu), Section.\n- **Content (`content/`):** LessonTile, ExerciseTile (muscle or supports tag), ProgramCard, VideoEmbed (tap to load), StepsAccordion, RepRangeTable, FilterSidebar, FilterChips, SkillPath, SampleBadge, VerifiedBadge.\n- **Training (`training/`):** WeekStrip, SessionCard, RoundTimer, RestTimer, SetLogger, LastTimeHint, TechniquePicker, EffortPicker, DoneSummary, StatTile, RecordsTable, MuscleVolumeBars, WeightTrend, AdherenceDots.\n- **Coaching (`coaching/`):** FlagCard, AdherenceBoard, LogTable, FeedbackComposer, FeedbackThread, ProgramBuilder (WeekTabs, SessionColumn, ItemEditor, LibraryPicker), InviteLinkPanel.\n- **Marketplace (`marketplace/`):** CoachCard, CompareTray, CompareTable, PackageCard, SlotGrid, CredentialList, ReviewItem, ChatThread, MessageComposer, OrderSummary, PaymentMethodPicker, EarningsChart, RequestItem.\n- **AI (`ai/`):** AiAnswer (labels), CitationChip, SafetyNotice, QuestionComposer, UsageMeter.\n\n### 2.3 Frontend rules\n\n- Server Components by default. A component becomes a client component only for interaction (timers, filters, forms, chat).\n- Forms use Server Actions with Zod validation on the server; errors show next to the field, as in the mockups.\n- Filters and tabs live in the URL so that back and share keep them.\n- Images through `next/image`; video loads only when tapped.\n- Every control: visible focus ring, 44 px touch target, `aria-*` as drawn in the mockups.\n\n## 3. Backend modules\n\nCode in `src/server/<module>/`. Each module has the same four files, so it is easy to find things and test them:\n\n- `schema.ts`: Zod input schemas and TypeScript types.\n- `rules.ts`: pure business logic. No database, no network. Unit-tested.\n- `queries.ts`: reads (server-only).\n- `actions.ts`: Server Actions (writes). Each one checks auth, validates input, calls rules, and writes inside a transaction where needed.\n\n| Module | Owns | Key rules (unit-tested) |\n|---|---|---|\n| `identity` | profiles, roles, consents, applications | age ≥ 18, role grant only by admin, no self-change |\n| `content` | categories, items, steps, links, saves, completions | status transitions, sample handling, skill path order |\n| `review` | review workflow | no self-approval, required checks |\n| `programs` | programs, versions, invites | prescription types, publish versioning, invite code |\n| `enrollment` | enrollments, access windows | access ends on leave, remove or engagement end |\n| `schedule` | program day → calendar date | Asia/Kolkata dates, merge across programs |\n| `logging` | session and set logs | timer state machine, next-target rule |\n| `metrics` | records, adherence, volume, ratings | exact formulas, record rule per metric type |\n| `feedback` | coach notes and replies | visibility after access ends |\n| `marketplace` | coach profiles, packages, slots, requests, shortlist | client limit, no paid ranking |\n| `messaging` | conversations, messages | two-party access |\n| `payments` | orders, payments, subscriptions, refunds, payouts | amount set on server, idempotency, fee split in paise |\n| `reviews` | coach reviews and replies | eligible only after a paid, finished engagement |\n| `ai` | retrieval, prompting, limits | citations valid, no-match mode, safety, daily limit |\n| `notifications` | email | respect user settings |\n| `admin` | credentials, audit | every decision logged |\n\n### 3.1 Route handlers (the only HTTP endpoints)\n\n| Method and path | Purpose | Protection |\n|---|---|---|\n| `GET /auth/callback` | Finish email-link and Google sign-in | Supabase PKCE |\n| `POST /api/payments/webhook` | Payment events | Signature check, idempotency table |\n| `POST /api/ai/ask` | Streamed AI answer | Signed-in, daily limit, rate limit |\n| `GET /api/cron/youtube-check` | Flag broken videos | Cron secret |\n| `GET /api/cron/subscriptions` | Renewal reminders, expiry | Cron secret |\n| `GET /api/me/export` | Download own data as JSON | Signed-in, own data only |\n\nEverything else is a Server Action, for example `createProgram`, `publishProgram`, `joinProgram`, `logSet`, `sendFeedback`, `submitLesson`, `approveLesson`, `sendHireRequest`, `acceptHireRequest`, `createOrder`, `cancelSubscription`, `postReview`, `grantRole`, `markCredentialChecked`.\n\n## 4. Database\n\n### 4.1 Conventions\n\n- Tables: `snake_case`, plural (`content_items`). Columns: `snake_case`.\n- Keys: `id uuid primary key default gen_random_uuid()`; foreign keys `<entity>_id`.\n- Every table has `created_at timestamptz default now()`; mutable tables also `updated_at` (trigger).\n- Status values are Postgres enums (`content_status`, `enrollment_status`, `engagement_status`, …).\n- Money: `amount_paise bigint`, never floats. Weight: `weight_kg numeric(5,2)`.\n- RLS is enabled on every table. Policy names: `<table>_<select|insert|update|delete>_<who>`.\n- Every migration is a file in `supabase/migrations/`, applied in order, never edited after merge.\n\n### 4.2 Entities and relationships\n\n```mermaid\nerDiagram\n    profiles ||--o{ user_roles : has\n    profiles ||--o{ consents : gives\n    profiles ||--o| athlete_prefs : has\n    profiles ||--o{ body_metrics : logs\n    categories ||--o{ disciplines : contains\n    disciplines ||--o{ content_items : groups\n    profiles ||--o{ content_items : authors\n    content_items ||--o{ content_steps : has\n    content_items ||--o{ content_links : \"links to\"\n    content_items }o--o{ muscles : works\n    profiles ||--o{ saves : makes\n    profiles ||--o{ completions : makes\n    profiles ||--o{ programs : \"coach builds\"\n    programs ||--o{ program_versions : \"published as\"\n    program_versions ||--o{ program_sessions : contains\n    program_sessions ||--o{ session_items : contains\n    content_items ||--o{ session_items : \"used in\"\n    programs ||--o{ invites : has\n    profiles ||--o{ enrollments : \"athlete joins\"\n    programs ||--o{ enrollments : has\n    enrollments ||--o{ session_logs : records\n    session_logs ||--o{ set_logs : contains\n    profiles ||--o{ feedback : \"coach writes\"\n    session_logs ||--o{ feedback : \"about\"\n    profiles ||--o| coach_profiles : \"coach has\"\n    coach_profiles ||--o{ packages : offers\n    coach_profiles ||--o{ availability_slots : opens\n    coach_profiles ||--o{ credentials : uploads\n    profiles ||--o{ hire_requests : sends\n    packages ||--o{ hire_requests : \"for\"\n    hire_requests ||--o| conversations : opens\n    conversations ||--o{ messages : contains\n    hire_requests ||--o| orders : \"paid by\"\n    orders ||--o{ payments : has\n    orders ||--o| engagements : starts\n    engagements ||--o{ subscriptions : \"renews via\"\n    payments ||--o{ refunds : may_have\n    payments ||--o{ payouts : splits_to\n    engagements ||--o| reviews : \"reviewed in\"\n    profiles ||--o{ ai_questions : asks\n```\n\nAccess is decided by two link types: an **active enrollment** (free program via invite) or an **active engagement** (paid coaching). A coach's read access to an athlete's logs, sign-up answers and body metrics exists only while one of these is active. One SQL function, `coach_can_read(athlete_id)`, holds this rule, and every related policy calls it.\n\n### 4.3 One data model for every user and sport (decision D5)\n\nThe demo users (Kabir for boxing, Neha for gym) are seed data, not special cases. One `profiles` row per person; a person can hold several roles. Sports are data: `categories` (boxing, sc, gym) and `disciplines` are rows, and preferences per sport live in `athlete_prefs` rows keyed by user and category. Adding cricket later means new rows and content, not new tables or code paths. Every screen reads the same tables whatever the sport.\n\n### 4.4 Views for honest numbers\n\n`v_coach_stats` (athletes coached, programs finished, 3-month retention, adherence), `v_athlete_progress`, `v_muscle_volume_week`, `v_coach_earnings`. All screens read numbers from these views. pgTAP tests compare them to hand-computed values.\n\n## 5. Project structure\n\n```\nfitSphere/\n├─ src/\n│  ├─ app/                 routes (groups: (public) (auth) (athlete) (coach) (review) (admin)), route handlers in app/api\n│  ├─ components/          ui · layout · content · training · coaching · marketplace · ai\n│  ├─ server/<module>/     schema.ts · rules.ts · queries.ts · actions.ts\n│  ├─ lib/                 supabase clients, auth guard, dates (Asia/Kolkata), money (paise), env\n│  └─ styles/              tokens.css (Fight Camp)\n├─ supabase/\n│  ├─ migrations/          numbered SQL migrations\n│  ├─ tests/               pgTAP policy and view tests\n│  └─ seed.sql             demo and sample data (is_sample = true)\n├─ tests/e2e/              Playwright journeys J1–J15\n├─ evals/ai/               AI question set and checker\n└─ docs/                   design, mockups, architecture, plans\n```\n\n## 6. Naming and code conventions\n\n| Thing | Convention | Example |\n|---|---|---|\n| Files and folders | kebab-case | `set-logger.tsx`, `next-target.ts` |\n| React components | PascalCase, one per file | `SetLogger` |\n| Server Actions | verb + noun, camelCase | `logSet`, `publishProgram` |\n| Pure rules | named for the question they answer | `nextTargetLoad`, `isAdult`, `coachShare` |\n| Unit tests | next to the file, `*.test.ts` | `next-target.test.ts` |\n| End-to-end tests | `tests/e2e/<journey>.spec.ts` | `j7-hire-coach.spec.ts` |\n| Database tests | `supabase/tests/<area>_test.sql` | `coach_access_test.sql` |\n| Branches | `task/<board-id>-<slug>` | `task/M3-08-set-logger` |\n| Commits | `<board-id>: <what changed>` | `M3-08: suggest next load after full sets` |\n| Env variables | SCREAMING_SNAKE, `NEXT_PUBLIC_` only for safe values | `RAZORPAY_WEBHOOK_SECRET` |\n\nCode rules: TypeScript strict and no `any`. No business logic in components. No secrets in client code. Money only through `lib/money.ts`. Dates only through `lib/dates.ts`. Each function does one job. No dead code, no speculative options.\n\n## 7. Environments\n\n| Env | App | Database | Payments | Who deploys |\n|---|---|---|---|---|\n| Local | `npm run dev` | `supabase start` | Test keys | Developer |\n| Preview | Vercel per pull request | Separate Supabase \"preview\" project | Test keys | CI |\n| Production | Vercel `main` | Supabase \"production\" project | Live keys after M4-16 | Owner approval only |\n"}, {"id": "risks", "name": "Risks and gaps", "md": "# FitSphere v1: Technical Risks and Missing Requirements\n\nWritten 2026-11-05. Each risk links to the board task that reduces it. Each open question has an owner answer slot.\n\n## 1. Technical risks\n\nLikelihood and impact: High, Medium, Low.\n\n| ID | Risk | Likelihood | Impact | Mitigation | Board |\n|---|---|---|---|---|---|\n| R1 | **Scope.** v1 has six milestones including a payments marketplace. Months may pass before a real user trains. | High | High | Run a private beta with founding coaches after M3, while M4 is built. Decide in Q-01. | O-09 |\n| R2 | **Access-rule bug leaks data.** A wrong RLS policy could show one athlete's health data to another coach. | Medium | High | One function (`coach_can_read`) for coach access; a pgTAP test per rule; Codex review per milestone. | M1-01, M3-04, M4-10 |\n| R3 | **Payments.** Webhooks, retries, refunds, renewals and split payouts are easy to get wrong; money errors damage trust. | Medium | High | Amount set on the server; signature check; idempotency table; paise only; 20-item go-live checklist; test mode until approved. | M4-09…M4-16 |\n| R4 | **Payment provider eligibility.** Split payouts (Route) need business KYC and approval, which can take weeks. | Medium | High | Start KYC now (O-04). Fallback: collect payments, pay coaches manually until Route is live. | O-04 |\n| R5 | **Empty marketplace.** With few coaches, discovery and compare look dead. | High | Medium | Recruit coaches before M4 ships; hide filters with no results; show \"new coaches joining\" honestly. | O-06 |\n| R6 | **Health data and DPDP.** Injury notes and body weight are sensitive; the AI provider is outside India. | Medium | High | Separate consent rows; minimum fields to the AI; legal review; data download and deletion. | M1-04, M1-08, M5-02, O-07 |\n| R7 | **AI says something unsafe or uncited.** | Medium | High | Retrieval from published content only; code-checked rules; 30-question eval run 3 times; daily limit. | M5-01…M5-05 |\n| R8 | **AI cost runs away.** | Low | Medium | Daily question limit per user; usage log with cost; alert at a set daily spend. | M5-03 |\n| R9 | **YouTube videos vanish or go private.** | Medium | Medium | Daily check; author sees a flag; lesson shows a fallback. | M2-10 |\n| R10 | **Date bugs.** \"Today\" depends on time zone; late-night joins can shift a whole program. | Medium | Medium | All date logic in `lib/dates.ts` (Asia/Kolkata), unit-tested at midnight and month edges. | M3-05 |\n| R11 | **Slow on cheap Android phones.** Large photos and client JavaScript. | Medium | Medium | Server components, `next/image`, tap-to-load video, Lighthouse ≥ 80 gate. | M6-05 |\n| R12 | **Phone designs not reviewed.** Phone screens are generated by a script. Reduced: the five most-used were reviewed and fixed (D2). | Medium | Low | Owner reviews key phone screens; each build task is checked at 390 px. | D2, S0-07 |\n| R13 | **Off-platform payments and chat abuse.** Coaches may move clients to WhatsApp; chat may carry abuse. | Medium | Medium | Clear warning; report button; admin can read reported chats only. Needs Q-08. | M4-08 |\n| R14 | **Single developer plus AI.** Knowledge lives in sessions. | Medium | Medium | Board, memory and plan in the repo; small commits; tests as documentation. | All |\n| R15 | **Local tooling.** This PC runs Node 18; current tools need Node 22. | High | Low | Owner upgrades Node before S0-02. | O-03 |\n| R16 | **Deleting accounts versus keeping payment records.** Tax rules require keeping invoices for years; \"delete everything\" conflicts. | High | Medium | Delete personal profile and logs; keep anonymised payment records for the legal period. Needs Q-10 and legal sign-off. | M1-08, O-07 |\n\n## 2. Missing requirements (owner answers needed)\n\n| ID | Question | Why it matters | Blocks | Default if no answer |\n|---|---|---|---|---|\n| Q-01 | Do we run a private beta after M3, before the marketplace ships? | Gets real users months earlier (R1) | Release plan | Yes, with founding coaches only |\n| Q-02 | Is FitSphere free for athletes? Are there paid athlete tiers (the brief mentions Free, Plus, Pro)? | Changes data model and checkout | M4 | Free for athletes; FitSphere earns only the marketplace fee |\n| Q-03 | Can a coach charge for an invite-link program, or are invite programs always free? | Two ways to join a coach: invite (free) and hire (paid) | M3-03, M4-07 | Invite programs are free; paid coaching goes through the marketplace |\n| Q-04 | Fee %, payout timing, refund window, cancel rule, who pays GST, who issues invoices | Needed for payments and earnings | M4-09…M4-13 | None: must be decided |\n| Q-05 | Booking is now designed (X-Book). Open: the cancel and move window, and whether in-person sessions need a deposit. | Refund rules | M4-17 | Full refund up to 24 hours before |\n| Q-06 | Which events send email (feedback, request accepted, payment, renewal failed)? Any WhatsApp or push? | Notification scope | M3-14, M4-11 | Email only, for the five events listed |\n| Q-07 | Does chat need to be instant, or is a refresh every 10 seconds enough? Photos or files in chat? | Realtime cost and moderation | M4-08 | Text only, refresh every 10 seconds |\n| Q-08 | What happens when someone reports a review, message or coach? Who handles disputes? | Trust and safety for a marketplace | New task M4-18 | Report button; admin queue; owner handles disputes |\n| Q-09 | Can coaches see each other's programs or content? Can a coach reuse library items by other coaches? | Builder library scope | M3-02 | Yes, any published library item; programs stay private |\n| Q-10 | Data retention: how long are logs, chats and AI questions kept after an account is deleted or goes quiet? | DPDP and storage | M1-08 | Deleted on account deletion; payments kept anonymised as the law requires |\n| Q-11 | Languages: English only in v1? | Copy and fonts | None | English only (Hindi out of v1) |\n| Q-12 | Which product analytics and error tracking? Success criteria need weekly-return numbers. | No way to measure success otherwise | New task S0-08 | A privacy-friendly analytics tool and an error tracker, chosen at S0-08 |\n| Q-13 | Domain name and sender email address | Sign-in emails and invite links | S0-06 | Must be decided before the first preview with real email |\n| Q-14 | Which browsers and phones must work? | Test matrix | S0-07 | Last 2 versions of Chrome (Android, desktop), Safari (iOS), Edge |\n| Q-15 | Admin tools beyond roles and credentials: hide a lesson, suspend a user, refund by hand? | Operating the marketplace | New task M4-18 | Suspend user and hide content only |\n\n## 3. Screens still missing from the design\n\nFound while mapping journeys to screens. Status updated 2026-11-05 after the owner approved D6.\n\n| ID | Missing screen | Needed by | Status |\n|---|---|---|---|\n| G1 | Book a single 1:1 session (pick a slot, pay, confirmation) | Q-05, M4-17 | Designed: X-Book, X-Booked |\n| G2 | Cancel paid coaching and manage renewal (dates, what happens next) | M4-11 | Designed: X-ManageCoaching, X-CancelCoaching |\n| G3 | Coach dashboard, clients and programs with no data yet | M6-03 | Designed: K-CoachEmpty |\n| G4 | Report a review, message or coach; admin report queue | Q-08, M4-18 | Designed: X-Report, X-ReportSent, R-Reports |\n| G5 | Invoices and receipts list in Account | Q-04, M4-16 | Open |\n| G6 | Coach first-run setup after approval (profile, first program, first lesson) | M1-07 | Designed: K-CoachEmpty |\n| G7 | Email templates (sign-in, feedback, request, payment, renewal) | M3-14, M4-11 | Open (in-app list designed: T-Notifications) |\n| G8 | Offline page for the installed app | M6-04 | Open |\n"}];
let cur = (location.hash || '').slice(1);
if (!DOCS.some(d => d.id === cur)) cur = DOCS[0].id;
function show(id) {
  cur = id;
  const d = DOCS.find(x => x.id === id);
  const html = (window.marked ? marked.parse(d.md) : '<pre>' + d.md.replace(/</g, '&lt;') + '</pre>')
    .replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, '</table></div>')
    .replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, '<pre class="mermaid">$1</pre>');
  document.getElementById('doc').innerHTML = html;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
document.getElementById('tabs').innerHTML = DOCS.map(d => `<button role="tab" data-id="${d.id}">${d.name}</button>`).join('');
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { show(b.dataset.id); window.scrollTo(0, 0); } };
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (DOCS.some(d => d.id === id) && id !== cur) show(id); });
show(cur);
</script>
