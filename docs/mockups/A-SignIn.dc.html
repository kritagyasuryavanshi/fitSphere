<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Hallmark (applied as a floor on an existing design) · kept by owner choice: inline colours (the canvas editor edits them), grey labels above heads and middle-dot meta lines (the approved Fight Camp voice) */
a:active,button:active{transform:translateY(1px)}
button:disabled,a[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
html,body{overflow-x:clip}
body{margin:0;background:#ffffff}
a{color:#111111;text-decoration:none}a:hover{color:#707072}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #111111;outline-offset:2px}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #ffffff; color: #111111; font-family: Inter, Helvetica, Arial, sans-serif">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh">
  <section style="flex: 1 1 480px; min-height: 520px; position: relative; overflow: hidden; background: #111111">
    <img src="/_blob/497ef77b5675b2940aa345dc7313057e" alt="Black boxing gloves hanging in a gym" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></div>
    <a href="C-Landing.dc.html" style="position: absolute; top: 32px; left: 40px; font-family: Anton, Impact, sans-serif; font-size: 28px; text-transform: uppercase; color: #ffffff">FitSphere</a>
    <p style="position: absolute; left: 40px; right: 40px; bottom: 48px; font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; margin: 0; font-size: clamp(56px, 6vw, 104px); color: #ffffff" aria-hidden="true">Glove up.</p>
  </section>
  <main style="flex: 1 1 560px; min-width: 0; padding: 40px 56px 56px; box-sizing: border-box; display: flex; flex-direction: column">
    <a href="C-Landing.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Home</a>
    <form style="margin-top: auto; margin-bottom: auto; padding-top: 48px; display: flex; flex-direction: column; gap: 24px; max-width: 460px; width: 100%">
      <h1 style="font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; margin: 0; font-size: 64px">Log in or join</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #39393b; max-width: 62ch">We email you a sign-in link. No password to remember. New here? The same link creates your account.</p>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 500">Email<input type="email" autocomplete="email" value="kabir@example" aria-invalid="true" aria-describedby="email-err" style="font: inherit; font-size: 16px; font-weight: 400; border: 1px solid #cacacb; padding: 12px 14px; min-height: 48px; box-sizing: border-box; background: #ffffff; color: #111111; width: 100%; border: 2px solid #a3001a"><span id="email-err" style="display: flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; color: #a3001a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>Enter a full email address, like kabir@example.com</span></label>
      <a href="A-CheckEmail.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-size: 16px; font-weight: 500; background: #111111; color: #ffffff; padding: 14px 28px; border-radius: 30px; border: 0">Email me a link</a>
      <div style="display: flex; align-items: center; gap: 12px; color: #707072; font-size: 14px"><span style="flex: 1; height: 1px; background: #e5e5e5"></span>or<span style="flex: 1; height: 1px; background: #e5e5e5"></span></div>
      <a href="A-Onboard1.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-size: 16px; font-weight: 500; background: #ffffff; color: #111111; padding: 13px 27px; border-radius: 30px; border: 1px solid #cacacb">Continue with Google</a>
      <p style="margin: 0; font-size: 13px; color: #707072; line-height: 1.5">FitSphere is for adults 18 and over. By continuing you agree to the <a href="P-Legal.dc.html" style="text-decoration: underline">terms and privacy policy</a>.</p>
    </form>
  </main>
</div>
</div>
