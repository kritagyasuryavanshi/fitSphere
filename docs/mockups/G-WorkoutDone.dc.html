<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitSphere: Workout complete</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Hallmark (applied as a floor on an existing design) · kept by owner choice: inline colours (the canvas editor edits them), grey labels above heads and middle-dot meta lines (the approved Fight Camp voice) */
a:active,button:active{transform:translateY(1px)}
button:disabled,a[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
html,body{overflow-x:clip}
body{margin:0;background:#ffffff}
a{color:#111111;text-decoration:none}a:hover{color:#707072}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #111111;outline-offset:2px}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #ffffff; color: #111111; font-family: Inter, Helvetica, Arial, sans-serif">
<header style="border-bottom: 1px solid #e5e5e5; background: #ffffff">
    <nav aria-label="App" style="max-width: 1440px; margin: 0 auto; padding-left: 40px; padding-right: 40px; box-sizing: border-box; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px">
      <a href="C-Landing.dc.html" style="font-family: Anton, Impact, sans-serif; font-size: 28px; text-transform: uppercase">FitSphere</a>
      <div style="display: flex; gap: 28px; font-size: 16px; font-weight: 500; flex-wrap: wrap"><a href="C-Today.dc.html" aria-current="page" style="text-decoration: underline; text-underline-offset: 6px">Today</a><a href="C-Library.dc.html">Learn</a><a href="C-Progress.dc.html">Progress</a><a href="C-AI.dc.html">Ask AI</a></div>
      <div style="display: flex; gap: 12px; align-items: center"><a href="P-Search.dc.html" aria-label="Search lessons and drills" style="width: 44px; height: 44px; border-radius: 999px; background: #f5f5f5; color: #111111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></a><a href="T-Account.dc.html" aria-label="Kabir, your account" style="width: 44px; height: 44px; border-radius: 999px; background: #111111; color: #ffffff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">K</a></div>
    </nav>
  </header>
  <main>
    <section style="background: {{accent}}; color: #111111">
      <div style="max-width: 1440px; margin: 0 auto; padding-left: 40px; padding-right: 40px; box-sizing: border-box; padding-top: 64px; padding-bottom: 56px; display: flex; flex-direction: column; gap: 16px">
        <p style="margin: 0; font-size: 16px; font-weight: 500">Upper A · Muscle Builder, week 3</p>
        <h1 style="font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; margin: 0; font-size: clamp(72px, 10vw, 160px)">Workout done.</h1>
      </div>
    </section>
    <div style="max-width: 1440px; margin: 0 auto; padding-left: 40px; padding-right: 40px; box-sizing: border-box; padding-top: 40px; padding-bottom: 96px">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); border-top: 2px solid #111111">
        <div style="padding: 24px 24px 24px 0"><p style="margin: 0; font-size: 14px; font-weight: 500; color: #707072">Time</p><p style="margin: 8px 0 0; font-family: Anton, Impact, sans-serif; font-size: 72px; line-height: 0.9">58 min</p></div>
        <div style="padding: 24px 24px 24px 0"><p style="margin: 0; font-size: 14px; font-weight: 500; color: #707072">Hard sets</p><p style="margin: 8px 0 0; font-family: Anton, Impact, sans-serif; font-size: 72px; line-height: 0.9">14</p></div>
        <div style="padding: 24px 24px 24px 0"><p style="margin: 0; font-size: 14px; font-weight: 500; color: #707072">New best</p><p style="margin: 8px 0 0; font-family: Anton, Impact, sans-serif; font-size: 72px; line-height: 0.9">52.5 kg</p><p style="margin: 6px 0 0; font-size: 14px">Bench press × 8</p></div>
      </div>
      <div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
        <section aria-labelledby="mus" style="flex: 2 1 520px; min-width: 0">
          <h2 id="mus" style="margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.01em; font-size: 24px">Sets by muscle today</h2>
          <ul style="margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
            <li><div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Chest</span><span>4 sets</span></div><div role="img" aria-label="Chest 4 sets" style="margin-top: 6px; height: 8px; background: #f5f5f5"><div style="width: 40%; height: 100%; background: #111111"></div></div></li>
            <li><div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Back</span><span>7 sets</span></div><div role="img" aria-label="Back 7 sets" style="margin-top: 6px; height: 8px; background: #f5f5f5"><div style="width: 70%; height: 100%; background: #111111"></div></div></li>
            <li><div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Shoulders</span><span>3 sets</span></div><div role="img" aria-label="Shoulders 3 sets" style="margin-top: 6px; height: 8px; background: #f5f5f5"><div style="width: 30%; height: 100%; background: #111111"></div></div></li>
          </ul>
        </section>
        <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 500">A note for Ananya<textarea rows="3" style="font: inherit; font-size: 16px; font-weight: 400; border: 1px solid #cacacb; padding: 12px 14px; min-height: 48px; box-sizing: border-box; background: #ffffff; color: #111111; width: 100%; resize: vertical">Set 3 on bench was a grind. Shoulder felt fine.</textarea></label>
          <a href="G-Today.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-size: 16px; font-weight: 500; background: #111111; color: #ffffff; padding: 14px 28px; border-radius: 30px; border: 0">Back to Today</a>
          <a href="G-Progress.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-size: 16px; font-weight: 500; background: #ffffff; color: #111111; padding: 13px 27px; border-radius: 30px; border: 1px solid #cacacb">See gym progress</a>
        </aside>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4F000","options":["#D4F000","#FF5A1F","#7CF5D2","#FFFFFF"]},"$preview":{"width":1440,"height":929}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D4F000' };
  }
}
</script>
