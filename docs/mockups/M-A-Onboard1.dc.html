    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></div>

    <p style="position: absolute; left: 40px; right: 40px; bottom: 48px; font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; margin: 0; font-size: clamp(56px, 6vw, 104px); color: #ffffff" aria-hidden="true">Let’s build your camp.</p>

      <h1 style="font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; margin: 0; font-size: 48px; line-height: 0.95">About you</h1>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 420px">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 500; font-size: 13px; color: #707072">Day<input inputmode="numeric" value="12" style="font: inherit; font-size: 16px; font-weight: 400; border: 1px solid #cacacb; padding: 12px 14px; min-height: 48px; box-sizing: border-box; background: #ffffff; color: #111111; width: 100%"></label>

        </div>
      </fieldset>

        <legend style="font-size: 18px; font-weight: 500; padding: 0 0 12px">What do you want to train?</legend>

          <label style="display: flex; gap: 12px; align-items: flex-start; border: 2px solid #111111; padding: 15px; cursor: pointer"><input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #111111; flex: none; margin-top: 2px"><span><span style="display: block; font-size: 16px; font-weight: 500">Strength &amp; Conditioning</span><span style="display: block; font-size: 14px; color: #707072">Built for the ring</span></span></label>
          <label style="display: flex; gap: 12px; align-items: flex-start; border: 1px dashed #cacacb; padding: 16px; color: #707072"><input type="checkbox" disabled="disabled" style="width: 18px; height: 18px; accent-color: #111111; flex: none; margin-top: 2px"><span><span style="display: block; font-size: 16px; font-weight: 500">Cricket</span><span style="display: block; font-size: 14px">Coming later</span></span></label>
        </div>
      </fieldset>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap"><span style="font-size: 13px; color: #707072">Adults 18+ only.</span><a href="M-C-Onboarding.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-size: 16px; font-weight: 500; background: #111111; color: #ffffff; padding: 14px 28px; border-radius: 30px; border: 0; padding-left: 16px; padding-right: 16px">Continue</a></div>
