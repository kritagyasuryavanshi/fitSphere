<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitSphere phone: Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Hallmark (applied as a floor on an existing design) · kept by owner choice: inline colours (the canvas editor edits them), grey labels above heads and middle-dot meta lines (the approved Fight Camp voice) */
a:active,button:active{transform:translateY(1px)}
button:disabled,a[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
html,body{overflow-x:clip}
body{margin:0;background:#ffffff}
a{color:#111111;text-decoration:none}a:hover{color:#707072}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #111111;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 523px; background: #ffffff; color: #111111; font-family: Inter, Helvetica, Arial, sans-serif; display: flex; flex-wrap: wrap">

  <!-- Image side -->
  <section style="flex: 1 1 480px; min-height: 322px; position: relative; overflow: hidden; background: #111111">
    <img src="/_blob/137ed4dcd9c6e0496864e2c33c3d3781" alt="Pair of red boxing gloves" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></div>
    <a href="M-C-Landing.dc.html" style="position: absolute; top: 32px; left: 40px; font-family: Anton, Impact, sans-serif; font-size: 28px; text-transform: uppercase; color: #ffffff">FitSphere</a>
    <h1 style="position: absolute; left: 40px; right: 40px; bottom: 48px; margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(56px, 6vw, 104px); line-height: 0.9; text-transform: uppercase; color: #ffffff">Let's build your camp.</h1>
  </section>

  <!-- Form side -->
  <main style="flex: 1 1 560px; min-width: 0; padding: 16px 20px 20px; box-sizing: border-box">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
      <a href="M-A-Onboard1.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>
      <span style="font-size: 14px; font-weight: 500; color: #707072">Step 2 of 4</span>
    </div>
    <div role="progressbar" aria-label="Onboarding progress" aria-valuenow="2" aria-valuemin="0" aria-valuemax="4" style="margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <span style="height: 4px; background: #111111"></span><span style="height: 4px; background: #111111"></span><span style="height: 4px; background: #e5e5e5"></span><span style="height: 4px; background: #e5e5e5"></span>
    </div>

    <form style="margin-top: 40px; display: flex; flex-direction: column; gap: 36px; max-width: 640px">
      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-family: Anton, Impact, sans-serif; font-size: 40px; line-height: 0.95; text-transform: uppercase; padding: 0 0 6px">Your boxing experience</legend>
        <p style="margin: 0 0 16px; font-size: 15px; color: #707072">We'll start you at the right point on the skill path.</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px">
          <label style="display: flex; gap: 12px; align-items: flex-start; border: 1px solid #cacacb; padding: 16px; cursor: pointer"><input type="radio" name="exp" style="margin-top: 3px; accent-color: #111111"><span><span style="display: block; font-size: 16px; font-weight: 500">Brand new</span><span style="display: block; font-size: 14px; color: #707072">Never thrown a punch</span></span></label>
          <label style="display: flex; gap: 12px; align-items: flex-start; border: 2px solid #111111; padding: 15px; cursor: pointer"><input type="radio" name="exp" checked="checked" style="margin-top: 3px; accent-color: #111111"><span><span style="display: block; font-size: 16px; font-weight: 500">A few classes</span><span style="display: block; font-size: 14px; color: #707072">Know stance and the jab</span></span></label>
          <label style="display: flex; gap: 12px; align-items: flex-start; border: 1px solid #cacacb; padding: 16px; cursor: pointer"><input type="radio" name="exp" style="margin-top: 3px; accent-color: #111111"><span><span style="display: block; font-size: 16px; font-weight: 500">Trained 1+ year</span><span style="display: block; font-size: 14px; color: #707072">Comfortable with combos</span></span></label>
          <label style="display: flex; gap: 12px; align-items: flex-start; border: 1px solid #cacacb; padding: 16px; cursor: pointer"><input type="radio" name="exp" style="margin-top: 3px; accent-color: #111111"><span><span style="display: block; font-size: 16px; font-weight: 500">I spar or compete</span><span style="display: block; font-size: 14px; color: #707072">Looking to sharpen</span></span></label>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 18px; font-weight: 500; padding: 0 0 12px">What do you want? <span style="font-weight: 400; color: #707072">Pick any</span></legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <label style="font-size: 15px; font-weight: 500; background: #111111; color: #ffffff; padding: 10px 18px; border-radius: 30px; display: flex; gap: 8px; align-items: center"><input type="checkbox" checked="checked" style="accent-color: {{accent}}">Learn proper technique</label>
          <label style="font-size: 15px; font-weight: 500; background: #111111; color: #ffffff; padding: 10px 18px; border-radius: 30px; display: flex; gap: 8px; align-items: center"><input type="checkbox" checked="checked" style="accent-color: {{accent}}">Get fitter</label>
          <label style="font-size: 15px; font-weight: 500; border: 1px solid #cacacb; padding: 9px 17px; border-radius: 30px; display: flex; gap: 8px; align-items: center"><input type="checkbox">Build strength</label>
          <label style="font-size: 15px; font-weight: 500; border: 1px solid #cacacb; padding: 9px 17px; border-radius: 30px; display: flex; gap: 8px; align-items: center"><input type="checkbox">Prepare to spar</label>
          <label style="font-size: 15px; font-weight: 500; border: 1px solid #cacacb; padding: 9px 17px; border-radius: 30px; display: flex; gap: 8px; align-items: center"><input type="checkbox">Lose weight</label>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 18px; font-weight: 500; padding: 0 0 12px">Days a week you can train</legend>
        <div role="radiogroup" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; max-width: 420px">
          <button type="button" role="radio" aria-checked="false" style="height: 52px; border: 1px solid #cacacb; background: #ffffff; font: inherit; font-size: 16px; font-weight: 500">2</button>
          <button type="button" role="radio" aria-checked="false" style="height: 52px; border: 1px solid #cacacb; background: #ffffff; font: inherit; font-size: 16px; font-weight: 500">3</button>
          <button type="button" role="radio" aria-checked="true" style="height: 52px; border: 0; background: #111111; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600">4</button>
          <button type="button" role="radio" aria-checked="false" style="height: 52px; border: 1px solid #cacacb; background: #ffffff; font: inherit; font-size: 16px; font-weight: 500">5</button>
          <button type="button" role="radio" aria-checked="false" style="height: 52px; border: 1px solid #cacacb; background: #ffffff; font: inherit; font-size: 16px; font-weight: 500">6</button>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 18px; font-weight: 500; padding: 0 0 12px">Equipment you have</legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 4px 16px">
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 0"><input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #111111">Gloves and wraps</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 0"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #111111">Heavy bag</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 0"><input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #111111">Skipping rope</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 0"><input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #111111">Dumbbells or kettlebell</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 0"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #111111">Gym access</label>
        </div>
      </fieldset>

      <div style="background: #f5f5f5; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 500">Any injuries or limits we should know? <span style="font-weight: 400; color: #707072">Optional</span>
          <textarea rows="2" placeholder="e.g. old left knee injury, avoid jumping" style="font: inherit; font-size: 15px; border: 1px solid #cacacb; padding: 12px; background: #ffffff; resize: vertical"></textarea>
        </label>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #111111"><span>Use this to personalise AI answers. It is sent to our AI provider outside India, without your name or contact details. You can turn this off any time.</span></label>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
        <span style="font-size: 13px; color: #707072">FitSphere is for adults 18+.</span>
        <a href="M-A-OnboardGym.dc.html" style="font-size: 16px; font-weight: 500; background: #111111; color: #ffffff; padding: 16px 16px; border-radius: 30px">Continue</a>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4F000","options":["#D4F000","#FF5A1F","#7CF5D2","#FFFFFF"]},"$preview":{"width":390,"height":1869}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D4F000' };
  }
}
</script>
</body>
</html>
