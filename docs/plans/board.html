 the athlete's start, not weekdays.\n- **Builder** ([[M3-02]], PR #25): `/coach/programs`, `/coach/programs/new`, `/coach/programs/[id]`. The client keeps the whole draft and sends it as JSON; `apps/web/src/lib/program-draft.ts` mirrors `valid_prescription` (load uses the database's text rule, not floating point). \"Unpublished changes\" compares the draft's sessions with the live version (`sessionsKey`). The builder warns before leaving with unsaved changes and remounts after a save (keyed by `updated_at`).\n- **Invites** ([[M3-03]], PRs #24 and #26): one active 32-hex code per program. `/coach/programs/[id]/invite` (copy, WhatsApp, joined list, reset with a confirm screen) and the public `/join/[code]`. Joining needs sign-in, a finished sign-up (step 2), the athlete role, and a published program with a coach; a removed athlete cannot rejoin. Link origins come from `apps/web/src/lib/site-origin.ts`.\n- **Enrollments and access** ([[M3-04]], PR #27): `coach_can_read(athlete)` is the one rule for a coach reading an athlete's data: an active enrollment in a program the caller owns, plus the coach role. Policies on `profiles`, `athlete_prefs` and `athlete_basics` call it. `leave_program` (athlete), `remove_athlete` (owning coach), `my_programs()`. Screens: `/account/programs` with a leave confirm; Remove on the coach's joined list with K-ConfirmRemove.\n- **Versions in effect** ([[M3-06]], PR #28): publishing freezes `title`, `summary` and `weeks` on `program_versions`. `programs` holds only the coach's working values and only its coach can read it (the public policy was dropped). `version_in_effect(program, date)` in SQL and `versionOn` in `packages/core` share one rule: the newest published version whose first day has come. `my_programs` and `invite_info` use today's version.\n- **Today** ([[M3-06]]): `/today` picks the version per date, so a version starting tomorrow shows from tomorrow; it loads drills only for today's sessions. Empty state: paste an invite link (`lib/invite-code.ts` reads links inside chat messages too). Each session card has Start, Continue or Done (M3-07).\n- **Session logs** ([[M3-07]], PR #29): `session_logs` (one per athlete, session and date), `item_logs` (per drill or exercise), `set_logs` ([[M3-08]], PR #30). Clients never write them: `log_drill`, `log_set`, `finish_session` and `save_session_note` check `scheduled_session` (the caller's active enrollment, the version in effect, week 1 day 1 on the start date, up to today). The athlete reads their own for good; a coach reads them through `coach_can_read` **and** `owns_program`. Item and set logs follow the parent's policy.\n- **Player** (`/session/[id]?date=`, full screen in `(athlete)/(player)`): round timer (`packages/core/src/round-timer.ts`), wake lock, per-drill log; the set logger for `sets` items with last time (`lastTime`), the next target (`nextTarget`) and a 90 s rest. It is keyed on completion because Next keeps a visited page's state. Today shows Start, Continue or Done.\n- **Summaries** ([[M3-09]], PR #31): `/session/[id]/done` in `(athlete)/(shell)`, numbers from `summarise()` in `apps/web/src/lib/session-summary.ts`; the note to the coach saves on the log.\n- **Metrics** ([[M3-10]], PR #32): rules in `docs/plans/m3-metrics.md`. `packages/core/src/metrics.ts` (records, hard sets, adherence %, skill rating) and SQL `adherence`, `hard_sets_per_muscle`, `skill_ratings` (security invoker, so RLS decides who sees what). M3-11 and M3-12 must use these and not compute their own.\n- **Coach access rule (fixed in [[session-13]], PR #33):** data tied to one program (logs, and feedback in M3-13) opens to a coach only through `coach_reads_program(athlete, program)`: an active enrollment in THAT program. `coach_can_read` (any of the coach's programs) is for athlete-wide data such as the profile. Programs are private: only the coach and athletes who joined read versions, sessions and drills (`ever_enrolled`); others see a program only through `invite_info`. Feedback also needs an athlete-own policy, so it survives leaving ([[M3-13]] carries the pgTAP check).\n- Helpers: `isUuid` and `ownProgram` in `apps/web/src/lib/programs.ts`; `coachWithProgram` and `newPage` in `apps/web/e2e/helpers.ts`.\n\nOpen follow-ups: [[owner-decisions]]. Hub: [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["M3-01", "M3-02", "M3-03", "M3-04", "M3-05", "M3-06", "M3-07", "M3-08", "M3-09", "M3-10", "M3-13", "db", "owner-decisions", "project-overview", "session-11", "session-12", "session-13"]}, {"id": "project-overview", "type": "area", "description": "Root hub. What fitSphere is, v1 scope, and links to every area", "updated": "2026-11-12", "body": "fitSphere is a sports learning, training and coaching platform for adult boxing beginners and independent coaches in Indian cities.\n\nv1 has three pillars ([[decision-three-pillars]]): a video learning library, a grounded AI assistant ([[ai-assistant]]), and coach-led training. The coach marketplace is in v1 too ([[marketplace]]).\n\nSources of truth: `PROJECT.md`, `docs/designs/fitsphere-v1.md`, `docs/PRODUCT_BRIEF.md`.\n\nAreas:\n- [[stack]]: the code structure and tools.\n- [[categories]]: Boxing, S&C, Gym & Fitness.\n- [[programs]]: coach programs, invites, enrollments and the coach access rule (M3).\n- [[design-system]] and [[mockups]]: the Fight Camp look.\n- [[db]]: Supabase, migrations and tests.\n- [[ci]]: GitHub Actions.\n- [[build-board]]: tasks and the working loop.\n- [[architecture-docs]]: analysis, risks and open questions.\n- [[owner-decisions]]: what waits on the owner.\n- [[constraints]]: project-wide rules.\n- [[memory-system]]: how this memory works.\n- [[tooling]]: Claude tools, plugins and permissions.\n- Environments: [[env-lenovo-pc]], [[env-welcome-pc]].\n- Owner: [[owner-profile]].", "date": "", "pc": "", "status": "", "links": ["ai-assistant", "architecture-docs", "build-board", "categories", "ci", "constraints", "db", "decision-three-pillars", "design-system", "env-lenovo-pc", "env-welcome-pc", "marketplace", "memory-system", "mockups", "owner-decisions", "owner-profile", "programs", "stack", "tooling"]}, {"id": "route-guards", "type": "area", "description": "2026-11-12: how protected routes are guarded (M1-05), and the rules every new page must follow", "updated": "2026-11-12", "body": "- Every page, route handler and server-action file under `(athlete)`, `(coach)` or `(admin)` awaits `requireRole(role)` from `apps/web/src/lib/viewer.ts` first. `guards.test.ts` fails the build if one does not ([[M1-05]]).\n- Layouts only draw shells. Next 16 does not re-run layouts on navigation, so a layout check is no guard.\n- `readAccount` is the one reader of sign-up state and roles. Sign-up is done after step 2 ([[M1-04]]); a failed read throws.\n- A guest goes to `/sign-in`, an unfinished sign-up to its next step, a missing role to `/not-allowed`.\n- `(account)` pages use `requireSignedIn()` instead: every signed-in person can download, delete and log out ([[M1-08]]).\n- `/auth/confirm` is test-only (`E2E_AUTH_CONFIRM=1`, set by Playwright). Owner decision before real emails use it: add a \"Continue\" page that POSTs, to stop login CSRF ([[owner-decisions]]).\n- The proxy matcher needs `\\.` in the string. A single backslash once made the proxy run only on `/`; `proxy.test.ts` guards it.\n- e2e signs users in with `signInAs` / `createUser` in `apps/web/e2e/helpers.ts`, through the admin API. No email, no rate limit.", "date": "", "pc": "", "status": "", "links": ["M1-04", "M1-05", "M1-08", "owner-decisions"]}, {"id": "session-1", "type": "session", "description": "2026-11-04: repo, brief, office hours, approved v1 design", "updated": "2026-11-04", "body": "## Done\n- Created the repo, the docs scaffold and the private GitHub remote ([[decision-project-folder]], [[decision-git-author]]).\n- Saved the brief to `docs/PRODUCT_BRIEF.md`. Ran /office-hours. Approved design: `docs/designs/fitsphere-v1.md`.\n- Decisions: [[decision-three-pillars]], [[decision-launch-sports]], [[decision-coach-review-flow]], [[decision-ai-grounding]], [[decision-adults-only]], [[decision-pwa-stack]], [[decision-health-consent]], [[decision-out-of-v1]].\n- One review round found 6 blocking issues, all fixed.\n- Lesson: [[lesson-bun-gstack]]. Owner style: [[owner-profile]].", "date": "2026-11-04", "pc": "lenovo", "status": "", "links": ["decision-adults-only", "decision-ai-grounding", "decision-coach-review-flow", "decision-git-author", "decision-health-consent", "decision-launch-sports", "decision-out-of-v1", "decision-project-folder", "decision-pwa-stack", "decision-three-pillars", "lesson-bun-gstack", "owner-profile"]}, {"id": "session-10", "type": "session", "description": "2026-11-13: all M1 PRs merged; milestone M2 built, reviewed by Codex and merged task by task", "updated": "2026-11-13", "body": "## Done\n- PRs #1 to #11 merged. CI on `main` is green ([[ci]]).\n- M2-01 content schema, PR #12: disciplines, muscles, content items, steps, links and muscle links ([[db]], [[categories]]).\n  Nobody writes content rows directly. `submit_content` checks completeness. `review_content` publishes or sends back with a note, and refuses `own_item`.\n- M2-02 sample content, PR #13: 14 boxing, 9 S&C and 11 gym items, all published samples, no videos. `seed_sample_content()` is idempotent.\n- M2-03 library pages, PR #14: `/learn/[category]` with URL filters built from the items. `author_names()` exposes names of published authors only.\n- M2-04 lesson pages, PR #15: `/learn/[category]/[slug]`, video on tap through youtube-nocookie, rep table per goal.\n- M2-05 search, PR #16: `/search` and `search_content(q)` with Postgres full-text.\n- Codex reviewed every PR. One P2 on M2-03 was rejected with evidence: the field it said was missing is set, and e2e covers it.\n\n- M2-06 save and complete (PR #17), M2-08 coach editor (PR #18), M2-09 review queue (PR #19), M2-07 skill path (PR #20), M2-10 daily video check and M2-11 milestone check (PR #21). Evidence: [[M2-check]].\n- Codex findings this round: revalidate only lesson paths (fixed), hyphens in category ids (fixed), batch the video checks (fixed). Rejected with evidence: an unchanged export function, and unscoped reads that RLS already scopes.\n\n- After the final Codex pass on PR #21: the video check rotates by `video_checked_at`, and `updated_at` moves only on real content edits (pgTAP `video_broken_test.sql`).\n- Test-first slipped on M2-10's route and M2-11: their tests came right after the code, not before.\n\n## Bugs and errors\n- Next 16 Cache Components: see [[lesson-next16-suspense]].\n- An old server held port 3000, and the classifier blocked inspecting it. `E2E_PORT` in `playwright.config.ts` runs e2e on another port. Magic-link specs still need 3000.\n\n## Decisions\n- The coach draft-save function moves from M2-01 to M2-08, where the editor sets its rules.\n- Samples carry no video. Invented YouTube ids would embed someone else's video.\n- Category rules are data: `categories.uses_supports` and `uses_muscles` drive the submit check (decision D5).\n\n## Next\n- M3 Coach-Led Training, starting with the first ready M3 task on the board.\n- Two phone and desktop e2e runs that create the same slug raced; `save_content_draft` now retries a unique clash with a suffix.\n- `authorNames` with the guest client cannot see reviewer-only names; pass the signed-in client.", "date": "2026-11-13", "pc": "lenovo", "status": "", "links": ["M2-check", "categories", "ci", "db", "lesson-next16-suspense"]}, {"id": "session-11", "type": "session", "description": "2026-11-14: M3 started: program schema, schedule maths and invite links built; PRs #22 and #23 open", "updated": "2026-11-14", "body": "Follows [[session-10]]. M2 is done: [[M2-check]].\n\n## Done\n- M3-01 program schema, PR #22 (branch `m3-01-program-schema`): programs, versions, sessions and typed items ([[db]]).\n  A program has one draft and frozen published versions. `save_program_draft` replaces the whole draft. `publish_program` freezes it.\n  The first version is live today in India; later versions start tomorrow. `valid_prescription` checks rounds, time and sets.\n- M3-05 schedule maths, PR #23 (branch `m3-05-schedule`, stacked on #22): `addDays`, `programDay`, `sessionsOn` in `packages/core`.\n- M3-03 invites, database part only (branch `m3-03-invites`, stacked on #23, pushed, no PR yet): `invites`, `enrollments`,\n  `program_invite`, `reset_invite`, `invite_info`, `join_program`, `program_members`. pgTAP passes. Codex: concurrent join fixed;\n  the invite-creation race was rejected, because `own_draft` locks the program row first.\n\n## Bugs and errors\n- `valid_prescription` returned null for a missing number, so a bad prescription passed. It now treats null as invalid.\n- The programs and versions policies recursed into each other; security-definer helpers `owns_program` and `program_is_published` break the loop.\n- GitHub API timed out for several minutes; retry pushes with `timeout 150 git push`, and pass `--head` to `gh pr create`.\n\n## Decisions\n- The `/goal` for M2 said \"write tests first\", which cannot be repaired after the fact and trapped the stop hook. The M3 goal says \"add tests that fail without the code\" instead.\n\n## Next\n1. Wait for CI on #22 and #23, then merge them in order.\n2. Open the M3-03 PR (database part), then build M3-02 builder and programs list (K-Programs, C-Builder), then the M3-03 screens: `/coach/programs/[id]/invite` (K-Invite, K-ConfirmReset) and `/join/[code]` (A-Invite).\n3. Then M3-04 (leave, remove, `coach_can_read`), M3-06 Today, and on through the M3 list on the board.", "date": "2026-11-14", "pc": "lenovo", "status": "", "links": ["M2-check", "db", "session-10"]}, {"id": "session-12", "type": "session", "description": "2026-11-19: WELCOME PC brought up to date; M3-02 to M3-04, M3-06 Today, then M3-07 player, M3-08 set logger, M3-09 summaries and M3-10 metrics; PRs #24 to #32", "updated": "2026-11-19", "body": "Follows [[session-11]]. Hub for this work: [[programs]].\n\n## Done\n- WELCOME PC caught up: 100 commits pulled, `npm ci`, local DB reset, `apps/web/.env.local` rewritten with `SUPABASE_SECRET_KEY` (as CI writes it), Playwright Chromium installed. Docker now starts at sign-in; sleep is off on AC; Windows Update paused to 2026-11-25 ([[env-welcome-pc]], [[lesson-docker-welcome]]).\n- The owner works from an iPhone through Remote Control while this PC runs ([[multi-pc-workflow]]).\n- M3-03 database part, PR #24, merged. Fixed first: joining needed only step 1 of sign-up. Review fixes: removed athletes cannot rejoin, the link closes when the coach deletes their account, a reset link reveals nothing, the join locks the invite row, the joined list shows active members only and needs the coach role, and the data download lists programs ([[db]]).\n- M3-02 builder, PR #25, merged ([[M3-02]]). Review fixes: two-decimal loads (floating point), unpublished drills marked, \"Unpublished changes\" compares content, unsaved-changes warning, day order.\n- M3-03 screens, PR #26, merged ([[M3-03]]). Review fixes: the join page reads the real enrollment (a `?joined=1` URL faked it), states for own program, removed and no athlete role, `lib/site-origin.ts`, `lib/programs.ts`.\n- M3-04, PR #27 ([[M3-04]]): `coach_can_read`, leave and remove with confirm screens, My programs, and the athlete role on joining. Review fixes: removing someone who already left, or leaving after removal, no longer reports the wrong outcome; `remove_athlete` returns its program. /security-review found nothing exploitable on #24, #26 and #27.\n\n- M3-06 Today, PR #28 ([[M3-06]]): versions freeze title and length; Today with the week strip, rest day and empty state; phone layout checked from screenshots. Review fixes: per-date versions, `invite_info` on today's version, no public read of `programs`, chat-pasted links, drills linked only while published, drills loaded for today only.\n- M3-07 boxing player, PR #29 ([[M3-07]]): `session_logs` and `item_logs` written only by `log_drill` and `finish_session` for a session the caller's enrollment schedules; round timer in `packages/core`; full-screen `/session/[id]` with wake lock; Start, Continue or Done on Today. Today moved into `(athlete)/(shell)`; the player sits in `(athlete)/(player)`. Review fixes: a finished session opens on its summary, an edit from the summary returns there, sets refused until M3-08, pause and skip apply the elapsed time.\n- M3-08 set logger, PR #30 ([[M3-08]]): `set_logs` (reps, kg to two decimals or bodyweight, RPE) by `log_set`, one set per call; `nextTarget` (+2.5 kg only when every planned set hit the reps); last time per exercise; 90 s rest with Add 30 s. Review fixes: floating-point loads such as 1.1 kg were refused, two blocks of one exercise merged, a partial workout raised the target.\n- M3-09 summaries, PR #31 ([[M3-09]]): `/session/[id]/done` from `summarise()`; `finish_session` takes the server-stamped open time; `save_session_note` for finished sessions only. Review fixes: SQL and JS trim the note alike, the review link carries the date.\n- M3-10 metrics, PR #32 ([[M3-10]]): rules in `docs/plans/m3-metrics.md`; `packages/core/src/metrics.ts`; SQL `adherence`, `hard_sets_per_muscle`, `skill_ratings` as security invoker under RLS. Review fixes: muscle bars per workout, one primary muscle per exercise (unique index), stable rating order.\n- /security-review on #29 to #32: nothing exploitable found.\n\n## Bugs and errors\n- PR #24 got no CI run: it conflicted on the generated `board.html` ([[lesson-conflict-skips-ci]]).\n- A PowerShell text pipeline garbled `×` and `·` in an e2e spec ([[lesson-windows-powershell-utf8]]).\n- e2e locators: soft 404 status, hidden previous pages, and `sr-only` names ([[lesson-next16-suspense]]).\n- PR #29 merged while CI on its last commit was pending; the run passed afterwards ([[lesson-merge-checks-head-sha]]).\n- `npm run test:db` failed once after e2e had filled the database; `db:reset` first fixed it ([[lesson-prod-build-e2e]]).\n- Next keeps a visited page's client state: the player reopened mid-session after finishing until it was keyed on completion ([[lesson-next16-suspense]]).\n- Stale `.next/dev/types` from 9 November broke the first typecheck; deleting `apps/web/.next/dev` fixed it ([[lesson-prod-build-e2e]]).\n\n## Decisions\n- A rebase of a pushed branch was undone: it needs a force-push. Branches take merge commits instead.\n- The builder's days are Day 1 to 7 from the athlete's start, not weekdays, to match the schedule maths.\n- Two sessions on one day are allowed (morning and evening).\n- Coaches see an enrolled athlete's profile, sport answers and training basics. Body metrics wait for M3-11.\n- \"Past feedback stays visible\" moved from M3-04 to M3-13, where the feedback table is built.\n- Logs are written only through functions that check the schedule; a coach reads them through `coach_can_read` and only for programs they own, so a note to one coach never reaches another.\n- A hard set is 1+ rep at RPE 7 or more; every set logs its RPE. Adherence counts today. Records: heaviest load for 1+ rep, or most bodyweight reps; a first log is a baseline. All in `docs/plans/m3-metrics.md`.\n- Sets have no rest in the prescription, so the rest timer uses 90 s with Add 30 s.\n- \"New best\" on the gym summary moved to M3-11 (progress pages), which also needs the history.\n\n## Needs you\n- The follow-ups in [[owner-decisions]]: rest time per exercise, and the open items from earlier.\n\n## Next\n1. M3-11 progress pages (boxing and gym) and body weight, on the M3-10 functions; then M3-12 coach dashboard.\n2. The follow-ups in [[owner-decisions]]: invite return-to after sign-in, the draft version check.", "date": "2026-11-19", "pc": "welcome", "status": "", "links": ["M3-02", "M3-03", "M3-04", "M3-06", "M3-07", "M3-08", "M3-09", "M3-10", "db", "env-welcome-pc", "lesson-conflict-skips-ci", "lesson-docker-welcome", "lesson-merge-checks-head-sha", "lesson-next16-suspense", "lesson-prod-build-e2e", "lesson-windows-powershell-utf8", "multi-pc-workflow", "owner-decisions", "programs", "session-11"]}, {"id": "session-13", "type": "session", "description": "2026-11-19: LENOVO PC caught up; independent review of M3-01 to M3-10 (PR #33); M3-11 to M3-16 and the M3-15 check (PRs #34 to #39); production on Supabase and Vercel; M3 done", "updated": "2026-11-19", "body": "Follows [[session-12]]. Hub for this work: [[programs]].\n\n## Done\n- LENOVO PC caught up: 50 commits pulled, `package-lock.json` unchanged, local DB reset. `npm run verify` and 409 pgTAP tests passed before any change.\n- The WELCOME PC has no Codex, so the M3-01 to M3-10 work (PRs #22 to #32) got its independent review here. Codex, `/code-review high` and a Ponytail review ran on the whole M3 diff.\n- PR #33 fixes nine findings: coach log access per program (`coach_reads_program`), private programs (`ever_enrolled`), the published title in the data download, prescriptions without extra keys, the session time from when the player opened, the builder's leave warning after a failed save, the programs list flagging title, summary and length edits, the next target from the planned sets only, and a stable `created_at` order for skill ratings. New pgTAP `m3_review_fixes_test.sql` (8 of 12 failed before the fix); 421 pgTAP tests pass.\n- `/security-review` and Codex on PR #33: no findings.\n- M3-11, PR #34 ([[M3-11]]): `/progress` (boxing and S&C) and `/progress/gym` from the M3-10 functions; `records()` in `lib/progress.ts`; `log_body_weight` (one per India day, keeps the last height, locks the profile row against double saves); the coach reads body weight through `coach_can_read`; \"New best\" on the workout summary. Codex and `/code-review high` found 9; fixed 7, rejected 2 with evidence.\n\n## Bugs and errors\n- The first production push ran against the local stack: Supabase CLI v3 needs `--remote` ([[lesson-supabase-remote-flag]]).\n- Codex's two Today findings were wrong: Today uses each date's version, and `my_programs()` has no date filter.\n- Port 3000 was taken on this PC, so e2e ran on 3123 and the 23 sign-up and sign-in tests failed on the email redirect ([[lesson-prod-build-e2e]]).\n\n## Decisions\n- Body weight shows to the current coach, height too: sign-up step 3 already says \"Only you and your coach see these\".\n- \"New best\" is per date, as `m3-metrics.md` defines it, and compares within a sport group (boxing with S&C, or gym), so the summary and progress page agree.\n- Records load every log of the group: marked `shortcut:` in `progress-view.tsx`; move to SQL near 1,000 logs.\n- Programs are not public. The old rule let anyone, even a guest, read every published program. No screen needed it, and joining goes through `invite_info`. M4 can open a deliberate public view if the marketplace needs one.\n- Load validation stays in its three places (client, action, database); only the whole-number check is shared now.\n\n## Done (hosting)\n- Production Supabase project `fitSphere` (`mxrwjhdqglozdxsgtjgw`, Mumbai) created by the owner. The owner linked it from `packages\\db` and pushed all 29 migrations with `--remote`. `migration list --remote` shows 29 of 29 matching.\n\n- Vercel: the owner imported the repo as `fitsphere` (Root Directory `apps/web`). Claude installed the Vercel CLI, set the 4 variables by piping values from the Supabase CLI (none shown in chat), and redeployed: the first build had no variables and returned 500. Live site reads production data ([[env-production]]).\n\n- M3-12, PR #35 ([[M3-12]]): coach dashboard at `/coach` with stat tiles, flags (`coachFlags` in `lib/coach-flags.ts`) and the weekly board; phones get stacked cards. Codex and `/code-review high` found 9; all fixed: 1,000-row cap, rejoined athletes, stale flags, wording, program on flag cards. Pain flag has no source until M5.\n- The owner approved merging on green CI and review, which deploys production ([[decision-merge-deploys]]). Sleep is off on AC power on the LENOVO PC.\n\n- M3-13, PR #36 ([[M3-13]]): `feedback` and `feedback_replies` (write only through `give_feedback` and `reply_feedback`; read-only grants), the coach athlete page `/coach/athletes/[enrollment]`, Coach feedback `/account/feedback`, the newest feedback on Today. Replies close once the athlete leaves. Security review: no findings; Codex and two `/code-review high` passes: fixed 12. Migration pushed to production with the owner's approval before the merge; 30 of 30 match.\n- C: filled up (391 MB free): Docker went read-only. CI ran the database tests meanwhile; types came from CI's diff. After the owner freed space, a full `wsl --shutdown` was needed to clear the read-only disk ([[lesson-docker-welcome]]).\n- S0-06 done in practice: Vercel builds a preview for every PR.\n\n- M3-14, PR #37 ([[M3-14]]): `email_prefs` switch, `give_feedback` queues the email, `claim_emails` claims atomically (10-minute rest, 5 tries, 7-day staleness, switches checked at sending), `lib/email.ts` and `lib/email-send.ts` (Resend with an idempotency key, paced, 10 s timeout, only with `RESEND_API_KEY`, `EMAIL_FROM` and `NEXT_PUBLIC_SITE_URL`). Codex 2 and `/code-review high` 10 findings, all fixed. Migration pushed before the merge; 31 of 31 match.\n- The owner asked for full autonomy ([[decision-autonomy]]) and a showcase and sellable version: estimate about 1 week to a demo, 2 to 3 weeks to selling to coaches by hand.\n\n- M3-16, PR #38 ([[M3-16]]): `notifications` (own rows, read-only grants) from triggers (feedback, a coach's new lesson) and `queue_session_reminders` (daily cron at 08:30 India time, once per athlete per day, every session named); `/account/notifications` with unread marks, Mark all as read and three email switches (reminders start off); `email_wanted` decides at queueing and sending; a reminder email only goes out on its own day. Security review: no findings. Codex's one finding was wrong (it read 03:00 UTC as 08:30 UTC); `/code-review high` found 6, all fixed. 32 of 32 migrations on production.\n- The owner moved every \"ask\" rule to \"allow\" and added the `--db-url` deny; committed so both PCs share it.\n\n- M3-14 after merge: `/security-review` of PR #37 (email_prefs, claim_emails, give_feedback email, Resend sender, cron): no findings. Live check: `/account/feedback` loads; `/api/cron/send-emails` returns 401 without the secret.\n- Final M3 production check: 4 new tables, 8 functions and 2 triggers present; RLS on notifications; /account/notifications, /account/feedback, /coach, /progress/gym and /legal/privacy load; the menu links only to real pages.\n- Live e2e: `links.spec.ts` run against https://fit-sphere-xi.vercel.app (temporary config, no web server, read-only): 4 of 4 pass on desktop and phone. Signed-in e2e cannot run against production by design: it signs in through `/auth/confirm`, which is off unless `E2E_AUTH_CONFIRM=1` (only the Playwright web server sets it), because enabling it in production would be a sign-in bypass. So signed-in journeys run on a production build locally and on CI.\n- Process miss: M3-14's `/security-review` ran after its merge, not before (no findings). Lesson: for every PR that touches RLS, grants or security-definer functions, start `/security-review` together with Codex and `/code-review`, before the merge.\n- M3-15, PR #39: the M3 milestone check passed; M3 is done ([[M3-check]]). Live-site QA fixed dead menu links, added privacy and terms pages (they match what coaches can actually read), `/learn`, and a contrast failure.\n\n- M4 started. The owner chose to build the full plan (M4, M5, M6) instead of the demo detour. The planner wrote `docs/plans/m4-plan.md`: engagements replace hire_requests; access follows `paid_through`; `apply_payment_event` is the only writer of money state; payouts are held until the refund window closes; about 75% is buildable with a fake provider.\n- M4-01, PR #40: coach_profiles, packages, availability_slots, credentials and a private `credentials` bucket. Column grants keep the payout account, the agreement and the client limit away from clients; live means published and still holding the coach role. Supabase refuses SQL deletes on storage.objects, so `deleteAccount` removes credential files through the Storage API. Security review, Codex and `/code-review high` all ran before merge; 12 findings fixed; a second security look at the fixes found nothing. 33 of 33 migrations on production.\n\n- M4-03, PR #41: `/coach/credentials` (direct browser upload into the private bucket, because Vercel caps server requests at about 4.5 MB) and `/admin/credentials` (X-Verify, 10-minute signed links). `decide_credential`: admins only, never their own, a reject needs a note, every decision in `audit_log`. A pending or checked credential's file is locked (`credential_file_locked` in the storage delete policy); `withdraw_credential` and Remove free it; account deletion withdraws first. All three reviews before merge; 9 findings fixed; a second security look found nothing. 34 of 34 migrations on production.\n- Subagent rate limit hit at the end of the day (resets 00:30 IST).\n\n- M4-02, PR #42: `/coach/profile` (X-CoachProfile) with packages in rupees, weekly slots, the coach agreement (a plain draft, version `draft-2026-11`, pending owner item O-05) and Go live; credentials moved to `/coach/profile/credentials`; `/coaches/[id]` is the first public profile. Going live needs the current agreement, a headline and a live package, and a live profile keeps them (`assert_live_ready`). `coach_is_live` needs the current agreement, so a version bump hides coaches until they accept again; `coach-agreement.test.ts` pins the text to its version. `my_coach_profile` never returns the payout account. All three reviews before merge; 9 findings fixed. 35 of 35 migrations on production.\n- Lesson: `npm run verify` can fail locally when typecheck and build race on `.next/types`; rerun it alone before treating it as a real failure.\n\n- M4-04, PR #43: `/coaches` (P-Coaches). `find_coaches` (definer, anon) lists live coaches with 8 filters and fixed sort keys only (best, rating, price, checked); any other key is refused, so rank can never be bought. `coach_filter_options` gives every live coach's specialties, cities and languages. Rating is empty until M4-14 redefines `find_coaches`. A price range matches any live monthly package. `FilterForm` now auto-submits choices only, so typed fields wait for the button. Coaches is in the header and the phone menu. 36 of 36 migrations on production.\n- Fixed the verify race for good: in turbo.json, build depends on typecheck in the same package.\n- Lesson: the production `db query --read-only` role cannot run anon-granted functions (42501); check those through the live site.\n\n- M4-05, PR #44: `coach_stats` (definer, anon) gives athletes coached, programs finished, stayed 3+ months and average adherence from enrollments and logs. Finished means the enrollment ran past its last day with at least half its sessions done. The percentages need 5 athletes and show to the nearest 10%. `/coaches/[id]` shows the stats, a portfolio of published lessons, an empty reviews section and years marked self-reported. 37 of 37 migrations on production.\n- Decision: programs stay off the public profile. They are invite only (M3), and a program made for one client can name them in its title. New task M4-05b lets a coach choose to list a program.\n- Lesson: a public aggregate needs a floor and rounding. 3 people let 0% or 100% show each person's outcome, and day-to-day changes show a newcomer's.\n\n- M4-06, PR #45: `shortlists` with owner-only RLS, written through `shortlist_coach` (athletes only, live coaches only, never yourself, at most 20 live, with a per-athlete lock). `find_coaches` takes `ids`. `/shortlist` has Compare selected and Remove, and Remove lists every saved coach, so one who stops being live never gets stuck. `/coaches/compare` shows the mockup rows for up to 3 coaches. The shortlist is in the data download. 38 of 38 migrations on production.\n- Lesson: anything keyed to \"live\" coaches must handle a coach who stops being live. A new agreement version hides them all at once.\n\n- M4-07, PR #46: `engagements` holds the whole hire state machine. A request copies the package, its price and `platform_fee_bps()`. That fee is a 15% default until O-05, and it lives in one function. Requests and accepts lock the coach's row, and an accept also locks the request, so the client limit and withdrawals stay consistent. Deleting an account closes its open requests through a trigger on profiles. The pages are `/hire/[coach]`, `/coaching` with Withdraw and Pay (the Pay page waits for M4-09), and `/coach/clients`. 39 of 39 migrations on production.\n- Lesson: every coach also has the athlete role, so a \"mine\" query over a two-party table must filter by the side it means (`athlete_id = me`), not trust RLS.\n- Follow-ups recorded: M4-10 adds paid clients to `coach_stats`; M4-19 blocks deletion during a paid engagement.\n\n- M4-08, PR #47: `conversations` and `messages` are readable only by the two people. A conversation opens by engagement id, for either party only. It turns read-only once every engagement between the pair was declined, withdrawn or expired, or the coach is suspended. Deleting an account erases that person's messages and any conversation left empty. An open chat re-reads every 4 seconds; switching to Realtime is a noted shortcut. The page shows the latest 200 messages. The data download has whole conversations. 40 of 40 migrations on production.\n- Lesson: a browser sends a line break as `\n`. Normalise it before any length check, and trim all whitespace, not only spaces.\n- Stopped here, per the M4 goal: M4-09a turns `fee_bps` into money, so it needs owner item O-05 (the fee, the refund terms and the payout hold) or the owner's \"use the defaults\".\n\n- M4-05b, PR #48: `programs.show_on_profile` is off by default and set through `set_program_listed`, for the owner's published programs only. `coach_programs` lists at most 6, using the version in effect today, with the enrolled count in bands of 5. 41 of 41 migrations on production.\n- Lesson: an exact public count is a privacy leak over time, because watching it drop reveals who left. Use bands or counts that never go down.\n\n## Next\n1. When the owner answers O-05: M4-09a, the payment core with a fake provider. M4-09b needs Razorpay test keys.\n2. The demo work: demo accounts with realistic data and one-click entry, then a domain and Resend (owner).\n2. Then M4 (marketplace) only once coaches pay by hand, per the owner's sell-to-coaches-first plan.\n2. Hosting: the owner sets the Supabase Auth URL configuration; then test sign-in on the live site and run the Supabase security advisors once.\n3. Install Codex on the WELCOME PC (`npm i -g @openai/codex`, then `codex login`), so every PR gets its review on either PC.", "date": "2026-11-19", "pc": "lenovo", "status": "", "links": ["M3-11", "M3-12", "M3-13", "M3-14", "M3-16", "M3-check", "decision-autonomy", "decision-merge-deploys", "env-production", "lesson-docker-welcome", "lesson-prod-build-e2e", "lesson-supabase-remote-flag", "programs", "session-12"]}, {"id": "session-14", "type": "session", "description": "2026-11-21: M4-09a and M5-01 to M5-04 merged, the Gemini adapter, M4-10, M4-11a; M4-19 open; the disk filled up", "updated": "2026-11-21", "body": "Follows [[session-13]]. Hubs: [[marketplace]] and [[ai-assistant]].\n\n## Done\n- The repo went public, so GitHub Actions runs free. PRs #49 to #57 are merged with green CI, each migration on production first. Production has 48 of 48 migrations.\n- M4-09a, the payment core on a fake provider, is PR #49.\n- M5-01 to M5-04 are the AI guide: retrieval, answers, the daily limit and usage log, and the Ask AI screen. They are PRs #50 to #53.\n- M5-05 is the eval, in PR #54. PR #55 adds a free Gemini adapter, allowed only on local test runs.\n- M4-10, in PR #56: paid coaching opens coach access with the athlete's sharing choice, coaches assign programs, and paid clients count in the stats.\n- M4-11a, in PR #57: monthly renewal on a fake subscription, cancel, failed payments, the daily sweep, stopping orphaned subscriptions, and emails for each change.\n- The board gained M4-11b and M4-19. Version 30 of the board artifact is published.\n\n## Bugs and errors\n- The disk filled up ([[lesson-disk-full-turbo]]). Background runs were stopped for low memory, and the local database ran out of connections.\n- Locally, e2e must run against a production build: `CI=1 E2E_PORT=3100`. An old `next start` holds port 3000 ([[lesson-prod-build-e2e]]).\n- A board update once pushed an invalid board, because `build_board.py | tail -1` hid the failure. It is fixed, and the check now runs without a pipe.\n\n## Decisions\n- Coaches get one day of access grace on renewal day while the subscription renews.\n- Body weight stays behind invite enrollments only. The hire form's consent names training logs and sign-up answers.\n- Deleting a coach whose clients have paid days to come is refused by any path.\n\n## Needs you\n- Free disk space, then let Claude rerun M4-19's e2e.\n- Run the M5-05 judge in a plain PowerShell window: `$env:AI_PROVIDER='gemini'; npm run eval:ai`.\n- Rotate the Gemini key that was pasted in chat.\n- The other owner items are in [[owner-decisions]].\n\n## Next\nFinish PR #58 (M4-19), then M4-12 refunds.", "date": "2026-11-21", "pc": "lenovo", "status": "", "links": ["ai-assistant", "lesson-disk-full-turbo", "lesson-prod-build-e2e", "marketplace", "owner-decisions", "session-13"]}, {"id": "session-15", "type": "session", "description": "2026-11-22: M4-19, M4-12 refunds and M4-14 reviews merged; plugins installed; Codex model and disk notes", "updated": "2026-11-22", "body": "Follows [[session-14]]. Hub: [[marketplace]].\n\n## Done\n- PR #58, M4-19 money-safe deletion, is merged after a Codex second look. Its medium finding moved to M4-18.\n- PR #59, M4-12 refunds and payout reversal, is merged. Design: `docs/plans/m4-12-refunds.md`. The reviews were Codex twice, `/code-review high` and `/security-review`.\n- PR #60, M4-14 verified reviews and coach replies, is merged. Design: `docs/plans/m4-14-reviews.md`. The same reviews ran.\n- Each migration went to production before its merge. Production has 51 of 51 migrations.\n- The `suryavanshi-claude` installer ran on this PC. The plugins ponytail, hallmark, openseo, ui-ux-pro-max and claude-seo are installed ([[tooling]]).\n- The Supabase CLI on this PC is logged in and linked to production ([[env-welcome-pc]]).\n\n## Bugs and errors\n- A stale `.next` build made every payment e2e 404 under `CI=1` ([[lesson-prod-build-e2e]]).\n- `/coaches/[id]` logs a Next.js \"unstable value Date.now()\" error while prerendering. It was already there before this session. It is on the board under M6-03.\n- C: filled to about 1 GB free. Clearing the npm cache freed 1.7 GB ([[lesson-disk-full-turbo]]).\n\n## Decisions\n- An admin refund of a renewed month ends the coaching, not refunds it. A first-month refund after a renewal leaves the coaching running.\n- A session payout is held until the day before the session, when its refunds close.\n- A review needs a finished paid period. A review of coaching refunded later stops showing and counting.\n\n## Needs you\n- Look at two new screens: the refund confirm screen and `/coach/reviews`.\n- Decide the M6 plan, and get the Razorpay test keys.\n- Free space on C:.\n- This ChatGPT account refuses `gpt-6-astra` for Codex, so Codex runs on `gpt-6-luna`. Update the rulebook if that is the model to keep.\n- Other items are in [[owner-decisions]].\n\n## Next\nThe owner decides the M6 plan. M4-15 client stories is ready but low priority.", "date": "2026-11-22", "pc": "welcome", "status": "", "links": ["env-welcome-pc", "lesson-disk-full-turbo", "lesson-prod-build-e2e", "marketplace", "owner-decisions", "session-14", "tooling"]}, {"id": "session-16", "type": "session", "description": "2026-11-23: M6-10 stage switches, audit fixes and M6-09 18+ gate merged; production at 54 of 54 migrations", "updated": "2026-11-23", "body": "Follows [[session-15]]. Hub: [[marketplace]]. Plan: [[decision-m6-launch]].\n\n## Done\n- PR #61, M6-10 stage switches, is merged. Hiring, chat and first checkout are closed in production now. Browsing coaches still works.\n- PR #62, audit fixes, is merged. It adds security headers and money records in the data download.\n- PR #63, M6-09 18+ gate, is merged. It pauses [[decision-no-age-limit]].\n- Each migration went to production before its merge, with the owner's yes. Production has 54 of 54 migrations.\n- Codex reviewed #63 and found no defect in the gate. A production count shows 0 accounts with an under-18 date.\n\n## Bugs and errors\n- PR #63 had a merge conflict in `packages/core/src/index.ts` after #62 removed `skillRating`. The fix keeps `isAdult` and drops `skillRating`.\n- The last session did not write its session note. This note covers its three PRs.\n\n## Needs you\n- To open the marketplace for step 2, set `marketplace_open = true` in `app_settings`. That is a production change.\n- Other items are in [[owner-decisions]].\n\n## Next\nThe step 1 tasks in order: M6-03, M6-01, M6-02a, M6-07, M6-12. M6-11 and S0-08 wait on O-11.\n\n## Later the same session: the no-owner M6 tasks\nThe owner asked for a goal: finish every remaining task that needs no owner input.\n\n### Done\n- PR #64, M6-03: error pages, a route audit test (`routes.test.ts`), and coach first-run links.\n- PR #65, M6-02a: full privacy and terms draft.\n- PRs #67 and #70, M6-01: landing, about, help, programs and a footer. All data comes from the database.\n- PR #68, M6-06: axe and keyboard e2e. They passed on the first run.\n- PR #69, M6-04: manifest and code-drawn icons.\n- PR #66, M6-07 write caps: merged after the owner's yes, with `20261222` pushed first. Production has 55 of 55 migrations.\n- Codex reviewed the whole app for security (`gpt-6-luna`) and found nothing. `/security-review` of the write caps found nothing.\n\n### Bugs and errors\n- A page that reads the database in a public server component needs `await connection()`, or the verify build fails with \"Supabase URL is missing\".\n- The `/coaches/[id]` prerender error came from the cookie client checking token expiry with `Date.now()` in `generateMetadata`.\n- The gh token lacks the `workflow` scope, so a push that adds `.github/workflows/*` is refused.\n\n### Decisions\n- `/programs` lists only the programs coaches show on their profile. There is no public page per program, because programs are invite-only.\n- Write caps sit on tables as triggers, and the service role is never capped.\n- The job failure alert is a public health endpoint plus a GitHub Actions run, so it needs no secret.\n\n### Needs you\n- Run `gh auth refresh -h github.com -s workflow` so M6-12 can push. Then add the `SUPABASE_DB_URL` and `BACKUP_PASSPHRASE` secrets.\n- Allow a local Lighthouse run (`npx lighthouse`) for M6-05, or wait a day for the PageSpeed quota.\n- Install the app once on an Android phone and an iPhone (M6-04).\n- Create a free Supabase project for previews (M6-07).\n\n## Later still: plans discussed with Codex\n- The owner asked to discuss every remaining plan with Codex until the best solution. Three rounds converged. See [[decision-remaining-plan]].\n- New task M6-15 (invite gate) and owner item O-12 (Vercel Pro before step 2).\n- PR #71 fixes the refund screen's session wording.\n\n## Last part: building the approved plan\n- The owner approved the plan. PR #72 (M6-15 invite gate) and PR #73 (M6-12 ops) are merged, with 20261223 and 20261224 pushed first. Production has 57 of 57 migrations.\n- The Codex review of #72 found that `reserve_ai_question` let an uninvited account write rows. It now calls `require_step1`.\n- A branch whose history adds a `.github/workflows` file cannot be pushed without the `workflow` scope. Squash it so that no commit touches the file.\n\n## Building more of the plan (the stop hook asked)\n- Merged #74 M6-13, #75 M6-11 code, #76 S0-08 code, #77 renewal by order (Decision 1) and #78 M4-13 manual payouts. Each migration went to production after the owner's yes. Production has 60 of 60.\n- The Codex final-diff review of #77 found duplicate reminders, fixed with a sweep lock. The review of #78 found a refund-vs-payout race, fixed by refusing refunds once a payout is paid. One claimed finding was rejected: duplicate payments never get a payout.\n- M6-05's perf workflow push was refused for the missing workflow scope, which confirms the block.\n- CI failures from the Docker registry rate limit and port errors were not code problems. A rerun of the failed jobs fixed them.\n- Lessons:\n  - A prompt to `codex exec` that holds a big diff goes on stdin (`codex exec - < file`), because the argument list is too long.\n  - A pgTAP statement cannot see a row that its own function call inserts.\n  - Long heredocs with quotes break the Bash tool, so write such files with the Write tool.\n\n## Reviews after the stop hook, M4-15, and try counts\n- #74, #75 and #76 had merged without a review. Codex reviewed them after the merge. The fixes are in #79: Sentry now redacts id-like path parts and drops `extra`, breadcrumb data and request contexts, and the captcha token is no longer reused on retry. Rejected with reason: captcha on Google OAuth, which Supabase does not cover; the invite gate covers that path.\n- #80 M4-15 client stories is merged. Codex found orphaned photos, now pruned by the cron, and photo keys missing from the export, now added.\n- Tries per task (CI or review rounds before the merge; none reached the cap of 5):\n  - M6-15: 2. M6-12: 2.\n  - M6-13: 1, plus an infrastructure rerun. M6-11: 1.\n  - S0-08: 2, plus an infrastructure rerun.\n  - Renewal orders: 3. M4-13: 4, including an infrastructure rerun.\n  - M4-15: 3. #79: 1.\n\n## M4-18 (2026-11-24)\n- The owner chose to build M4-18 now and leave M4-17. PR #81 is merged, with 20261229 pushed first. Production has 62 of 62.\n- Suspension refunds the unused days pro rata, the only partial refund. The payout is cut by the same share, or a coach debt is recorded when it was already paid. A bounced payout drops the debt and cuts the payout instead.\n- The Codex final-diff review found a deadlock risk in lock order and a stale debt; both are fixed. Tries: 4.\n- Lesson: in pgTAP, row security hides other people's rows from an admin user, so run checks as the owner (`reset role`).\n\n## M4-17 (2026-11-24)\n- The owner said \"stop asking and do what is best\", so M4-17 was built to the agreed plan in PR #82. It is green and waits for the production push.\n- pgTAP caught a real bug. In a SQL function, a column wins over a parameter of the same name, so `fits_availability(minutes)` read the window length. The parameter is now called `len`.\n- The Codex review found three issues, all fixed: hold expiry at capture, with 15 minutes' grace; ended or lapsed coaching releasing future bookings; and no time change while a checkout is open. One point was rejected with reason: an expired own hold shown as free.\n- Tries: 4 code runs, plus 1 infrastructure rerun after a Docker registry rate limit.\n- PR #82 merged after the owner's yes. Production has 63 of 63.\n\n## M6-05 (2026-11-24)\n- The owner granted the gh `workflow` scope. The browser step must be completed, or the scope stays missing.\n- The Perf workflow found the library at 75. Its skill path streamed in after an empty placeholder and pushed the list down (CLS 0.42). A loading placeholder shorter than the screen also let the footer jump. Both are fixed, and the path query now runs alongside the lesson queries. Medians: landing 88, library 90, Today 98.\n- Codex: 2 points rejected with evidence. Tries: 4.\n\n## Demo data (2026-11-24)\n- At the owner's request, production has one demo coach: \"Arjun Mehta (demo)\", id `d0000000-0000-4000-8000-00000000c0a1`. It has 2 packages, 11 weekly slots and a 6-week demo program shown on the profile. It has no reviews, stories or client numbers, because those would be invented evidence. The account cannot sign in.\n- Script: `docs/ops/demo-data.sql`. Remove before launch with `docs/ops/demo-data-remove.sql`.\n- Lesson: `supabase db query --remote` needs `--yes` for writes in agent mode. Untyped literals in `union all` and enum columns need explicit casts there.\n\n## Polish and email without a domain (2026-11-25)\n- PR #84: the coach profile follows the P-Coach design. PR #85: the stats hide until a coach has a client; Find a coach drops \"Hire online or in person\" and says \"No coaches are live yet\" when no filter is set.\n- The owner does not want to buy a domain yet. PR #86: emails can go through Gmail SMTP (`SMTP_USER`, `SMTP_PASS`, port 465) or Resend. Gmail wins when both are set. nodemailer is pinned at 10.5.0, because 6.x has audit findings and 10.6.1 was under two weeks old.\n- Owner next: a Gmail app password into Vercel and Supabase SMTP, `NEXT_PUBLIC_SITE_URL`, Turnstile (hostname fit-sphere-xi.vercel.app) and Sentry keys, then a redeploy. After that, test sign-in and Sentry live (M6-11, S0-08).", "date": "2026-11-23", "pc": "welcome", "status": "", "links": ["decision-m6-launch", "decision-no-age-limit", "decision-remaining-plan", "marketplace", "owner-decisions", "session-15"]}, {"id": "session-17", "type": "session", "description": "2026-11-25: LENOVO PC caught up to main; build and unit tests pass; local Supabase blocked by a storage error", "updated": "2026-11-25", "body": "Follows [[session-16]]. Plan: [[decision-m6-launch]].\n\n## Done\n- Caught up with the M6 plan (`docs/plans/m6-plan.html`, written 2026-11-21, defaults approved 2026-11-22 on the WELCOME PC).\n- `AGENTS.md` and `.code hallmark, every-app/open-seo, nextlevelbuilder/ui-ux-pro-max-skill, AgriciDaniel/claude-seo.\n- History: [[lesson-bun-gstack]].\n- `gh` push of workflow files: [[lesson-gh-workflow-scope]].\n- `skills` CLI: [[lesson-skills-cli-node]].", "date": "", "pc": "", "status": "", "links": ["env-lenovo-pc", "lesson-bun-gstack", "lesson-gh-workflow-scope", "lesson-hallmark-floor", "lesson-seo-plugins", "lesson-skills-cli-node", "session-6", "session-8", "session-9"]}]};
const LABEL = {todo:'To do', in_progress:'In progress', blocked:'Blocked', done:'Done'};
const byId = Object.fromEntries(BOARD.tasks.map(t => [t.id, t]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {phase:'', status:'', prio:'', owner:'', q:''};
try { state = Object.assign(state, JSON.parse(localStorage.getItem('fs-board') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('fs-board', JSON.stringify(state)); } catch (e) {} };

function counts() {
  const n = s => BOARD.tasks.filter(t => t.status === s).length;
  const total = BOARD.tasks.length, done = n('done');
  document.getElementById('sub').textContent = `${BOARD.project} · updated ${BOARD.updated}`;
  document.getElementById('counts').innerHTML = [['Tasks', total], ['Done', done], ['In progress', n('in_progress')], ['Blocked', n('blocked')], ['Ready now', BOARD.tasks.filter(t => t.ready).length]]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  document.getElementById('overall').style.width = (total ? done * 100 / total : 0) + '%';
  const ready = BOARD.tasks.filter(t => t.ready || t.status === 'in_progress');
  document.getElementById('readylist').innerHTML = ready.length ? ready.map(t => `<li><a href="#t-${t.id}">${t.status === 'in_progress' ? 'Now: ' : ''}${esc(t.id)} · ${esc(t.title)}</a></li>`).join('') : '<li>Nothing is ready. Check blocked tasks.</li>';
}

function chips() {
  const el = document.getElementById('phasechips');
  el.innerHTML = [{id:'', name:'All phases'}].concat(BOARD.phases).map(p => `<button class="chip" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.id ? esc(p.id) + ' ' : ''}${esc(p.name)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state.phase = b.dataset.phase; save(); chips(); render(); };
}

function match(t) {
  if (state.phase && t.phase !== state.phase) return false;
  if (state.status === 'ready' ? !t.ready : state.status && t.status !== state.status) return false;
  if (state.prio && t.priority !== state.prio) return false;
  if (state.owner && t.owner !== state.owner) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(t.id + ' ' + t.title + ' ' + t.ac.join(' ')).toLowerCase().includes(q)) return false; }
  return true;
}

function row(t) {
  const deps = t.deps.length ? t.deps.map(d => `<a href="#t-${d}">${esc(d)}</a> <span class="muted">(${LABEL[byId[d].status]})</span>`).join(', ') : 'None';
  const screens = t.screens ? `<div><h3>Screens on the canvas</h3><p>${t.screens.map(esc).join(', ')}</p></div>` : '';
  const why = t.blocked_reason ? `<div><h3>Why blocked</h3><p>${esc(t.blocked_reason)}</p></div>` : '';
  const doneLine = t.status === 'done' ? `<div><h3>Finished</h3><p>${esc(t.done_on || '')}${t.commit ? ' · commit ' + esc(t.commit) : ''}</p></div>` : '';
  return `<details class="task" id="t-${t.id}">
    <summary><span class="st ${t.status}">${LABEL[t.status]}</span><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}${t.ready ? '<span class="rdy">Ready</span>' : ''}</span>
      <span class="meta"><span class="tag ${t.priority === 'P0' ? 'p0' : ''}">${t.priority}</span><span class="tag">${t.size === 'S' ? 'Small' : 'Medium'}</span><span class="tag ${t.owner === 'owner' ? 'own' : ''}">${t.owner === 'owner' ? 'Owner' : 'Claude'}</span><span class="tag">${esc(t.test)}</span></span></summary>
    <div class="body"><div><h3>Acceptance criteria</h3><ul>${t.ac.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="deps"><h3>Depends on</h3><p>${deps}</p></div>${why}${screens}${doneLine}</div></details>`;
}

function render() {
  document.getElementById('phases').innerHTML = BOARD.phases.map(p => {
    const all = BOARD.tasks.filter(t => t.phase === p.id);
    if (state.phase && state.phase !== p.id) return '';
    const shown = all.filter(match);
    const done = all.filter(t => t.status === 'done').length;
    return `<section class="phase" aria-labelledby="ph-${p.id}"><div class="phead"><div><h2 id="ph-${p.id}">${esc(p.id)} · ${esc(p.name)}</h2><p class="goal">${esc(p.goal)}</p></div><span class="pct">${done} / ${all.length} done</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${all.length ? done * 100 / all.length : 0}%"></i></div>
      ${shown.length ? shown.map(row).join('') : '<p class="empty">No tasks match these filters.</p>'}</section>`;
  }).join('');
}

for (const [id, key] of [['fstatus', 'status'], ['fprio', 'prio'], ['fowner', 'owner']]) {
  const el = document.getElementById(id); el.value = state[key]; el.onchange = () => { state[key] = el.value; save(); render(); };
}
const fq = document.getElementById('fq'); fq.value = state.q; fq.oninput = () => { state.q = fq.value; save(); render(); };
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#t-"]'); if (!a) return; const d = document.querySelector(a.getAttribute('href')); if (d) { if (state.phase && !d) return; d.open = true; } });
counts(); chips(); render();

// ---- Memory tab: notes from docs/memory, links as edges, linked board tasks as square nodes
const NOTES = BOARD.memory || [];
const KINDS = ['area', 'decision', 'constraint', 'lesson', 'environment', 'session', 'bug', 'task'];
const noteById = Object.fromEntries(NOTES.map(n => [n.id, n]));
let mstate = {kind: '', q: '', sel: 'project-overview'};
try { Object.assign(mstate, JSON.parse(localStorage.getItem('fs-mem') || '{}')); } catch (e) {}
const msave = () => { try { localStorage.setItem('fs-mem', JSON.stringify(mstate)); } catch (e) {} };
const backlinks = id => NOTES.filter(n => n.links.includes(id)).map(n => n.id);
const linkHtml = id => noteById[id] || byId[id] ? `<button class="lk" data-go="${esc(id)}">${esc(id)}</button>` : esc(id);

function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]|]+)\]\]/g, (m, id) => linkHtml(id))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return src.split(/\n{2,}/).map(block => {
    const h = block.match(/^#{2,3} (.+)\n?([\s\S]*)$/);
    if (h) return `<h3>${inline(h[1])}</h3>` + (h[2].trim() ? md(h[2]) : '');
    const lines = block.split('\n');
    if (lines.every(l => /^(- |\d+\. )/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^(- |\d+\. )/, ''))}</li>`).join('')}</ul>`;
    const first = lines.findIndex(l => /^(- |\d+\. )/.test(l));
    if (first > 0) return `<p>${inline(lines.slice(0, first).join(' '))}</p>` + md(lines.slice(first).join('\n'));
    return `<p>${inline(lines.join(' '))}</p>`;
  }).join('');
}

function read(id) {
  mstate.sel = id; msave();
  const el = document.getElementById('reader');
  const t = byId[id], n = noteById[id];
  if (t) {
    el.innerHTML = `<p class="kind">Board task · ${LABEL[t.status]}</p><h2>${esc(t.id)}</h2><p>${esc(t.title)}</p>
      <p><button class="lk" data-task="${esc(t.id)}">Open in the Tasks tab</button></p>
      <h3>Notes that link here</h3><p>${backlinks(id).map(linkHtml).join(', ') || 'None'}</p>`;
  } else if (n) {
    const back = backlinks(id);
    el.innerHTML = `<p class="kind">${esc(n.type)} · updated ${esc(n.updated)}</p><h2>${esc(n.id)}</h2><p class="muted">${esc(n.description)}</p>${md(n.body)}
      <h3>Linked from</h3><p>${back.map(linkHtml).join(', ') || 'Nothing links here yet'}</p>
      <p class="muted" style="font-size:13px">File: docs/memory/${esc(n.id)}.md</p>`;
  } else { el.innerHTML = '<p class="muted">Click a node to read its note.</p>'; }
  highlight();
}

let gsel = null;
function highlight() {
  if (!gsel) return;
  const q = mstate.q.toLowerCase();
  const hit = d => (!mstate.kind || d.kind === mstate.kind) && (!q || d.text.includes(q));
  const near = new Set([mstate.sel]);
  gsel.links.each(l => { if (l.source.id === mstate.sel) near.add(l.target.id); if (l.target.id === mstate.sel) near.add(l.source.id); });
  gsel.nodes.classed('dim', d => !hit(d)).classed('sel', d => d.id === mstate.sel);
  gsel.labels.classed('dim', d => !hit(d));
  gsel.links.classed('hot', l => l.source.id === mstate.sel || l.target.id === mstate.sel)
    .classed('dim', l => !(hit(l.source) && hit(l.target)) && !(near.has(l.source.id) && near.has(l.target.id)));
}

function graph() {
  const svg = d3.select('#graph');
  const box = svg.node().getBoundingClientRect();
  const W = box.width || 800, H = box.height || 600;
  svg.attr('viewBox', [0, 0, W, H]);
  const taskIds = [...new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l]))];
  const nodes = NOTES.map(n => ({id: n.id, kind: n.type, text: (n.id + ' ' + n.description + ' ' + n.body).toLowerCase()}))
    .concat(taskIds.map(id => ({id, kind: 'task', text: (id + ' ' + byId[id].title).toLowerCase()})));
  const links = NOTES.flatMap(n => n.links.map(l => ({source: n.id, target: l})));
  const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  const r = d => d.kind === 'task' ? 6 : 5 + Math.min(12, Math.sqrt(deg[d.id] || 1) * 2.2);
  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([.2, 4]).on('zoom', e => { root.attr('transform', e.transform); root.selectAll('text').style('font-size', 12 / e.transform.k + 'px'); });
  svg.call(zoom);
  const fit = () => {
    const b = root.node().getBBox(); if (!b.width) return;
    const k = Math.min(1.4, .94 * Math.min(W / b.width, H / b.height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (b.x + b.width / 2), H / 2 - k * (b.y + b.height / 2)).scale(k));
  };
  const lk = root.append('g').selectAll('line').data(links).join('line');
  const shapes = root.append('g').selectAll('path').data(nodes).join('path')
    .attr('class', d => 'n k-' + d.kind)
    .attr('d', d => d.kind === 'task' ? d3.symbol(d3.symbolSquare, 110)() : d3.symbol(d3.symbolCircle, Math.PI * r(d) ** 2)())
    .on('click', (e, d) => read(d.id));
  shapes.append('title').text(d => d.id);
  const lb = root.append('g').selectAll('text').data(nodes.filter(d => d.kind === 'area' || d.kind === 'task' || (deg[d.id] || 0) > 5)).join('text')
    .text(d => d.id).attr('dx', d => r(d) + 3).attr('dy', 4);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.source.kind === 'area' && l.target.kind === 'area' ? 120 : 55))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => r(d) + 4));
  const tick = () => {
    lk.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    shapes.attr('transform', d => `translate(${d.x},${d.y})`);
    lb.attr('x', d => d.x).attr('y', d => d.y);
  };
  sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); tick(); fit();
  if (!reduce) sim.on('tick', tick);
  shapes.call(d3.drag()
    .on('start', (e, d) => { if (!e.active && !reduce) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; if (reduce) { d.x = e.x; d.y = e.y; tick(); } })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  gsel = {nodes: shapes, links: lk, labels: lb};
}

function mchips() {
  const count = k => k === 'task' ? new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l])).size : NOTES.filter(n => n.type === k).length;
  document.getElementById('mchips').innerHTML = [''].concat(KINDS).map(k => `<button class="chip" data-kind="${k}" aria-pressed="${mstate.kind === k}">${k ? k[0].toUpperCase() + k.slice(1) + ' ' + count(k) : 'All ' + NOTES.length + ' notes'}</button>`).join('');
  document.getElementById('legend').innerHTML = KINDS.map(k => `<span><i class="k-${k}"></i>${k}</span>`).join('');
  document.querySelectorAll('#legend i').forEach((i, n) => { i.style.background = getComputedStyle(i).fill; if (KINDS[n] === 'task') i.style.border = '1.5px solid var(--fg)'; });
}

// ---- Updates tab: one card per day from session notes, plus board tasks finished that day
const SECTIONS = ['Done', 'Bugs and errors', 'Decisions', 'Needs you', 'Next'];
function sections(body) {
  const out = {}; let cur = 'Done';
  for (const part of body.split(/^## /m)) {
    if (!part.trim()) continue;
    const nl = part.indexOf('\n'), head = nl < 0 ? part : part.slice(0, nl);
    if (SECTIONS.includes(head.trim())) { cur = head.trim(); out[cur] = (out[cur] || '') + (nl < 0 ? '' : part.slice(nl + 1)); }
    else out[cur] = (out[cur] || '') + part;
  }
  return out;
}
function updates() {
  const sess = NOTES.filter(n => n.type === 'session' && n.date).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id, undefined, {numeric: true}));
  const days = [...new Set(sess.map(s => s.date))];
  const openBugs = NOTES.filter(n => n.type === 'bug' && n.status === 'open');
  const week = new Date(Date.parse(BOARD.updated) - 6 * 864e5).toISOString().slice(0, 10);
  document.getElementById('ucounts').innerHTML = [['Days logged', days.length], ['Tasks done, last 7 days', BOARD.tasks.filter(t => t.done_on && t.done_on >= week).length], ['Open bugs', openBugs.length], ['Last update', sess[0] ? sess[0].date.slice(5) : 'none']]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  const waiting = noteById['owner-decisions'];
  document.getElementById('waiting').innerHTML = waiting ? md(waiting.body) : '<p>Nothing recorded.</p>';
  document.getElementById('bugs').innerHTML = openBugs.length ? `<ul>${openBugs.map(b => `<li>${linkHtml(b.id)}: ${esc(b.description)}</li>`).join('')}</ul>` : '<p class="muted">No open bugs.</p>';
  document.getElementById('days').innerHTML = days.map(d => {
    const ss = sess.filter(s => s.date === d);
    const tasks = BOARD.tasks.filter(t => t.done_on === d);
    const merged = {};
    ss.forEach(s => { const sec = sections(s.body); SECTIONS.forEach(k => { if (sec[k] && sec[k].trim()) merged[k] = (merged[k] ? merged[k] + '\n\n' : '') + sec[k].trim(); }); });
    const label = new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
    const cls = {'Bugs and errors': 'bugs', 'Needs you': 'needs'};
    return `<article class="day"><header><h2>${esc(label)}</h2><span>${[...new Set(ss.map(s => s.pc))].map(p => `<span class="pc">${esc(p)} PC</span>`).join(' ')} <span class="muted">${ss.map(s => linkHtml(s.id)).join(', ')}</span></span></header>
      <p class="muted">${ss.map(s => esc(s.description.replace(/^\d{4}-\d{2}-\d{2}: /, ''))).join(' · ')}</p>
      <div class="secs">${tasks.length ? `<div><h3>Board tasks finished</h3><ul>${tasks.map(t => `<li>${linkHtml(t.id)} ${esc(t.title)}${t.commit ? ' <span class="muted">(' + esc(t.commit) + ')</span>' : ''}</li>`).join('')}</ul></div>` : ''}
      ${SECTIONS.filter(k => merged[k]).map(k => `<div><h3 class="${cls[k] || ''}">${k}</h3>${md(merged[k])}</div>`).join('')}</div></article>`;
  }).join('') || '<p class="empty">No sessions logged yet.</p>';
}

let drawn = false, updDrawn = false;
const TABS = ['tasks', 'updates', 'memory'];
function showTab(name) {
  if (!TABS.includes(name)) name = 'tasks';
  const mem = name === 'memory';
  for (const t of TABS) { document.getElementById('tab-' + t).hidden = t !== name; document.getElementById('tb-' + t).setAttribute('aria-selected', t === name); }
  try { localStorage.setItem('fs-tab', name); } catch (e) {}
  if (name === 'updates' && !updDrawn) { updDrawn = true; updates(); }
  if (mem && !drawn) {
    drawn = true; mchips();
    if (window.d3) graph(); else document.getElementById('graph').outerHTML = '<p class="empty">The graph library did not load. Notes are still readable from the links in the reader.</p>';
    read(mstate.sel);
  }
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.id.slice(3)); };
document.querySelector('.tabs').onkeydown = e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const cur = TABS.findIndex(t => document.getElementById('tb-' + t).getAttribute('aria-selected') === 'true');
  const next = TABS[(cur + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
  showTab(next); document.getElementById('tb-' + next).focus();
};
document.getElementById('tab-updates').onclick = e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  if (byId[g.dataset.go] && !noteById[g.dataset.go]) { showTab('tasks'); const d = document.getElementById('t-' + g.dataset.go); if (d) { d.open = true; d.scrollIntoView(); } }
  else { showTab('memory'); read(g.dataset.go); }
};
document.getElementById('mchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; mstate.kind = b.dataset.kind; msave(); mchips(); highlight(); };
const mq = document.getElementById('mq'); mq.value = mstate.q; mq.oninput = () => { mstate.q = mq.value; msave(); highlight(); };
document.getElementById('reader').onclick = e => {
  const g = e.target.closest('[data-go]'); if (g) return read(g.dataset.go);
  const t = e.target.closest('[data-task]'); if (t) { showTab('tasks'); const d = document.getElementById('t-' + t.dataset.task); if (d) { d.open = true; d.scrollIntoView(); } }
};
let startTab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'tasks';
try { if (!TABS.includes(location.hash.slice(1))) startTab = localStorage.getItem('fs-tab') || 'tasks'; } catch (e) {}
showTab(startTab);
</script>
