<title>FitSphere Build Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phase sections stacked, one dense row per task, details on demand. Fight Camp type, black and white, volt marks what is ready. */
:root{
  --bg:#ffffff; --fg:#111111; --soft:#f5f5f5; --line:#e2e2e2; --muted:#6b6b6e; --ink-2:#39393b;
  --volt:#D4F000; --on-volt:#111111; --done:#00653a; --done-bg:#e3f4ec; --block:#a3001a; --block-bg:#fde8eb; --prog-bg:#f6fbcc;
  --display:Anton, Impact, "Arial Narrow", sans-serif; --body:Inter, Helvetica, Arial, sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance}
h1{font-size:clamp(48px,8vw,96px)}
h2{font-size:clamp(30px,4vw,44px)}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.counts{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;border-top:2px solid var(--fg);padding-top:16px}
.counts div{min-width:110px}
.counts b{display:block;font-family:var(--display);font-size:44px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);margin-top:10px}
.bar > i{display:block;height:100%;background:var(--fg)}
.ready{margin-top:32px;background:var(--fg);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:12px}
.ready h2{font-size:28px}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.ready li a{display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:0 16px;border-radius:30px;background:var(--volt);color:var(--on-volt);font-weight:600;text-decoration:none}
.filters{margin-top:32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:30px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=search]{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--line);border-radius:30px;padding:0 14px;background:var(--bg);color:var(--fg)}
input[type=search]{min-width:0;flex:1 1 180px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
section.phase{margin-top:48px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:12px}
.phead .goal{max-width:62ch;color:var(--ink-2);margin-top:8px}
.phead .pct{font-variant-numeric:tabular-nums;font-weight:600}
.task{border-bottom:1px solid var(--line)}
.task summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:110px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;min-height:52px}
.task summary::-webkit-details-marker{display:none}
.task summary:hover{background:var(--soft)}
.st{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:30px;white-space:nowrap}
.st.todo{border:1px solid var(--line);color:var(--muted)}
.st.in_progress{background:var(--volt);color:var(--on-volt)}
.st.blocked{background:var(--block-bg);color:var(--block)}
.st.done{background:var(--done-bg);color:var(--done)}
.id{font-weight:600;font-variant-numeric:tabular-nums}
.title{min-width:0}
.title .rdy{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;background:var(--volt);color:var(--on-volt);padding:2px 8px;border-radius:30px;vertical-align:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);padding:3px 9px;border-radius:30px;white-space:nowrap}
.tag.p0{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag.own{border-style:dashed}
.body{padding:4px 4px 20px 186px;display:grid;gap:12px}
.body h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.body ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:78ch}
.deps a{color:inherit;font-weight:600}
.empty{padding:20px 4px;color:var(--muted)}
@media (max-width:720px){
  .task summary{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"st id" "title title" "meta meta"}
  .task summary .st{grid-area:st;justify-self:start}.task summary .id{grid-area:id}.task summary .title{grid-area:title}.task summary .meta{grid-area:meta;justify-content:flex-start}
  .body{padding-left:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{display:flex;gap:8px;margin-top:28px;border-bottom:2px solid var(--fg)}
.tabs button{font:inherit;font-weight:600;font-size:15px;min-height:48px;padding:0 20px;border:0;border-radius:30px 30px 0 0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px}
#graph{width:100%;height:620px;background:var(--soft);display:block;touch-action:none}
#graph text{font:500 11px var(--body);fill:var(--ink-2);pointer-events:none}
#graph line{stroke:var(--line);stroke-width:1.2}
#graph line.hot{stroke:var(--fg);stroke-width:2}
#graph .n{cursor:pointer;stroke:var(--bg);stroke-width:1.5}
#graph .n.sel{stroke:var(--fg);stroke-width:3}
#graph .dim{opacity:.15}
.k-area{fill:var(--volt)}.k-decision{fill:var(--fg)}.k-constraint{fill:var(--block)}.k-lesson{fill:#c26a00}.k-environment{fill:var(--done)}.k-session{fill:var(--muted)}.k-task{fill:var(--bg);stroke:var(--fg)!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.reader{border-top:2px solid var(--fg);padding-top:14px;max-height:620px;overflow:auto}
.reader h2{font-size:30px;overflow-wrap:anywhere}
.reader .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.reader p,.reader ul{margin:10px 0;max-width:70ch}
.reader ul{padding-left:20px}
.reader code{font-size:13px;background:var(--soft);padding:1px 5px;overflow-wrap:anywhere}
.reader a,.reader button.lk{color:inherit;font-weight:600;text-decoration:underline;background:none;border:0;padding:0;font:inherit;font-weight:600;cursor:pointer}
.reader h3{font-size:13px;color:var(--muted);margin:18px 0 4px}
.k-bug{fill:#7a3cff}
.ugrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:32px}
.ugrid .ready{margin-top:0}
.reader-lite ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.reader-lite p{margin:0 0 8px}
.reader-lite code{background:rgba(127,127,127,.2);padding:1px 5px;font-size:13px}
.reader-lite button.lk,.day button.lk,.ubugs button.lk{color:inherit;font:inherit;font-weight:600;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.ubugs{border:2px solid var(--fg);padding:24px}
.ubugs h2{font-size:28px;margin-bottom:12px}
.ubugs ul{margin:0;padding-left:20px}
.day{margin-top:40px;border-top:2px solid var(--fg);padding-top:14px}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.day h2{font-size:clamp(28px,4vw,40px)}
.day .pc{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:30px;padding:3px 10px}
.day .secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;margin-top:12px}
.day h3{margin:10px 0 4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.day h3.bugs{color:var(--block)}.day h3.needs{color:var(--fg)}
.day ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.day p{margin:4px 0;max-width:72ch}
.day code{font-size:13px;background:var(--soft);padding:1px 5px;overflow-wrap:anywhere}
@media (max-width:860px){.ugrid{grid-template-columns:1fr}}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}#graph{height:440px}.reader{max-height:none}}
</style>

<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:10px">
      <p class="muted" id="sub"></p>
      <h1>Build board</h1>
    </div>
    <p class="muted" style="max-width:44ch">One task at a time: tests first, then code, then verify. A task is ready when every task it depends on is done.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Board views">
    <button role="tab" id="tb-tasks" aria-controls="tab-tasks" aria-selected="true">Tasks</button>
    <button role="tab" id="tb-updates" aria-controls="tab-updates" aria-selected="false">Updates</button>
    <button role="tab" id="tb-memory" aria-controls="tab-memory" aria-selected="false">Memory</button>
  </div>
  <div id="tab-updates" role="tabpanel" aria-labelledby="tb-updates" hidden>
    <div class="counts" id="ucounts"></div>
    <div class="ugrid">
      <section class="ready" aria-labelledby="waith"><h2 id="waith">Waiting on you</h2><div id="waiting" class="reader-lite"></div></section>
      <section class="ubugs" aria-labelledby="bugh"><h2 id="bugh">Open bugs</h2><div id="bugs"></div></section>
    </div>
    <div id="days"></div>
  </div>
  <div id="tab-tasks" role="tabpanel" aria-labelledby="tb-tasks">
  <div class="counts" id="counts"></div>
  <div class="bar" aria-hidden="true"><i id="overall"></i></div>
  <section class="ready" aria-labelledby="readyh">
    <h2 id="readyh">Ready to start</h2>
    <ul id="readylist"></ul>
  </section>
  <div class="filters" role="group" aria-label="Filters">
    <div id="phasechips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <label><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Status</span><select id="fstatus"><option value="">Any status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="ready">Ready now</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Priority</span><select id="fprio"><option value="">Any priority</option><option>P0</option><option>P1</option><option>P2</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Owner</span><select id="fowner"><option value="">Anyone</option><option value="claude">Claude</option><option value="owner">Owner</option></select></label>
    <input type="search" id="fq" placeholder="Search tasks" aria-label="Search tasks">
  </div>
  <div id="phases"></div>
  </div>
  <div id="tab-memory" role="tabpanel" aria-labelledby="tb-memory" hidden>
    <div class="filters" role="group" aria-label="Memory filters">
      <div id="mchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <input type="search" id="mq" placeholder="Search memory" aria-label="Search memory">
    </div>
    <div class="legend" id="legend"></div>
    <div class="mgrid">
      <svg id="graph" role="img" aria-label="Memory graph. Click a node to read its note."></svg>
      <article class="reader" id="reader" aria-live="polite"></article>
    </div>
  </div>
</div>

priority": "P0", "size": "M", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "e2e", "screens": ["P-NotFound"], "ac": ["A route audit script lists every route and finds no dead button or placeholder", "Each data screen has a designed empty state", "Coach empty states follow the approved design K-CoachEmpty"], "ready": false}, {"id": "M6-04", "phase": "M6", "title": "Installable PWA", "priority": "P1", "size": "S", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "manual", "ac": ["Manifest, icons and an offline fallback page", "Installs on Android Chrome and iOS Safari"], "ready": false}, {"id": "M6-05", "phase": "M6", "title": "Speed on low-end Android", "priority": "P0", "size": "M", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "manual", "ac": ["Lighthouse mobile performance at least 80 on landing, library and Today", "Images served in modern formats at the right size"], "ready": false}, {"id": "M6-06", "phase": "M6", "title": "Accessibility audit", "priority": "P0", "size": "S", "deps": ["M6-03"], "status": "todo", "owner": "claude", "test": "e2e", "ac": ["axe finds no serious or critical issue on any route", "Keyboard-only path through sign-up, a session and checkout"], "ready": false}, {"id": "M6-07", "phase": "M6", "title": "Security review and rate limits", "priority": "P0", "size": "M", "deps": ["M6-03"], "status": "todo", "owner": "claude", "test": "all", "ac": ["Rate limits on sign-in, AI and payment routes", "/security-review and a Codex review of the full app; findings resolved", "No secrets in the repo or client bundle"], "ready": false}, {"id": "M6-08", "phase": "M6", "title": "Final QA and production launch", "priority": "P0", "size": "M", "deps": ["M6-02", "M6-04", "M6-05", "M6-06", "M6-07", "M5-05"], "status": "todo", "owner": "claude", "test": "all", "ac": ["/qa on the production candidate finds no high-severity bugs", "Design doc M6 Verify list passes", "Owner approves the production deploy"], "ready": false}], "memory": [{"id": "M1-04-review", "type": "lesson", "description": "2026-11-12: findings from the planner, /code-review and Codex on PR #7 (M1-04), and how each was resolved", "updated": "2026-11-12", "body": "All fixed in `7159a73` ([[M1-04]], [[session-9]]). Owner took the recommended choices.\n1. Two AI consents: `ai_health_personalisation` (injury notes) and `ai_body_metrics` (weight and height).\n2. Each consent is a required yes/no with nothing pre-chosen, so every answer is explicit.\n3. Consent rows carry `notice_version` and are written only when the answer or the notice changes.\n4. Steps 3 and 4 need step 2 done (`stepTwoDone` in `welcome/guard.ts`).\n5. SQL checks answers: chosen sports only; short strings or lists of them (`apply_sport_answers`).\n6. Step 2 and step 3 each save in one transaction.\n7. The M1-03 migration is restored; `20261112400000_no_age_limit.sql` replaces `complete_about_you` ([[decision-no-age-limit]]).\n8. Sign-up edits the latest measurement; both fields empty removes it. Strict decimal input.\n9. Step 4 Back still goes to step 3, which sends non-gym users to step 2. Kept: it works and the page shell is static.\n\nLessons:\n- Next 16 keeps visited routes mounted but hidden. Key forms on their saved data, or a reused radio ignores a new `defaultChecked`. In e2e, filter locators with `visible: true`.\n- Do not force-check a visually hidden radio in Playwright: the click lands on the 1 px box centre and can hit a neighbour. Click the label.\n- Codex flagged partial measurement updates; rejected, because step 3 prefills both values and edits in place.", "date": "", "pc": "", "status": "", "links": ["M1-04", "decision-no-age-limit", "session-9"]}, {"id": "M1-check", "type": "area", "description": "2026-11-13: M1 milestone check (M1-09): evidence for each Verify item, and which items wait for M2 and M3", "updated": "2026-11-13", "body": "M1 is done on stacked PRs #4 to #11 ([[M1-09]], [[session-9]]). CI is green on all of them (verify, db, e2e).\n\nEvidence per M1 Verify item (docs/designs/fitsphere-v1.md):\n- typecheck, lint, tests, build: `npm run verify` green locally and in CI; 80 e2e pass on a production build.\n- An athlete cannot read another athlete's data: pgTAP `identity_test`, `welcome_steps_test`, `account_test`.\n- Only an admin grants coach or reviewer: pgTAP `admin_people_test`, `identity_test`; e2e `admin-people`.\n- Sign-up and onboarding end to end, date of birth kept, AI consent as a separate yes/no: e2e `welcome-steps`, `welcome`.\n- Codex reviewed every auth and RLS PR; each finding was fixed or rejected with evidence ([[route-guards]], [[M1-04-review]]).\n\nWaiting on later tables (already in their task criteria): draft content and publish rules in M2-01; coach access to athletes in M3-04.\nVercel preview deploys wait on [[O-02]].", "date": "", "pc": "", "status": "", "links": ["M1-04-review", "M1-09", "O-02", "route-guards", "session-9"]}, {"id": "M2-check", "type": "area", "description": "2026-11-13: M2 milestone check (M2-11): evidence for each Verify item, the visual check, and leftovers", "updated": "2026-11-13", "body": "Done in [[session-10]]. The milestone before: [[M1-check]].\n\n## Verify line (design doc, M2)\n- Browse Boxing > Technical Boxing > Jab > lesson; filter drills by equipment; save and complete, both persist after reload. Evidence: `apps/web/e2e/m2-milestone.spec.ts`, phone and desktop, production build.\n- A draft lesson is not public: the same spec, plus `lesson.spec.ts` and pgTAP `content_test.sql` (anon reads published only). It is a soft 404, see [[lesson-next16-suspense]].\n- Search \"jab\" returns the jab skill first and its drills: `search.spec.ts` and pgTAP `search_test.sql`.\n- A sample shows \"Sample\", never \"Coach-verified\": `library.spec.ts`, `lesson.spec.ts`, the milestone spec.\n\n## Workflow rules (all enforced in the database)\n- Authors cannot publish; reviewers cannot publish their own item; send back needs a note ([[db]]). pgTAP `content_test.sql`, e2e `review.spec.ts`.\n- Coaches write only through `save_content_draft`; pgTAP `drafts_test.sql`.\n\n## Visual check\n- Library at 390 px and lesson at 1440 px match the canvas layout: filters, tiles, path strip, dose box, steps, mistakes, safety, learn first ([[mockups]]).\n\n## Leftovers, not blocking\n- Sample tiles have no photos and no videos; founding coaches bring both.\n- The \"Learn\" header link is marked only on `/learn/boxing`, not on S&C or gym pages.\n- The review queue count badge in the coach header is not built.\n- No email to the author when a lesson is published or sent back; the note shows in My lessons.\n- The daily check takes up to 500 videos a run, least recently checked first.\n- The video check confirms the link is a YouTube id at submit time; the daily cron catches removed or private videos.", "date": "", "pc": "", "status": "", "links": ["M1-check", "db", "lesson-next16-suspense", "mockups", "session-10"]}, {"id": "ai-assistant", "type": "area", "description": "The grounded AI instructional assistant (milestone M5)", "updated": "2026-11-12", "body": "- Answers cite published, non-sample content: [[decision-ai-grounding]].\n- Health limitations need separate consent: [[decision-health-consent]].\n- Claude via the Anthropic API, server-side. Retrieval: Postgres full-text search in the plan.\n- Labelled apart from coach-verified content.", "date": "", "pc": "", "status": "", "links": ["decision-ai-grounding", "decision-health-consent"]}, {"id": "architecture-docs", "type": "area", "description": "Pre-build analysis, risks, open questions and missing screens", "updated": "2026-11-12", "body": "Written in [[session-3e]] in `docs/architecture/`:\n- `product-analysis.md`: roles, 12 feature areas, journeys J1–J15, assets, design observations D1–D6.\n- `architecture.md`: route map, components, backend modules, endpoints, ERD, conventions.\n- `risks-and-gaps.md`: risks R1–R16, questions Q-01–Q-15, missing screens G1–G8.\n- Rendered page: https://claude.ai/artifact/NuWTJNJ1GZsYCznVN8CDWk (rebuild with `python docs/architecture/build_page.py`).\n- D1–D6 approved in [[session-3f]]. Q-01–Q-15 wait on the owner ([[O-09]]).\n- Still open: G5 invoices, G7 email templates, G8 offline page.", "date": "", "pc": "", "status": "", "links": ["O-09", "session-3e", "session-3f"]}, {"id": "bug-button-52px", "type": "bug", "description": "Default buttons rendered 52 px tall instead of 48 px", "updated": "2026-11-09", "body": "Found by the one-off real-browser check in [[session-5]]. jsdom tests could not see it. Fixed in [[S0-03]] ([[design-system]]).\n\nThe real-browser check moves into Playwright at [[S0-07]] so this class of bug is caught in CI.", "date": "", "pc": "", "status": "fixed", "links": ["S0-03", "S0-07", "design-system", "session-5"]}, {"id": "build-board", "type": "area", "description": "board.json, the renderer, the artifact, and the working loop", "updated": "2026-11-12", "body": "- `docs/plans/board.json` is the source of truth for tasks. `python docs/plans/build_board.py` validates it, checks the memory graph, and renders `board.html`.\n- Published at https://claude.ai/artifact/BPCG8ghatzZkV7v1haJ1z1. Republish after every task.\n- The board has two tabs: Tasks, and Memory, which draws [[memory-system]].\n- Working loop: one task in progress at a time. Tests first. `npm run verify` plus the task's end-to-end test. Mark done with date and commit. Re-render and republish.\n- Codex review at the end of each milestone for auth, RLS, payments and migrations.\n- Engineering plan: `docs/plans/engineering-plan.md`. Created in [[session-3d]].\n- Build inside the repo, not a temp folder ([[decision-build-in-repo]]).", "date": "", "pc": "", "status": "", "links": ["decision-build-in-repo", "memory-system", "session-3d"]}, {"id": "categories", "type": "area", "description": "The three sport categories and their libraries", "updated": "2026-11-12", "body": "Decided in [[decision-three-categories]] and [[decision-launch-sports]].\n\n- Boxing: primary.\n- Strength & Conditioning: S&C for boxers. It must not become a generic gym app.\n- Gym & Fitness: build muscle, lose fat, get stronger, get fitter. Library by goal and muscle group, workout player with overload targets, gym progress. Added in [[session-3c]].\n- Categories are data, so more can be added later ([[stack]]).\n- No meal plans or calorie targets: [[decision-no-nutrition]].", "date": "", "pc": "", "status": "", "links": ["decision-launch-sports", "decision-no-nutrition", "decision-three-categories", "session-3c", "stack"]}, {"id": "ci", "type": "area", "description": "GitHub Actions workflow, its jobs, and the merge rule", "updated": "2026-11-12", "body": "Built in [[S0-05]] ([[session-6]]), PR #1.\n\n- `.github/workflows/ci.yml` runs on every pull request and every push to `main`.\n- Job `verify`: `npm ci`, then `npm run verify`.\n- Job `db`: `npm run db:start`, `npm run test:db`, then regenerates types and fails if `database.types.ts` changed.\n- Job `e2e` ([[S0-07]], [[session-7]], PR #3): starts Supabase, writes `apps/web/.env.local` from `supabase status -o env`, builds the web app, runs Playwright. Uploads `test-results/` on failure.\n- The web build needs no secrets in CI.\n- Branch protection is not possible on GitHub Free for a private repo (API 403). Until the owner decides ([[owner-decisions]]), merge only on a green run.\n- Pushing workflow files: [[lesson-gh-workflow-scope]]. Merging: [[lesson-auto-mode-merge]].", "date": "", "pc": "", "status": "", "links": ["S0-05", "S0-07", "lesson-auto-mode-merge", "lesson-gh-workflow-scope", "owner-decisions", "session-6", "session-7"]}, {"id": "constraints", "type": "constraint", "description": "Project-wide rules that always hold", "updated": "2026-11-12", "body": "- No placeholder pages, dead buttons or fake data. Sample content carries a \"Sample\" label.\n- Do not deploy, delete data, or force-push without the owner's approval.\n- No secrets in the repo. Use `.env` files, which git ignores.\n- Demand evidence is zero. Pricing and usage assumptions are hypotheses.\n- No age limit: [[decision-no-age-limit]] (replaced [[decision-adults-only]] on 2026-11-12). Parental consent for minors is a launch blocker. Out of scope: [[decision-out-of-v1]].\n- Hub: [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["decision-adults-only", "decision-no-age-limit", "decision-out-of-v1", "project-overview"]}, {"id": "db", "type": "area", "description": "packages/db, local Supabase commands, keys and settings", "updated": "2026-11-19", "body": "Built in [[S0-04]] ([[session-5]]). Local Supabase needs Docker, not a cloud account ([[decision-local-supabase]]).\n\n- `packages/db` holds the Supabase project, migrations, pgTAP tests, generated types and `createDbClient`.\n- Root commands: `db:start`, `db:stop`, `db:reset`, `test:db`, `db:types`.\n- Studio: http://127.0.0.1:54323.\n- `apps/web/.env.local` holds the local keys and is git-ignored. Recreate it from `npx supabase status` in `packages/db`.\n- Analytics is off in `supabase/config.toml`. Nothing uses it, it took 559 MB, and its log shipper restart-looped.\n- `supabase/seed.sql` ([[S0-07]]) adds five test users: athlete, coach1, coach2, reviewer, admin `@test.fitsphere`, password `password123`. Extra roles are rows in `user_roles` ([[M1-01]]). `db:start` and `db:reset` apply it.\n- Docker runs on [[env-welcome-pc]] and [[env-lenovo-pc]]. [[ci]] runs the DB tests on every PR.\n- Identity schema ([[M1-01]], [[session-8]]): `profiles`, `user_roles`, `consents` (append-only, newest row wins), `audit_log`. Roles change only through admin-only `grant_role` / `revoke_role`; nobody changes their own. A trigger audits every role change. `date_of_birth` is not client-writable: M1-03 must add a security definer function for the 18+ write. The first production admin needs a manual SQL insert.\n- Programs, invites and enrollments ([[M3-01]], [[M3-03]], [[M3-04]]): see [[programs]]. Coach reads of athlete rows go only through `coach_can_read`. Migrations from [[session-12]]: `20261114100000_invites.sql`, `20261119000000_enrollment_access.sql`. `export_my_data` now lists programs joined.\n- A function replaced in a later migration (`create or replace`) must copy the whole current body: `join_program` lives in the M3-04 migration, `export_my_data` in the invites migration.", "date": "", "pc": "", "status": "", "links": ["M1-01", "M3-01", "M3-03", "M3-04", "S0-04", "S0-07", "ci", "decision-local-supabase", "env-lenovo-pc", "env-welcome-pc", "programs", "session-12", "session-5", "session-8"]}, {"id": "decision-adults-only", "type": "decision", "description": "2026-11-04: adults only (18+) in v1. SUPERSEDED 2026-11-12 by decision-no-age-limit", "updated": "2026-11-04", "body": "Why: India's DPDP Act needs verifiable parental consent for minors. Deferred to the academy phase. See [[constraints]].\n\nSuperseded on 2026-11-12 by [[decision-no-age-limit]]: the owner removed the age limit.", "date": "", "pc": "", "status": "", "links": ["constraints", "decision-no-age-limit"]}, {"id": "decision-ai-grounding", "type": "decision", "description": "2026-11-04: AI answers cite published, non-sample content; with no match it explains concepts only", "updated": "2026-11-04", "body": "The brief requires AI grounded in approved content and kept apart from coach-verified content. The AI never prescribes without a match. See [[ai-assistant]].", "date": "", "pc": "", "status": "", "links": ["ai-assistant"]}, {"id": "decision-build-in-repo", "type": "decision", "description": "2026-11-05: build inside the repo, never in a temp or scratch folder", "updated": "2026-11-05", "body": "The owner rejected a scaffold made in a scratchpad. See [[decision-project-folder]] and [[build-board]].", "date": "", "pc": "", "status": "", "links": ["build-board", "decision-project-folder"]}, {"id": "decision-coach-review-flow", "type": "decision", "description": "2026-11-04: coaches author, a reviewer publishes, nobody approves their own item", "updated": "2026-11-04", "body": "Why: content quality and cold start are the main risks. Coaches bring content and athletes. See [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["project-overview"]}, {"id": "decision-fight-camp", "type": "decision", "description": "2026-11-04: visual direction Fight Camp (Anton + Inter, black/white, volt #D4F000, pill buttons)", "updated": "2026-11-05", "body": "The owner picked Fight Camp (Nike-grade) over Studio (Apple) and Coach (Airbnb) in [[session-2]].\n\n2026-11-05: keep the Fight Camp look when using Hallmark or ui-ux-pro-max. Use those tools for quality checks, not a new theme. The owner said the screens look good. See [[lesson-hallmark-floor]], [[design-system]], [[mockups]].", "date": "", "pc": "", "status": "", "links": ["design-system", "lesson-hallmark-floor", "mockups", "session-2"]}, {"id": "decision-git-author", "type": "decision", "description": "2026-11-04: git author is Kritagya Suryavanshi <kritagya.suryarock@gmail.com>", "updated": "2026-11-04", "body": "The owner's real name and email. See [[owner-profile]].", "date": "", "pc": "", "status": "", "links": ["owner-profile"]}, {"id": "decision-health-consent", "type": "decision", "description": "2026-11-04: separate consent before health limitations go to the AI; send minimum fields", "updated": "2026-11-04", "body": "Why: health data is sensitive and the AI provider sits outside India. See [[ai-assistant]].", "date": "", "pc": "", "status": "", "links": ["ai-assistant"]}, {"id": "decision-launch-sports", "type": "decision", "description": "2026-11-04: Boxing primary, S&C integrated support, multi-sport data model", "updated": "2026-11-04", "body": "Both suit adults. S&C must not become a generic gym app. Later extended by [[decision-three-categories]]. See [[categories]].", "date": "", "pc": "", "status": "", "links": ["categories", "decision-three-categories"]}, {"id": "decision-local-supabase", "type": "decision", "description": "2026-11-09: local Supabase on Docker, no cloud account needed for S0-04", "updated": "2026-11-09", "body": "Owner approved. [[O-02]] no longer blocks [[S0-04]]. See [[db]].", "date": "", "pc": "", "status": "", "links": ["O-02", "S0-04", "db"]}, {"id": "decision-marketplace-in-v1", "type": "decision", "description": "2026-11-05: coach marketplace is in v1 as milestone M4; AI moves to M5, launch to M6", "updated": "2026-11-05", "body": "Owner: \"add marketplace in v1\". Reverses part of [[decision-out-of-v1]]. Details and risks in [[marketplace]].", "date": "", "pc": "", "status": "", "links": ["decision-out-of-v1", "marketplace"]}, {"id": "decision-no-age-limit", "type": "decision", "description": "2026-11-12: no age limit; date of birth still asked once and kept. Replaces decision-adults-only.", "updated": "2026-11-12", "body": "The owner removed the 18+ limit ([[session-9]]). Anyone can sign up. Step 1 still asks the date of birth once, and it cannot change ([[M1-03]]).\nReplaces [[decision-adults-only]].\n\nWhy the date stays: minors must stay identifiable. India's DPDP Act needs verifiable parental consent before processing a child's data, and injury notes and body weight are health data ([[constraints]]).\n\nLaunch blocker: a parental-consent step for under-18s, confirmed by a lawyer, before any real minor signs up ([[owner-decisions]]).\nCode: migration `20261112400000_no_age_limit.sql` drops `is_adult` and the block screen. A future date is still refused.", "date": "", "pc": "", "status": "", "links": ["M1-03", "constraints", "decision-adults-only", "owner-decisions", "session-9"]}, {"id": "decision-no-design-edits", "type": "decision", "description": "2026-11-05: no design edits without owner approval", "updated": "2026-11-05", "body": "Set in [[session-3e]] with board task O-10. See [[mockups]].", "date": "", "pc": "", "status": "", "links": ["mockups", "session-3e"]}, {"id": "decision-no-nutrition", "type": "decision", "description": "2026-11-05: no meal plans or calorie targets in v1; body weight optional and consent-gated", "updated": "2026-11-05", "body": "Why: nutrition advice is out of v1 scope and is health data. Still an open question for the owner ([[owner-decisions]]). See [[categories]], [[decision-health-consent]].", "date": "", "pc": "", "status": "", "links": ["categories", "decision-health-consent", "owner-decisions"]}, {"id": "decision-out-of-v1", "type": "decision", "description": "2026-11-04: out of v1, payments, academies, minors, phone OTP, Hindi, native apps, 3D, live, community", "updated": "2026-11-05", "body": "Why: keep v1 focused and get real-user evidence first. The marketplace and its payments came back in: [[decision-marketplace-in-v1]]. See [[constraints]].", "date": "", "pc": "", "status": "", "links": ["constraints", "decision-marketplace-in-v1"]}, {"id": "decision-project-folder", "type": "decision", "description": "2026-11-04: all project files, memory included, live in the fitSphere repo", "updated": "2026-11-12", "body": "Paths: `C:\\Users\\LENOVO\\Desktop\\Projects\\fitSphere` ([[env-lenovo-pc]]) and `C:\\Users\\WELCOME\\fitSphere` ([[env-welcome-pc]]). The repo is private: `kritagyasuryavanshi/fitSphere`. See [[owner-profile]].", "date": "", "pc": "", "status": "", "links": ["env-lenovo-pc", "env-welcome-pc", "owner-profile"]}, {"id": "decision-pwa-stack", "type": "decision", "description": "2026-11-04: mobile-first PWA on Next.js, Vercel, Supabase, YouTube embeds", "updated": "2026-11-04", "body": "Why: the house default stack, India-first, low cost, and no video hosting bill before revenue. Refined into [[decision-stack-locked]].", "date": "", "pc": "", "status": "", "links": ["decision-stack-locked"]}, {"id": "decision-stack-locked", "type": "decision", "description": "2026-11-05: monorepo stack locked (Next.js, Supabase, Razorpay, Claude)", "updated": "2026-11-05", "body": "Owner: \"start building with the build board; use the best stack you recommend; keep it scalable, I will add more categories and features later.\" This approved the plan ([[S0-01]]).\n\nWhy: one TypeScript monorepo keeps rules, UI and DB types shared. Categories as data and a metric registry let new sports arrive without code forks. Details in [[stack]].", "date": "", "pc": "", "status": "", "links": ["S0-01", "stack"]}, {"id": "decision-three-categories", "type": "decision", "description": "2026-11-05: three categories, Boxing, S&C and Gym & Fitness, each with its own library", "updated": "2026-11-05", "body": "The owner asked for gym training (weight loss, muscle building, hypertrophy), then asked to keep S&C as its own category. Gym is a full category, not boxing support. See [[categories]].", "date": "", "pc": "", "status": "", "links": ["categories"]}, {"id": "decision-three-pillars", "type": "decision", "description": "2026-11-04: v1 has three pillars, video library, AI assistant, coach-led training", "updated": "2026-11-04", "body": "The owner wants all three complete from day one and accepts a longer timeline. See [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["project-overview"]}, {"id": "design-system", "type": "area", "description": "packages/ui components, tokens, and what is deferred", "updated": "2026-11-12", "body": "Built in [[S0-03]] ([[session-5]]). The look is Fight Camp: [[decision-fight-camp]].\n\n- Components: tokens, Button, Tag, Input, Checkbox, RadioCard, Tabs, Dialog.\n- Link buttons use `buttonClass()` with `next/link`.\n- Tailwind reads the package through `@source` in `apps/web/src/app/globals.css`.\n- Added beyond the board's list: a `danger` Button for the confirm screens, and a Dialog `alert` mode that keeps focus off the destructive button.\n- Deferred: checkbox cards from A-Onboard1 go in [[M1-03]]. Pill-style category links (C-Library) are links, not tabs, and go in [[M2-03]].\n- The real-browser check (axe with contrast, sizes, focus rings, dialog keyboard at 390 and 1440 px) ran as a one-off script. Move it into Playwright at [[S0-07]]. It found a bug jsdom missed: default buttons were 52 px, not 48 px.\n- Quality floor: [[lesson-hallmark-floor]].", "date": "", "pc": "", "status": "", "links": ["M1-03", "M2-03", "S0-03", "S0-07", "decision-fight-camp", "lesson-hallmark-floor", "session-5"]}, {"id": "env-lenovo-pc", "type": "environment", "description": "LENOVO PC, the Desktop path, Node 26, Docker 29", "updated": "2026-11-12", "body": "- Repo: `C:\\Users\\LENOVO\\Desktop\\Projects\\fitSphere`.\n- Node 26.13, npm 11.20, git, WSL, `gh` logged in as `kritagyasuryavanshi` with the `workflow` scope.\n- 2026-11-12: WSL 3.0.5 and Docker Desktop 4.99.0 installed by an elevated script (Windows features WSL and VirtualMachinePlatform, winget packages). The user is in `docker-users`. A restart was pending at the end of [[session-6]].\n- [[session-7]]: post-restart checks pass. Docker server 29.9.3, `db:start` and `test:db` green, `.env.local` recreated. Playwright Chromium installed.\n- Post-restart steps, for reference: open Docker Desktop once and accept its terms, then `docker version`, `npm run db:start`, `npm run test:db`, and recreate `apps/web/.env.local` from `npx supabase status` ([[db]]). If images fail with \"exec format error\", see [[lesson-docker-welcome]].\n- 45 GB free on C:, 7.8 GB RAM, virtualization on. Analytics stays off in Supabase to save RAM.\n- Bun 1.4.4 and Codex CLI 0.167.2 installed in [[session-6]] ([[tooling]]).\n- Python available (board and mockup scripts).\n- Checked in [[session-6]]. See [[lesson-stale-node-modules]], [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["db", "lesson-docker-welcome", "lesson-stale-node-modules", "project-overview", "session-6", "session-7", "tooling"]}, {"id": "env-welcome-pc", "type": "environment", "description": "WELCOME PC, Node 22, Docker 29 on D: (auto-starts), Playwright Chromium, local Supabase works", "updated": "2026-11-19", "body": "- Repo: `C:\\Users\\WELCOME\\fitSphere`.\n- Node 22.19, npm 11.6, Docker 29, `gh` at `C:\\Program Files\\GitHub CLI\\gh.exe`, logged in as `kritagyasuryavanshi`. Bun and Codex CLI are not installed here, so reviews use `/code-review` and `/security-review` ([[tooling]]).\n- Docker Desktop is a per-user install at `C:\\Users\\WELCOME\\AppData\\Local\\Programs\\DockerDesktop` (not Program Files). Since [[session-12]] it starts at sign-in: `AutoStart` is true in `%APPDATA%\\Docker\\settings-store.json` and a `Docker Desktop` entry is in the HKCU Run key. Supabase does not start itself: run `npm run db:start` (it may say \"container is not ready: starting\" right after Docker starts; wait for the DB container to be healthy and run it again).\n- Playwright Chromium is installed (since [[session-12]]).\n- Sleep and hibernate are off on AC power, and Windows Update was paused to 2026-11-25, so the PC can run Claude unattended through Remote Control ([[multi-pc-workflow]]).\n- 8 GB RAM and little space on C: (about 9 GB free). See [[lesson-docker-welcome]].\n- Windows PowerShell 5.1 reads and writes UTF-8 files as the ANSI code page: see [[lesson-windows-powershell-utf8]].\n- Session transcripts stay on each PC; the repo carries the context.\n- Set up in [[session-5]]. See [[db]], [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["db", "lesson-docker-welcome", "lesson-windows-powershell-utf8", "multi-pc-workflow", "project-overview", "session-12", "session-5", "tooling"]}, {"id": "lesson-auto-mode-merge", "type": "lesson", "description": "Claude Code auto mode blocks Claude from merging its own PRs", "updated": "2026-11-12", "body": "`gh pr merge` was denied as \"merge without review\" in [[session-6]], even though CLAUDE.md allows pushes to main. The owner merges PRs, or adds a permission rule. See [[ci]], [[tooling]].\n\nStill blocked after the owner applied an allow list with `Bash(gh pr:*)` in the same session. Either the classifier overrides allow rules for merges, or new rules load only at session start. Test once in a fresh session; if still blocked, the owner merges.", "date": "", "pc": "", "status": "", "links": ["ci", "session-6", "tooling"]}, {"id": "lesson-bun-gstack", "type": "lesson", "description": "gstack tools that need Bun fail until Bun is installed; use npm run verify", "updated": "2026-11-12", "body": "gstack setup failed for lack of Bun in [[session-1]]. Use `npm run verify` instead of gstack `/verify`. See [[tooling]], [[owner-decisions]].", "date": "", "pc": "", "status": "", "links": ["owner-decisions", "session-1", "tooling"]}, {"id": "lesson-conflict-skips-ci", "type": "lesson", "description": "2026-11-19: a PR with a merge conflict gets no CI run; board.html conflicts are fixed by regenerating it", "updated": "2026-11-19", "body": "In [[session-12]], PR #24 showed \"no checks reported\". It was not Actions or billing: GitHub does not run `pull_request` workflows while a PR conflicts with its base. `gh pr view N --json mergeable,mergeStateStatus` shows `CONFLICTING` / `DIRTY`.\n\n- The usual conflict is `docs/plans/board.html`, which is generated. Merge `main` into the branch (a merge commit, so no force-push), run `python docs/plans/build_board.py`, and commit.\n- Rebasing a pushed branch needs a force-push, which needs the owner's approval ([[constraints]]). Merge instead.\n- Stacked PRs: open the next PR against the previous branch, then `gh pr edit N --base main` once the one below merges.\n\nSee [[ci]], [[build-board]].", "date": "", "pc": "", "status": "", "links": ["build-board", "ci", "constraints", "session-12"]}, {"id": "lesson-docker-welcome", "type": "lesson", "description": "Docker on the WELCOME PC, low disk space, exec format errors, WSL 1603", "updated": "2026-11-12", "body": "- C: has little space, so Docker storage lives on `D:\\Docker`. npm's cache was cleared to fit WSL.\n- WSL install error 1603: check disk space in the installer log.\n- \"exec format error\" after the first `supabase start`: images unpacked with empty programs during the parallel pull. Remove the Supabase images and `docker pull` them one at a time.\n- Docker Desktop did not always start on its own after a restart: its own \"Start when you sign in\" setting (`AutoStart`) was off. Fixed in [[session-12]]: quit Docker, set `AutoStart` to true in `%APPDATA%\\Docker\\settings-store.json`, start it again. Docker can overwrite that file on quit, so change it only while Docker is stopped.\n- The per-user install lives in `%LOCALAPPDATA%\\Programs\\DockerDesktop`, not Program Files.\n\nFrom [[session-5]]. See [[env-welcome-pc]], [[db]].", "date": "", "pc": "", "status": "", "links": ["db", "env-welcome-pc", "session-12", "session-5"]}, {"id": "lesson-gh-workflow-scope", "type": "lesson", "description": "Pushing .github/workflows needs the gh workflow scope and gh as the git credential helper", "updated": "2026-11-12", "body": "GitHub rejects the push with \"refusing to allow an OAuth App to create or update workflow without workflow scope\". Fix: `gh auth refresh -h github.com -s workflow`, then `gh auth setup-git`. Done on [[env-lenovo-pc]] in [[session-6]]. See [[ci]].\n\nSide effect: `gh auth setup-git` sets the gh helper for all of `https://github.com`, which breaks pushes to repos of the other account (`Akash9179`). Scope it instead: unset `credential.https://github.com.helper`, then add `credential.https://github.com/kritagyasuryavanshi.helper` as `\"\"` followed by the gh helper.", "date": "", "pc": "", "status": "", "links": ["ci", "env-lenovo-pc", "session-6"]}, {"id": "lesson-github-push-500", "type": "lesson", "description": "GitHub pushes sometimes fail with Internal Server Error; retry after a few seconds", "updated": "2026-11-12", "body": "Seen in [[session-2]]. A retry works. See [[tooling]].", "date": "", "pc": "", "status": "", "links": ["session-2", "tooling"]}, {"id": "lesson-hallmark-floor", "type": "lesson", "description": "Hallmark is a quality floor only; three of its Floor rules stay unmet by choice", "updated": "2026-11-12", "body": "Used for focus rings, 44 px targets, active and disabled states, no invented metrics, no em-dashes in copy. Its Floor rules 48, 54 and 63 conflict with the canvas format and the Fight Camp voice, so they stay unmet. ui-ux-pro-max style picks were rejected; its UX rules were used (empty states, inline errors, destructive confirms). From [[session-3]]. See [[decision-fight-camp]], [[design-system]].", "date": "", "pc": "", "status": "", "links": ["decision-fight-camp", "design-system", "session-3"]}, {"id": "lesson-headless-chrome-500px", "type": "lesson", "description": "Headless Chrome cannot go below 500 px wide; phone checks need a fixed 390 px root", "updated": "2026-11-12", "body": "Found in [[session-3b]]. See [[mockups]].", "date": "", "pc": "", "status": "", "links": ["mockups", "session-3b"]}, {"id": "lesson-next16-suspense", "type": "lesson", "description": "2026-11-13: Next 16 Cache Components: dynamic routes, usePathname, soft 404, hidden old pages, and accessible names", "updated": "2026-11-19", "body": "Found while building the library in [[session-10]]. Related: [[lesson-prod-build-e2e]].\n\n- A page that reads params or searchParams must put that work inside `<Suspense>`. Otherwise the build and dev log \"uncached data\".\n- `usePathname()` on a dynamic route also needs `<Suspense>`. `HeaderLinks` and `BottomTabs` now wrap it, with a fallback that marks no link.\n- `notFound()` inside `<Suspense>` streams a soft 404: status 200, the not-found page and a noindex tag. e2e checks the not-found heading, not the status. Relearned in [[session-12]] on `/join/[code]`: read this note before writing a 404 test.\n- After client navigation the previous page stays in the DOM, hidden. Match text with `.filter({ visible: true })`, or by role and exact name. In [[session-12]], `getByLabel('Invite link')` also matched the hidden reset dialog labelled \"Reset the invite link?\".\n- `npx playwright screenshot` fires before streamed content arrives. Pass `--wait-for-selector h1`.\n- A link or button whose name ends in an `sr-only` span (`Edit<span className=\"sr-only\">: Title<\/span>`) does not match the exact joined string in Playwright. Use a regex such as `{ name: /^Edit/ }` ([[session-12]]).", "date": "", "pc": "", "status": "", "links": ["lesson-prod-build-e2e", "session-10", "session-12"]}, {"id": "lesson-prod-build-e2e", "type": "lesson", "description": "2026-11-12: run e2e against a production build (CI=1) before pushing; dev mode hid four bugs", "updated": "2026-11-12", "body": "Dev mode hid bugs that CI's production build showed ([[M1-07]], [[session-9]]). Before pushing, run `npm run build` in `apps/web`, then `CI=1 npx playwright test --retries=0`.\n\nWhat it caught:\n- A GET route handler that checks an env flag before reading the request is prerendered at build time with the flag off. Put `await connection()` first ([[route-guards]]).\n- A form that streams in behind a Suspense fallback holding a copy of itself drops typed text. Stream only the dynamic part.\n- A tap before hydration is sent twice (native submit, then React's replay). Submit buttons use `useHydrated()` from `apps/web/src/lib/use-hydrated.ts`.\n- The suite signs up more than 30 users in 5 minutes; local `config.toml` raises the auth rate limits. Production limits live in the dashboard.\n- Stale `.next/dev/types` break `npm run build` after a route moves. Start the dev server once (any e2e run) to refresh them.", "date": "", "pc": "", "status": "", "links": ["M1-07", "route-guards", "session-9"]}, {"id": "lesson-seo-plugins", "type": "lesson", "description": "claude-seo is disabled until launch; OpenSEO is enabled and paid", "updated": "2026-11-12", "body": "claude-seo comes back at board task M6-01. OpenSEO uses a paid hosted service (app.openseo.so) and needs sign-in on first use. See [[tooling]].", "date": "", "pc": "", "status": "", "links": ["tooling"]}, {"id": "lesson-skills-cli-node", "type": "lesson", "description": "The skills CLI needs Node 22.20 or later", "updated": "2026-11-12", "body": "Run it with `npx -y -p node@22 -p skills skills ...` when Node is older. Found in [[session-3]]. See [[tooling]].", "date": "", "pc": "", "status": "", "links": ["session-3", "tooling"]}, {"id": "lesson-stale-node-modules", "type": "lesson", "description": "Run npm ci after pulling on a PC that has been idle", "updated": "2026-11-12", "body": "In [[session-6]], `verify` failed on [[env-lenovo-pc]]: `@supabase/supabase-js` was missing because `node_modules` predated [[S0-04]]. `npm ci` fixed it.\n\nIt happened again in [[session-8]]: `npm ci` on old `main`, then a switch to a branch with Playwright. Run `npm ci` after every branch switch that changes `package-lock.json`.", "date": "", "pc": "", "status": "", "links": ["S0-04", "env-lenovo-pc", "session-6", "session-8"]}, {"id": "lesson-unsplash", "type": "lesson", "description": "The Unsplash search API refuses scripts; download by known photo ID instead", "updated": "2026-11-12", "body": "Download from images.unsplash.com by photo ID. Found in [[session-3c]]. See [[mockups]].", "date": "", "pc": "", "status": "", "links": ["mockups", "session-3c"]}, {"id": "lesson-windows-powershell-utf8", "type": "lesson", "description": "2026-11-19: Windows PowerShell 5.1 Get-Content/Set-Content garble UTF-8 files; edit with the editor tools", "updated": "2026-11-19", "body": "In [[session-12]] a `(Get-Content f -Raw) -replace ... | Set-Content -Encoding utf8` edit of an e2e spec turned `×` and `·` into `Ã—` and `Â·`, and the tests then looked for the garbled text. Windows PowerShell 5.1 reads a file without a BOM as the ANSI code page.\n\n- Change source files with the Edit or Write tools, never with PowerShell text pipelines.\n- To read UTF-8 in PowerShell, use `[IO.File]::ReadAllText(path)`. Console output of `Get-Content` can also look garbled (`Â·`) while the file is fine.\n- `git commit -F -` with a here-string does not work in PowerShell 5.1; write the message to a file in the scratchpad and pass `-F <file>`.\n\nSee [[env-welcome-pc]], [[tooling]].", "date": "", "pc": "", "status": "", "links": ["env-welcome-pc", "session-12", "tooling"]}, {"id": "marketplace", "type": "area", "description": "Coach marketplace in v1 (milestone M4)", "updated": "2026-11-12", "body": "Decided in [[decision-marketplace-in-v1]].\n\n- Scope: discover, compare, shortlist, hire, chat, pay, payouts, verified reviews, coach clients and earnings, admin credential checks.\n- Payment provider recommended: Razorpay with Route. The owner confirms before M4 ([[owner-decisions]]).\n- Risks: empty marketplace before about 20 coaches, payment milestone size, credential checks, client-story consent.\n- Unblocked design tasks: [[M4-17]] (1:1 booking), [[M4-18]] (reports and moderation).", "date": "", "pc": "", "status": "", "links": ["M4-17", "M4-18", "decision-marketplace-in-v1", "owner-decisions"]}, {"id": "memory-system", "type": "area", "description": "How the project memory graph works and the end-of-session routine", "updated": "2026-11-12", "body": "Project memory is a graph of small notes in `docs/memory/`. Each note holds one topic. Notes link with `[[slug]]`. A link can also name a board task, such as `[[S0-05]]`.\n\nNote types:\n- **area:** a hub for one part of the project. Every other note links to at least one area.\n- **decision:** a choice with its date and reason.\n- **constraint:** a rule that holds for the whole project.\n- **lesson:** something learned the hard way.\n- **environment:** facts about one PC.\n- **session:** what one session did, with links to the notes it changed.\n- **bug:** one product bug, open or fixed.\n\nFrontmatter fields: `name` (same as the file name), `type`, `description` (one line), `updated` (date).\n\n`MEMORY.md` holds only the current state and points here. `INDEX.md` lists every note and is generated.\n\nThe board's Memory tab draws this graph: https://claude.ai/artifact/BPCG8ghatzZkV7v1haJ1z1. See [[build-board]].\n\nEnd of every session:\n1. Add a `session-N` note that links to every note the session touched. Frontmatter adds `date` (YYYY-MM-DD) and `pc` (`lenovo` or `welcome`). Body sections, in this order, empty ones left out: `## Done`, `## Bugs and errors`, `## Decisions`, `## Needs you`, `## Next`. The board's Updates tab shows these as the daily log, and \"Waiting on you\" comes from [[owner-decisions]].\n   - A product bug that stays open past the session gets its own `bug-*` note with `status: open`, then `status: fixed` and the fix. Example: [[bug-button-52px]].\n2. Update or add notes for new decisions, lessons and facts. Update `updated` on each.\n3. Update the current state in `MEMORY.md`.\n4. Run `python docs/plans/build_board.py`. It fails on a broken link or an orphan note.\n5. Commit, push and republish the board.\n\nStart of a session: read `MEMORY.md`, then `INDEX.md`, then open only the notes the task needs. Search with `grep -rl <word> docs/memory`.\n\nStarted in [[session-6]]. Hub: [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["bug-button-52px", "build-board", "owner-decisions", "project-overview", "session-6"]}, {"id": "mockups", "type": "area", "description": "Design canvas, mockup sources, build scripts and screenshot tooling", "updated": "2026-11-12", "body": "- Canvas: https://claude.ai/artifact/YVnwgT8qzwA2SerCSPasBe. Look: [[decision-fight-camp]].\n- Sources in `docs/mockups/`. Generators in `docs/mockups/build/`: `build.py` writes `.dc.html` from shared fragments. `phone.py` makes 390 px phone versions (`M-*.dc.html`). `pages_gaps.py` holds the gap screens.\n- Photos: Unsplash, credits in `docs/mockups/images/CREDITS.md`. [[lesson-unsplash]].\n- Demo people (fictional): coaches Vikram Rathore (boxing), Ananya Iyer (S&C), Rohan Desai (reviewer); athletes Kabir Malhotra and Neha (gym). Real coach photos replace the models before launch.\n- Rule: canvas edits win. Before a rebuild, port hand edits into the sources.\n- Rule: [[decision-no-design-edits]].\n- Screenshots: playwright-core with installed Chrome; it sizes the window to the full page. [[lesson-headless-chrome-500px]].\n- Design review record: `docs/designs/design-review-2026-11-05.md`, page https://claude.ai/artifact/DnbZRbQHPG74SwxnUg5Mft.\n- Known typo, left alone: the confirm screens' warning icon path reads `M12 3l10 28H2z`; the correct one, used in [[design-system]], is `M12 3l10 18H2z`.\n- History: [[session-2]], [[session-3]], [[session-3b]], [[session-3c]], [[session-3f]].", "date": "", "pc": "", "status": "", "links": ["decision-fight-camp", "decision-no-design-edits", "design-system", "lesson-headless-chrome-500px", "lesson-unsplash", "session-2", "session-3", "session-3b", "session-3c", "session-3f"]}, {"id": "multi-pc-workflow", "type": "constraint", "description": "How to work on fitSphere from two PCs (and a phone) without losing progress", "updated": "2026-11-19", "body": "GitHub is the only shared state. Claude's chat history stays on each PC; the repo carries everything else ([[memory-system]]).\n\nFrom the iPhone ([[session-12]]): in a running session type `/remote-control` (or start `claude remote-control` in the project folder) and scan the QR code; the Claude app's Code tab then drives this PC's session, with its Docker and `.env.local`. The PC must stay awake and online ([[env-welcome-pc]]). Type `/goal` in the PC terminal: a slash command pasted from the phone arrived as plain text. Cloud sessions in the app work with the PC off but cannot reach local Docker or `.env.local`.\n\nStart on any PC:\n0. Open Docker Desktop (for DB work). Open a terminal in the project folder (Explorer: right-click the folder, Open in Terminal), run `claude`, and type `resume`. End with `wrap up`. Same for every project.\n1. Open Claude in the fitSphere folder. The SessionStart hook fetches and shows if this PC is behind.\n2. `git pull`, then `npm ci` if `package-lock.json` changed ([[lesson-stale-node-modules]]).\n3. Read `MEMORY.md` and the latest session note. Check the board's Updates tab.\n\nBefore leaving a PC:\n1. Write the session note, rebuild the board, commit and push. Unfinished work goes on its branch as a `WIP:` commit, pushed. Never leave work only on one PC.\n2. Note PC-specific facts in that PC's environment note: [[env-lenovo-pc]], [[env-welcome-pc]].\n\nRules:\n- Work on one PC at a time. Do not edit the same branch on both PCs.\n- One branch per task. Merge to `main` only on green CI ([[ci]]).\n- Secrets never sync through git. `apps/web/.env.local` is made per PC from `npx supabase status` ([[db]]). Cloud keys later live in a password manager.\n- CI uses Node 22. Both PCs have Node 22 or later; `engines` requires 22 or later ([[stack]]).\n- Global Claude config syncs through the `suryavanshi-claude` repo and `sync.sh` on session start ([[tooling]]).\n\nHub: [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["ci", "db", "env-lenovo-pc", "env-welcome-pc", "lesson-stale-node-modules", "memory-system", "project-overview", "session-12", "stack", "tooling"]}, {"id": "owner-decisions", "type": "area", "description": "Open items that wait on the owner", "updated": "2026-11-19", "body": "- Merge PR #27 (M3-04) if it is still open: CI and both reviews are on the PR ([[session-12]]).\n- Follow-up, invites: after signing in, a guest lands on their home screen, not back on the invite. A safe return-to path through the magic link and Google callbacks is needed ([[programs]]).\n- Follow-up, builder: two tabs saving the same draft overwrite each other (last save wins). A version check needs a new `save_program_draft` signature ([[programs]]).\n- Decide with M3-11: may a coach see an athlete's body metrics? Today only profile, sport answers and training basics are shared with the coach ([[programs]]).\n- Sharing the date of birth with an enrolled athlete's coach follows the design (\"onboarding data while enrolled\"). Say if a coach should see age only.\n- Merge PR #1 to #6, in order ([[ci]]).\n- Before launch: a parental-consent step for under-18s, confirmed by a lawyer. There is no age limit now ([[decision-no-age-limit]]), so the app can hold a child's health data without it.\n- Before real emails use `/auth/confirm`: add a \"Continue\" page that POSTs, to stop login CSRF. Until then it is test-only ([[route-guards]]).\n- Follow-up for M3/M5: check per-sport answers against option lists stored as data in `categories`, before coaches or the AI read them ([[M1-04-review]]).\n- Before launch: a protected owner account. Today any admin can remove another admin's role; the audit log records it ([[M1-06]] review). Default applied: accepted for M1.\n- People with no role: refused for now (default applied). Revisit when a real suspend feature is built.\n- Submit buttons wait for the page script (hydration), so a tap is never sent twice. Trade-off: without the script nobody can sign in. Reviewers suggested server-side idempotency instead; sign-in also retries once on a duplicate. Keep or change ([[lesson-prod-build-e2e]]).\n- When the email sender starts: drop outbox rows older than about 7 days so no stale decision goes out (M1-07 review).\n- Is there a minimum age for coaches? Nothing checks it now ([[decision-no-age-limit]]).\n- Account deletion (M1-08, defaults applied): consent history is deleted with the account; the audit log keeps role events and an `account_deleted` event by id only; a sole admin cannot delete their own account (document a manual owner path). A lawyer should confirm the DPDP proof-of-consent position.\n- Route map change: `/account` pages serve every signed-in person, not only athletes (M1-08 review).\n- The mockup's \"use my sport, level and goals in AI answers\" switch is left out: it defaulted to on.\n- Add the legal pages (`/legal/terms`, `/legal/privacy`); links already point there and return 404 until then.\n- Approve the skills switch-off list from the /usage review (10 unused skills), or change it ([[tooling]]).\n- Set `GITHUB_PERSONAL_ACCESS_TOKEN` for the github plugin, or switch it off ([[tooling]]).\n- Switch off the unused plugins and remove the Neon connector ([[tooling]]).\n- Untracked `AGENTS.md` and `.codex/hooks.json` appeared in the repo on 2026-11-12; keep or delete ([[session-8]]).\n- Before M1-08: should consent history survive account deletion? Block admin self-delete? ([[M1-01]] review)\n- Run the scoped git credential fix, then push `suryavanshi-claude` ([[lesson-gh-workflow-scope]]).\n- Branch protection for `main`: needs GitHub Pro (paid) or a public repo. See [[ci]].\n- [[O-02]]: Supabase, Vercel, Anthropic and Google OAuth accounts. Blocks [[S0-06]] and Google sign-in.\n- [[O-09]]: answer Q-01–Q-15 or accept the defaults ([[architecture-docs]]).\n- O-04 to O-08 on the board.\n- Before M4: payment provider, fee %, refund and cancel terms, business and GST registration, coach agreement ([[marketplace]]).\n- Nutrition for fat-loss users ([[decision-no-nutrition]]).\n- Mobbin: only unofficial MCPs exist; needs a paid account. The owner must say \"install mobbin-mcp\".", "date": "", "pc": "", "status": "", "links": ["M1-01", "M1-04-review", "M1-06", "O-02", "O-09", "S0-06", "architecture-docs", "ci", "decision-no-age-limit", "decision-no-nutrition", "lesson-gh-workflow-scope", "lesson-prod-build-e2e", "marketplace", "programs", "route-guards", "session-12", "session-8", "tooling"]}, {"id": "owner-profile", "type": "area", "description": "Who the owner is and how they like to work", "updated": "2026-11-12", "body": "The owner is Kritagya Suryavanshi. Git author: `Kritagya Suryavanshi <kritagya.suryarock@gmail.com>` ([[decision-git-author]]).\n\n- Answer with a decision and move on. Avoid long question chains. The owner skipped several multi-question prompts.\n- Ask only when confused or when the direction is unclear. Otherwise act ([[session-6]]).\n- Works from two PCs: [[env-lenovo-pc]] and [[env-welcome-pc]].\n- Parallel task: meet one boxing coach and one S&C coach (the assignment in the design doc).\n- Wants all project files, memory included, in the repo ([[decision-project-folder]]).", "date": "", "pc": "", "status": "", "links": ["decision-git-author", "decision-project-folder", "env-lenovo-pc", "env-welcome-pc", "session-6"]}, {"id": "programs", "type": "area", "description": "M3 coach programs: builder, versions, invite links, enrollments, and the coach access rule", "updated": "2026-11-19", "body": "Hub for milestone M3's program work. Schema in [[db]]; built in [[session-11]] and [[session-12]].\n\n- **Programs and versions** ([[M3-01]]): one draft per program and frozen published versions. `save_program_draft` replaces the whole draft; `publish_program` freezes it and opens a copy as the next draft. The first version is live today in India; later ones from tomorrow.\n- **Schedule** ([[M3-05]]): `packages/core` `programDay`, `sessionsOn`. The India date of joining is week 1 day 1, so the builder's \"Day 1 to 7\" counts from the athlete's start, not weekdays.\n- **Builder** ([[M3-02]], PR #25): `/coach/programs`, `/coach/programs/new`, `/coach/programs/[id]`. The client keeps the whole draft and sends it as JSON; `apps/web/src/lib/program-draft.ts` mirrors `valid_prescription` (load uses the database's text rule, not floating point). \"Unpublished changes\" compares the draft's sessions with the live version (`sessionsKey`). The builder warns before leaving with unsaved changes and remounts after a save (keyed by `updated_at`).\n- **Invites** ([[M3-03]], PRs #24 and #26): one active 32-hex code per program. `/coach/programs/[id]/invite` (copy, WhatsApp, joined list, reset with a confirm screen) and the public `/join/[code]`. Joining needs sign-in, a finished sign-up (step 2), the athlete role, and a published program with a coach; a removed athlete cannot rejoin. Link origins come from `apps/web/src/lib/site-origin.ts`.\n- **Enrollments and access** ([[M3-04]], PR #27): `coach_can_read(athlete)` is the one rule for a coach reading an athlete's data: an active enrollment in a program the caller owns, plus the coach role. Policies on `profiles`, `athlete_prefs` and `athlete_basics` call it. `leave_program` (athlete), `remove_athlete` (owning coach), `my_programs()`. Screens: `/account/programs` with a leave confirm; Remove on the coach's joined list with K-ConfirmRemove.\n- Later M3 tables (logs in M3-07, feedback in M3-13) must open coach reads only through `coach_can_read`. Feedback also needs an athlete-own policy, so it survives leaving ([[M3-13]] carries the pgTAP check).\n- Helpers: `isUuid` and `ownProgram` in `apps/web/src/lib/programs.ts`; `coachWithProgram` and `newPage` in `apps/web/e2e/helpers.ts`.\n\nOpen follow-ups: [[owner-decisions]]. Hub: [[project-overview]].", "date": "", "pc": "", "status": "", "links": ["M3-01", "M3-02", "M3-03", "M3-04", "M3-05", "M3-13", "db", "owner-decisions", "project-overview", "session-11", "session-12"]}, {"id": "project-overview", "type": "area", "description": "Root hub. What fitSphere is, v1 scope, and links to every area", "updated": "2026-11-12", "body": "fitSphere is a sports learning, training and coaching platform for adult boxing beginners and independent coaches in Indian cities.\n\nv1 has three pillars ([[decision-three-pillars]]): a video learning library, a grounded AI assistant ([[ai-assistant]]), and coach-led training. The coach marketplace is in v1 too ([[marketplace]]).\n\nSources of truth: `PROJECT.md`, `docs/designs/fitsphere-v1.md`, `docs/PRODUCT_BRIEF.md`.\n\nAreas:\n- [[stack]]: the code structure and tools.\n- [[categories]]: Boxing, S&C, Gym & Fitness.\n- [[programs]]: coach programs, invites, enrollments and the coach access rule (M3).\n- [[design-system]] and [[mockups]]: the Fight Camp look.\n- [[db]]: Supabase, migrations and tests.\n- [[ci]]: GitHub Actions.\n- [[build-board]]: tasks and the working loop.\n- [[architecture-docs]]: analysis, risks and open questions.\n- [[owner-decisions]]: what waits on the owner.\n- [[constraints]]: project-wide rules.\n- [[memory-system]]: how this memory works.\n- [[tooling]]: Claude tools, plugins and permissions.\n- Environments: [[env-lenovo-pc]], [[env-welcome-pc]].\n- Owner: [[owner-profile]].", "date": "", "pc": "", "status": "", "links": ["ai-assistant", "architecture-docs", "build-board", "categories", "ci", "constraints", "db", "decision-three-pillars", "design-system", "env-lenovo-pc", "env-welcome-pc", "marketplace", "memory-system", "mockups", "owner-decisions", "owner-profile", "programs", "stack", "tooling"]}, {"id": "route-guards", "type": "area", "description": "2026-11-12: how protected routes are guarded (M1-05), and the rules every new page must follow", "updated": "2026-11-12", "body": "- Every page, route handler and server-action file under `(athlete)`, `(coach)` or `(admin)` awaits `requireRole(role)` from `apps/web/src/lib/viewer.ts` first. `guards.test.ts` fails the build if one does not ([[M1-05]]).\n- Layouts only draw shells. Next 16 does not re-run layouts on navigation, so a layout check is no guard.\n- `readAccount` is the one reader of sign-up state and roles. Sign-up is done after step 2 ([[M1-04]]); a failed read throws.\n- A guest goes to `/sign-in`, an unfinished sign-up to its next step, a missing role to `/not-allowed`.\n- `(account)` pages use `requireSignedIn()` instead: every signed-in person can download, delete and log out ([[M1-08]]).\n- `/auth/confirm` is test-only (`E2E_AUTH_CONFIRM=1`, set by Playwright). Owner decision before real emails use it: add a \"Continue\" page that POSTs, to stop login CSRF ([[owner-decisions]]).\n- The proxy matcher needs `\\.` in the string. A single backslash once made the proxy run only on `/`; `proxy.test.ts` guards it.\n- e2e signs users in with `signInAs` / `createUser` in `apps/web/e2e/helpers.ts`, through the admin API. No email, no rate limit.", "date": "", "pc": "", "status": "", "links": ["M1-04", "M1-05", "M1-08", "owner-decisions"]}, {"id": "session-1", "type": "session", "description": "2026-11-04: repo, brief, office hours, approved v1 design", "updated": "2026-11-04", "body": "## Done\n- Created the repo, the docs scaffold and the private GitHub remote ([[decision-project-folder]], [[decision-git-author]]).\n- Saved the brief to `docs/PRODUCT_BRIEF.md`. Ran /office-hours. Approved design: `docs/designs/fitsphere-v1.md`.\n- Decisions: [[decision-three-pillars]], [[decision-launch-sports]], [[decision-coach-review-flow]], [[decision-ai-grounding]], [[decision-adults-only]], [[decision-pwa-stack]], [[decision-health-consent]], [[decision-out-of-v1]].\n- One review round found 6 blocking issues, all fixed.\n- Lesson: [[lesson-bun-gstack]]. Owner style: [[owner-profile]].", "date": "2026-11-04", "pc": "lenovo", "status": "", "links": ["decision-adults-only", "decision-ai-grounding", "decision-coach-review-flow", "decision-git-author", "decision-health-consent", "decision-launch-sports", "decision-out-of-v1", "decision-project-folder", "decision-pwa-stack", "decision-three-pillars", "lesson-bun-gstack", "owner-profile"]}, {"id": "session-10", "type": "session", "description": "2026-11-13: all M1 PRs merged; milestone M2 built, reviewed by Codex and merged task by task", "updated": "2026-11-13", "body": "## Done\n- PRs #1 to #11 merged. CI on `main` is green ([[ci]]).\n- M2-01 content schema, PR #12: disciplines, muscles, content items, steps, links and muscle links ([[db]], [[categories]]).\n  Nobody writes content rows directly. `submit_content` checks completeness. `review_content` publishes or sends back with a note, and refuses `own_item`.\n- M2-02 sample content, PR #13: 14 boxing, 9 S&C and 11 gym items, all published samples, no videos. `seed_sample_content()` is idempotent.\n- M2-03 library pages, PR #14: `/learn/[category]` with URL filters built from the items. `author_names()` exposes names of published authors only.\n- M2-04 lesson pages, PR #15: `/learn/[category]/[slug]`, video on tap through youtube-nocookie, rep table per goal.\n- M2-05 search, PR #16: `/search` and `search_content(q)` with Postgres full-text.\n- Codex reviewed every PR. One P2 on M2-03 was rejected with evidence: the field it said was missing is set, and e2e covers it.\n\n- M2-06 save and complete (PR #17), M2-08 coach editor (PR #18), M2-09 review queue (PR #19), M2-07 skill path (PR #20), M2-10 daily video check and M2-11 milestone check (PR #21). Evidence: [[M2-check]].\n- Codex findings this round: revalidate only lesson paths (fixed), hyphens in category ids (fixed), batch the video checks (fixed). Rejected with evidence: an unchanged export function, and unscoped reads that RLS already scopes.\n\n- After the final Codex pass on PR #21: the video check rotates by `video_checked_at`, and `updated_at` moves only on real content edits (pgTAP `video_broken_test.sql`).\n- Test-first slipped on M2-10's route and M2-11: their tests came right after the code, not before.\n\n## Bugs and errors\n- Next 16 Cache Components: see [[lesson-next16-suspense]].\n- An old server held port 3000, and the classifier blocked inspecting it. `E2E_PORT` in `playwright.config.ts` runs e2e on another port. Magic-link specs still need 3000.\n\n## Decisions\n- The coach draft-save function moves from M2-01 to M2-08, where the editor sets its rules.\n- Samples carry no video. Invented YouTube ids would embed someone else's video.\n- Category rules are data: `categories.uses_supports` and `uses_muscles` drive the submit check (decision D5).\n\n## Next\n- M3 Coach-Led Training, starting with the first ready M3 task on the board.\n- Two phone and desktop e2e runs that create the same slug raced; `save_content_draft` now retries a unique clash with a suffix.\n- `authorNames` with the guest client cannot see reviewer-only names; pass the signed-in client.", "date": "2026-11-13", "pc": "lenovo", "status": "", "links": ["M2-check", "categories", "ci", "db", "lesson-next16-suspense"]}, {"id": "session-11", "type": "session", "description": "2026-11-14: M3 started: program schema, schedule maths and invite links built; PRs #22 and #23 open", "updated": "2026-11-14", "body": "Follows [[session-10]]. M2 is done: [[M2-check]].\n\n## Done\n- M3-01 program schema, PR #22 (branch `m3-01-program-schema`): programs, versions, sessions and typed items ([[db]]).\n  A program has one draft and frozen published versions. `save_program_draft` replaces the whole draft. `publish_program` freezes it.\n  The first version is live today in India; later versions start tomorrow. `valid_prescription` checks rounds, time and sets.\n- M3-05 schedule maths, PR #23 (branch `m3-05-schedule`, stacked on #22): `addDays`, `programDay`, `sessionsOn` in `packages/core`.\n- M3-03 invites, database part only (branch `m3-03-invites`, stacked on #23, pushed, no PR yet): `invites`, `enrollments`,\n  `program_invite`, `reset_invite`, `invite_info`, `join_program`, `program_members`. pgTAP passes. Codex: concurrent join fixed;\n  the invite-creation race was rejected, because `own_draft` locks the program row first.\n\n## Bugs and errors\n- `valid_prescription` returned null for a missing number, so a bad prescription passed. It now treats null as invalid.\n- The programs and versions policies recursed into each other; security-definer helpers `owns_program` and `program_is_published` break the loop.\n- GitHub API timed out for several minutes; retry pushes with `timeout 150 git push`, and pass `--head` to `gh pr create`.\n\n## Decisions\n- The `/goal` for M2 said \"write tests first\", which cannot be repaired after the fact and trapped the stop hook. The M3 goal says \"add tests that fail without the code\" instead.\n\n## Next\n1. Wait for CI on #22 and #23, then merge them in order.\n2. Open the M3-03 PR (database part), then build M3-02 builder and programs list (K-Programs, C-Builder), then the M3-03 screens: `/coach/programs/[id]/invite` (K-Invite, K-ConfirmReset) and `/join/[code]` (A-Invite).\n3. Then M3-04 (leave, remove, `coach_can_read`), M3-06 Today, and on through the M3 list on the board.", "date": "2026-11-14", "pc": "lenovo", "status": "", "links": ["M2-check", "db", "session-10"]}, {"id": "session-12", "type": "session", "description": "2026-11-19: WELCOME PC brought up to date; M3-02 builder, M3-03 invites and M3-04 access rule built; PRs #24 to #27", "updated": "2026-11-19", "body": "Follows [[session-11]]. Hub for this work: [[programs]].\n\n## Done\n- WELCOME PC caught up: 100 commits pulled, `npm ci`, local DB reset, `apps/web/.env.local` rewritten with `SUPABASE_SECRET_KEY` (as CI writes it), Playwright Chromium installed. Docker now starts at sign-in; sleep is off on AC; Windows Update paused to 2026-11-25 ([[env-welcome-pc]], [[lesson-docker-welcome]]).\n- The owner works from an iPhone through Remote Control while this PC runs ([[multi-pc-workflow]]).\n- M3-03 database part, PR #24, merged. Fixed first: joining needed only step 1 of sign-up. Review fixes: removed athletes cannot rejoin, the link closes when the coach deletes their account, a reset link reveals nothing, the join locks the invite row, the joined list shows active members only and needs the coach role, and the data download lists programs ([[db]]).\n- M3-02 builder, PR #25, merged ([[M3-02]]). Review fixes: two-decimal loads (floating point), unpublished drills marked, \"Unpublished changes\" compares content, unsaved-changes warning, day order.\n- M3-03 screens, PR #26, merged ([[M3-03]]). Review fixes: the join page reads the real enrollment (a `?joined=1` URL faked it), states for own program, removed and no athlete role, `lib/site-origin.ts`, `lib/programs.ts`.\n- M3-04, PR #27 ([[M3-04]]): `coach_can_read`, leave and remove with confirm screens, My programs, and the athlete role on joining. Review fixes: removing someone who already left, or leaving after removal, no longer reports the wrong outcome; `remove_athlete` returns its program. /security-review found nothing exploitable on #24, #26 and #27.\n\n## Bugs and errors\n- PR #24 got no CI run: it conflicted on the generated `board.html` ([[lesson-conflict-skips-ci]]).\n- A PowerShell text pipeline garbled `×` and `·` in an e2e spec ([[lesson-windows-powershell-utf8]]).\n- e2e locators: soft 404 status, hidden previous pages, and `sr-only` names ([[lesson-next16-suspense]]).\n- Stale `.next/dev/types` from 9 November broke the first typecheck; deleting `apps/web/.next/dev` fixed it ([[lesson-prod-build-e2e]]).\n\n## Decisions\n- A rebase of a pushed branch was undone: it needs a force-push. Branches take merge commits instead.\n- The builder's days are Day 1 to 7 from the athlete's start, not weekdays, to match the schedule maths.\n- Two sessions on one day are allowed (morning and evening).\n- Coaches see an enrolled athlete's profile, sport answers and training basics. Body metrics wait for M3-11.\n- \"Past feedback stays visible\" moved from M3-04 to M3-13, where the feedback table is built.\n\n## Needs you\n- Merge PR #27 if it is still open, and the follow-ups in [[owner-decisions]].\n\n## Next\n1. M3-06 Today: merged sessions, empty state, coach note. It is the next ready task on the board. It also carries the #27 finding: freeze title, summary and weeks on `program_versions` at publish, so athletes never see draft edits.\n2. The follow-ups in [[owner-decisions]]: invite return-to after sign-in, the draft version check.", "date": "2026-11-19", "pc": "welcome", "status": "", "links": ["M3-02", "M3-03", "M3-04", "db", "env-welcome-pc", "lesson-conflict-skips-ci", "lesson-docker-welcome", "lesson-next16-suspense", "lesson-prod-build-e2e", "lesson-windows-powershell-utf8", "multi-pc-workflow", "owner-decisions", "programs", "session-11"]}, {"id": "session-2", "type": "session", "description": "2026-11-04: moved to Desktop, three visual directions, Fight Camp
