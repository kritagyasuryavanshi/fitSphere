 "", "links": ["categories", "decision-three-categories", "lesson-unsplash"]}, {"id": "session-3d", "type": "session", "description": "2026-11-05: engineering plan and build board; marketplace moves into v1", "updated": "2026-11-05", "body": "## Done\n- [[decision-marketplace-in-v1]].\n- Engineering plan and board created ([[build-board]]). Walkthrough: https://claude.ai/artifact/217yXiVPoycExyuUg6haex.", "date": "2026-11-05", "pc": "lenovo", "status": "", "links": ["build-board", "decision-marketplace-in-v1"]}, {"id": "session-3e", "type": "session", "description": "2026-11-05: pre-implementation analysis", "updated": "2026-11-05", "body": "## Done\n- Wrote [[architecture-docs]]. Board grew to 84 tasks.\n- [[decision-no-design-edits]].", "date": "2026-11-05", "pc": "lenovo", "status": "", "links": ["architecture-docs", "decision-no-design-edits"]}, {"id": "session-3f", "type": "session", "description": "2026-11-05: design changes D1–D6 applied, gap screens", "updated": "2026-11-05", "body": "## Done\n- Owner approved D1–D6. Five phone screens fixed from real screenshots. 9 new screens for G1–G4, G6 and notifications ([[mockups]], [[architecture-docs]]).\n- Board at 85 tasks. [[M4-17]] and [[M4-18]] unblocked ([[marketplace]]).", "date": "2026-11-05", "pc": "lenovo", "status": "", "links": ["M4-17", "M4-18", "architecture-docs", "marketplace", "mockups"]}, {"id": "session-4", "type": "session", "description": "2026-11-05: build starts, stack locked, monorepo scaffold", "updated": "2026-11-05", "body": "## Done\n- [[decision-stack-locked]], [[decision-build-in-repo]].\n- Node 26 installed on [[env-lenovo-pc]]. [[S0-02]] done ([[stack]]).", "date": "2026-11-05", "pc": "lenovo", "status": "", "links": ["S0-02", "decision-build-in-repo", "decision-stack-locked", "env-lenovo-pc", "stack"]}, {"id": "session-5", "type": "session", "description": "2026-11-09: WELCOME PC, design system and local Supabase", "updated": "2026-11-09", "body": "## Done\n- Set up [[env-welcome-pc] const LABEL = {todo:'To do', in_progress:'In progress', blocked:'Blocked', done:'Done'};
const byId = Object.fromEntries(BOARD.tasks.map(t => [t.id, t]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {phase:'', status:'', prio:'', owner:'', q:''};
try { state = Object.assign(state, JSON.parse(localStorage.getItem('fs-board') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('fs-board', JSON.stringify(state)); } catch (e) {} };

function counts() {
  const n = s => BOARD.tasks.filter(t => t.status === s).length;
  const total = BOARD.tasks.length, done = n('done');
  document.getElementById('sub').textContent = `${BOARD.project} · updated ${BOARD.updated}`;
  document.getElementById('counts').innerHTML = [['Tasks', total], ['Done', done], ['In progress', n('in_progress')], ['Blocked', n('blocked')], ['Ready now', BOARD.tasks.filter(t => t.ready).length]]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  document.getElementById('overall').style.width = (total ? done * 100 / total : 0) + '%';
  const ready = BOARD.tasks.filter(t => t.ready || t.status === 'in_progress');
  document.getElementById('readylist').innerHTML = ready.length ? ready.map(t => `<li><a href="#t-${t.id}">${t.status === 'in_progress' ? 'Now: ' : ''}${esc(t.id)} · ${esc(t.title)}</a></li>`).join('') : '<li>Nothing is ready. Check blocked tasks.</li>';
}

function chips() {
  const el = document.getElementById('phasechips');
  el.innerHTML = [{id:'', name:'All phases'}].concat(BOARD.phases).map(p => `<button class="chip" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.id ? esc(p.id) + ' ' : ''}${esc(p.name)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state.phase = b.dataset.phase; save(); chips(); render(); };
}

function match(t) {
  if (state.phase && t.phase !== state.phase) return false;
  if (state.status === 'ready' ? !t.ready : state.status && t.status !== state.status) return false;
  if (state.prio && t.priority !== state.prio) return false;
  if (state.owner && t.owner !== state.owner) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(t.id + ' ' + t.title + ' ' + t.ac.join(' ')).toLowerCase().includes(q)) return false; }
  return true;
}

function row(t) {
  const deps = t.deps.length ? t.deps.map(d => `<a href="#t-${d}">${esc(d)}</a> <span class="muted">(${LABEL[byId[d].status]})</span>`).join(', ') : 'None';
  const screens = t.screens ? `<div><h3>Screens on the canvas</h3><p>${t.screens.map(esc).join(', ')}</p></div>` : '';
  const why = t.blocked_reason ? `<div><h3>Why blocked</h3><p>${esc(t.blocked_reason)}</p></div>` : '';
  const doneLine = t.status === 'done' ? `<div><h3>Finished</h3><p>${esc(t.done_on || '')}${t.commit ? ' · commit ' + esc(t.commit) : ''}</p></div>` : '';
  return `<details class="task" id="t-${t.id}">
    <summary><span class="st ${t.status}">${LABEL[t.status]}</span><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}${t.ready ? '<span class="rdy">Ready</span>' : ''}</span>
      <span class="meta"><span class="tag ${t.priority === 'P0' ? 'p0' : ''}">${t.priority}</span><span class="tag">${t.size === 'S' ? 'Small' : 'Medium'}</span><span class="tag ${t.owner === 'owner' ? 'own' : ''}">${t.owner === 'owner' ? 'Owner' : 'Claude'}</span><span class="tag">${esc(t.test)}</span></span></summary>
    <div class="body"><div><h3>Acceptance criteria</h3><ul>${t.ac.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="deps"><h3>Depends on</h3><p>${deps}</p></div>${why}${screens}${doneLine}</div></details>`;
}

function render() {
  document.getElementById('phases').innerHTML = BOARD.phases.map(p => {
    const all = BOARD.tasks.filter(t => t.phase === p.id);
    if (state.phase && state.phase !== p.id) return '';
    const shown = all.filter(match);
    const done = all.filter(t => t.status === 'done').length;
    return `<section class="phase" aria-labelledby="ph-${p.id}"><div class="phead"><div><h2 id="ph-${p.id}">${esc(p.id)} · ${esc(p.name)}</h2><p class="goal">${esc(p.goal)}</p></div><span class="pct">${done} / ${all.length} done</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${all.length ? done * 100 / all.length : 0}%"></i></div>
      ${shown.length ? shown.map(row).join('') : '<p class="empty">No tasks match these filters.</p>'}</section>`;
  }).join('');
}

for (const [id, key] of [['fstatus', 'status'], ['fprio', 'prio'], ['fowner', 'owner']]) {
  const el = document.getElementById(id); el.value = state[key]; el.onchange = () => { state[key] = el.value; save(); render(); };
}
const fq = document.getElementById('fq'); fq.value = state.q; fq.oninput = () => { state.q = fq.value; save(); render(); };
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#t-"]'); if (!a) return; const d = document.querySelector(a.getAttribute('href')); if (d) { if (state.phase && !d) return; d.open = true; } });
counts(); chips(); render();

// ---- Memory tab: notes from docs/memory, links as edges, linked board tasks as square nodes
const NOTES = BOARD.memory || [];
const KINDS = ['area', 'decision', 'constraint', 'lesson', 'environment', 'session', 'bug', 'task'];
const noteById = Object.fromEntries(NOTES.map(n => [n.id, n]));
let mstate = {kind: '', q: '', sel: 'project-overview'};
try { Object.assign(mstate, JSON.parse(localStorage.getItem('fs-mem') || '{}')); } catch (e) {}
const msave = () => { try { localStorage.setItem('fs-mem', JSON.stringify(mstate)); } catch (e) {} };
const backlinks = id => NOTES.filter(n => n.links.includes(id)).map(n => n.id);
const linkHtml = id => noteById[id] || byId[id] ? `<button class="lk" data-go="${esc(id)}">${esc(id)}</button>` : esc(id);

function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]|]+)\]\]/g, (m, id) => linkHtml(id))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return src.split(/\n{2,}/).map(block => {
    const h = block.match(/^#{2,3} (.+)\n?([\s\S]*)$/);
    if (h) return `<h3>${inline(h[1])}</h3>` + (h[2].trim() ? md(h[2]) : '');
    const lines = block.split('\n');
    if (lines.every(l => /^(- |\d+\. )/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^(- |\d+\. )/, ''))}</li>`).join('')}</ul>`;
    const first = lines.findIndex(l => /^(- |\d+\. )/.test(l));
    if (first > 0) return `<p>${inline(lines.slice(0, first).join(' '))}</p>` + md(lines.slice(first).join('\n'));
    return `<p>${inline(lines.join(' '))}</p>`;
  }).join('');
}

function read(id) {
  mstate.sel = id; msave();
  const el = document.getElementById('reader');
  const t = byId[id], n = noteById[id];
  if (t) {
    el.innerHTML = `<p class="kind">Board task · ${LABEL[t.status]}</p><h2>${esc(t.id)}</h2><p>${esc(t.title)}</p>
      <p><button class="lk" data-task="${esc(t.id)}">Open in the Tasks tab</button></p>
      <h3>Notes that link here</h3><p>${backlinks(id).map(linkHtml).join(', ') || 'None'}</p>`;
  } else if (n) {
    const back = backlinks(id);
    el.innerHTML = `<p class="kind">${esc(n.type)} · updated ${esc(n.updated)}</p><h2>${esc(n.id)}</h2><p class="muted">${esc(n.description)}</p>${md(n.body)}
      <h3>Linked from</h3><p>${back.map(linkHtml).join(', ') || 'Nothing links here yet'}</p>
      <p class="muted" style="font-size:13px">File: docs/memory/${esc(n.id)}.md</p>`;
  } else { el.innerHTML = '<p class="muted">Click a node to read its note.</p>'; }
  highlight();
}

let gsel = null;
function highlight() {
  if (!gsel) return;
  const q = mstate.q.toLowerCase();
  const hit = d => (!mstate.kind || d.kind === mstate.kind) && (!q || d.text.includes(q));
  const near = new Set([mstate.sel]);
  gsel.links.each(l => { if (l.source.id === mstate.sel) near.add(l.target.id); if (l.target.id === mstate.sel) near.add(l.source.id); });
  gsel.nodes.classed('dim', d => !hit(d)).classed('sel', d => d.id === mstate.sel);
  gsel.labels.classed('dim', d => !hit(d));
  gsel.links.classed('hot', l => l.source.id === mstate.sel || l.target.id === mstate.sel)
    .classed('dim', l => !(hit(l.source) && hit(l.target)) && !(near.has(l.source.id) && near.has(l.target.id)));
}

function graph() {
  const svg = d3.select('#graph');
  const box = svg.node().getBoundingClientRect();
  const W = box.width || 800, H = box.height || 600;
  svg.attr('viewBox', [0, 0, W, H]);
  const taskIds = [...new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l]))];
  const nodes = NOTES.map(n => ({id: n.id, kind: n.type, text: (n.id + ' ' + n.description + ' ' + n.body).toLowerCase()}))
    .concat(taskIds.map(id => ({id, kind: 'task', text: (id + ' ' + byId[id].title).toLowerCase()})));
  const links = NOTES.flatMap(n => n.links.map(l => ({source: n.id, target: l})));
  const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  const r = d => d.kind === 'task' ? 6 : 5 + Math.min(12, Math.sqrt(deg[d.id] || 1) * 2.2);
  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([.2, 4]).on('zoom', e => { root.attr('transform', e.transform); root.selectAll('text').style('font-size', 12 / e.transform.k + 'px'); });
  svg.call(zoom);
  const fit = () => {
    const b = root.node().getBBox(); if (!b.width) return;
    const k = Math.min(1.4, .94 * Math.min(W / b.width, H / b.height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (b.x + b.width / 2), H / 2 - k * (b.y + b.height / 2)).scale(k));
  };
  const lk = root.append('g').selectAll('line').data(links).join('line');
  const shapes = root.append('g').selectAll('path').data(nodes).join('path')
    .attr('class', d => 'n k-' + d.kind)
    .attr('d', d => d.kind === 'task' ? d3.symbol(d3.symbolSquare, 110)() : d3.symbol(d3.symbolCircle, Math.PI * r(d) ** 2)())
    .on('click', (e, d) => read(d.id));
  shapes.append('title').text(d => d.id);
  const lb = root.append('g').selectAll('text').data(nodes.filter(d => d.kind === 'area' || d.kind === 'task' || (deg[d.id] || 0) > 5)).join('text')
    .text(d => d.id).attr('dx', d => r(d) + 3).attr('dy', 4);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.source.kind === 'area' && l.target.kind === 'area' ? 120 : 55))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => r(d) + 4));
  const tick = () => {
    lk.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    shapes.attr('transform', d => `translate(${d.x},${d.y})`);
    lb.attr('x', d => d.x).attr('y', d => d.y);
  };
  sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); tick(); fit();
  if (!reduce) sim.on('tick', tick);
  shapes.call(d3.drag()
    .on('start', (e, d) => { if (!e.active && !reduce) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; if (reduce) { d.x = e.x; d.y = e.y; tick(); } })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  gsel = {nodes: shapes, links: lk, labels: lb};
}

function mchips() {
  const count = k => k === 'task' ? new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l])).size : NOTES.filter(n => n.type === k).length;
  document.getElementById('mchips').innerHTML = [''].concat(KINDS).map(k => `<button class="chip" data-kind="${k}" aria-pressed="${mstate.kind === k}">${k ? k[0].toUpperCase() + k.slice(1) + ' ' + count(k) : 'All ' + NOTES.length + ' notes'}</button>`).join('');
  document.getElementById('legend').innerHTML = KINDS.map(k => `<span><i class="k-${k}"></i>${k}</span>`).join('');
  document.querySelectorAll('#legend i').forEach((i, n) => { i.style.background = getComputedStyle(i).fill; if (KINDS[n] === 'task') i.style.border = '1.5px solid var(--fg)'; });
}

// ---- Updates tab: one card per day from session notes, plus board tasks finished that day
const SECTIONS = ['Done', 'Bugs and errors', 'Decisions', 'Needs you', 'Next'];
function sections(body) {
  const out = {}; let cur = 'Done';
  for (const part of body.split(/^## /m)) {
    if (!part.trim()) continue;
    const nl = part.indexOf('\n'), head = nl < 0 ? part : part.slice(0, nl);
    if (SECTIONS.includes(head.trim())) { cur = head.trim(); out[cur] = (out[cur] || '') + (nl < 0 ? '' : part.slice(nl + 1)); }
    else out[cur] = (out[cur] || '') + part;
  }
  return out;
}
function updates() {
  const sess = NOTES.filter(n => n.type === 'session' && n.date).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id, undefined, {numeric: true}));
  const days = [...new Set(sess.map(s => s.date))];
  const openBugs = NOTES.filter(n => n.type === 'bug' && n.status === 'open');
  const week = new Date(Date.parse(BOARD.updated) - 6 * 864e5).toISOString().slice(0, 10);
  document.getElementById('ucounts').innerHTML = [['Days logged', days.length], ['Tasks done, last 7 days', BOARD.tasks.filter(t => t.done_on && t.done_on >= week).length], ['Open bugs', openBugs.length], ['Last update', sess[0] ? sess[0].date.slice(5) : 'none']]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  const waiting = noteById['owner-decisions'];
  document.getElementById('waiting').innerHTML = waiting ? md(waiting.body) : '<p>Nothing recorded.</p>';
  document.getElementById('bugs').innerHTML = openBugs.length ? `<ul>${openBugs.map(b => `<li>${linkHtml(b.id)}: ${esc(b.description)}</li>`).join('')}</ul>` : '<p class="muted">No open bugs.</p>';
  document.getElementById('days').innerHTML = days.map(d => {
    const ss = sess.filter(s => s.date === d);
    const tasks = BOARD.tasks.filter(t => t.done_on === d);
    const merged = {};
    ss.forEach(s => { const sec = sections(s.body); SECTIONS.forEach(k => { if (sec[k] && sec[k].trim()) merged[k] = (merged[k] ? merged[k] + '\n\n' : '') + sec[k].trim(); }); });
    const label = new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
    const cls = {'Bugs and errors': 'bugs', 'Needs you': 'needs'};
    return `<article class="day"><header><h2>${esc(label)}</h2><span>${[...new Set(ss.map(s => s.pc))].map(p => `<span class="pc">${esc(p)} PC</span>`).join(' ')} <span class="muted">${ss.map(s => linkHtml(s.id)).join(', ')}</span></span></header>
      <p class="muted">${ss.map(s => esc(s.description.replace(/^\d{4}-\d{2}-\d{2}: /, ''))).join(' · ')}</p>
      <div class="secs">${tasks.length ? `<div><h3>Board tasks finished</h3><ul>${tasks.map(t => `<li>${linkHtml(t.id)} ${esc(t.title)}${t.commit ? ' <span class="muted">(' + esc(t.commit) + ')</span>' : ''}</li>`).join('')}</ul></div>` : ''}
      ${SECTIONS.filter(k => merged[k]).map(k => `<div><h3 class="${cls[k] || ''}">${k}</h3>${md(merged[k])}</div>`).join('')}</div></article>`;
  }).join('') || '<p class="empty">No sessions logged yet.</p>';
}

let drawn = false, updDrawn = false;
const TABS = ['tasks', 'updates', 'memory'];
function showTab(name) {
  if (!TABS.includes(name)) name = 'tasks';
  const mem = name === 'memory';
  for (const t of TABS) { document.getElementById('tab-' + t).hidden = t !== name; document.getElementById('tb-' + t).setAttribute('aria-selected', t === name); }
  try { localStorage.setItem('fs-tab', name); } catch (e) {}
  if (name === 'updates' && !updDrawn) { updDrawn = true; updates(); }
  if (mem && !drawn) {
    drawn = true; mchips();
    if (window.d3) graph(); else document.getElementById('graph').outerHTML = '<p class="empty">The graph library did not load. Notes are still readable from the links in the reader.</p>';
    read(mstate.sel);
  }
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.id.slice(3)); };
document.querySelector('.tabs').onkeydown = e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const cur = TABS.findIndex(t => document.getElementById('tb-' + t).getAttribute('aria-selected') === 'true');
  const next = TABS[(cur + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
  showTab(next); document.getElementById('tb-' + next).focus();
};
document.getElementById('tab-updates').onclick = e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  if (byId[g.dataset.go] && !noteById[g.dataset.go]) { showTab('tasks'); const d = document.getElementById('t-' + g.dataset.go); if (d) { d.open = true; d.scrollIntoView(); } }
  else { showTab('memory'); read(g.dataset.go); }
};
document.getElementById('mchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; mstate.kind = b.dataset.kind; msave(); mchips(); highlight(); };
const mq = document.getElementById('mq'); mq.value = mstate.q; mq.oninput = () => { mstate.q = mq.value; msave(); highlight(); };
document.getElementById('reader').onclick = e => {
  const g = e.target.closest('[data-go]'); if (g) return read(g.dataset.go);
  const t = e.target.closest('[data-task]'); if (t) { showTab('tasks'); const d = document.getElementById('t-' + t.dataset.task); if (d) { d.open = true; d.scrollIntoView(); } }
};
let startTab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'tasks';
try { if (!TABS.includes(location.hash.slice(1))) startTab = localStorage.getItem('fs-tab') || 'tasks'; } catch (e) {}
showTab(startTab);
</script>
