<title>FitSphere Build Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phase sections stacked, one dense row per task, details on demand. Fight Camp type, black and white, volt marks what is ready. */
:root{
  --bg:#ffffff; --fg:#111111; --soft:#f5f5f5; --line:#e2e2e2; --muted:#6b6b6e; --ink-2:#39393b;
  --volt:#D4F000; --on-volt:#111111; --done:#00653a; --done-bg:#e3f4ec; --block:#a3001a; --block-bg:#fde8eb; --prog-bg:#f6fbcc;
  --display:Anton, Impact, "Arial Narrow", sans-serif; --body:Inter, Helvetica, Arial, sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance}
h1{font-size:clamp(48px,8vw,96px)}
h2{font-size:clamp(30px,4vw,44px)}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.counts{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;border-top:2px solid var(--fg);padding-top:16px}
.counts div{min-width:110px}
.counts b{display:block;font-family:var(--display);font-size:44px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);margin-top:10px}
.bar > i{display:block;height:100%;background:var(--fg)}
.ready{margin-top:32px;background:var(--fg);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:12px}
.ready h2{font-size:28px}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.ready li a{display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:0 16px;border-radius:30px;background:var(--volt);color:var(--on-volt);font-weight:600;text-decoration:none}
.filters{margin-top:32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:30px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=search]{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--line);border-radius:30px;padding:0 14px;background:var(--bg);color:var(--fg)}
input[type=search]{min-width:0;flex:1 1 180px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
section.phase{margin-top:48px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:12px}
.phead .goal{max-width:62ch;color:var(--ink-2);margin-top:8px}
.phead .pct{font-variant-numeric:tabular-nums;font-weight:600}
.task{border-bottom:1px solid var(--line)}
.task summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:110px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;min-height:52px}
.task summary::-webkit-details-marker{display:none}
.task summary:hover{background:var(--soft)}
.st{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:30px;white-space:nowrap}
.st.todo{border:1px solid var(--line);color:var(--muted)}
.st.in_progress{background:var(--volt);color:var(--on-volt)}
.st.blocked{background:var(--block-bg);color:var(--block)}
.st.done{background:var(--done-bg);color:var(--done)}
.id{font-weight:600;font-variant-numeric:tabular-nums}
.title{min-width:0}
.title .rdy{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;background:var(--volt);color:var(--on-volt);padding:2px 8px;border-radius:30px;vertical-align:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);padding:3px 9px;border-radius:30px;white-space:nowrap}
.tag.p0{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag.own{border-style:dashed}
.body{padding:4px 4px 20px 186px;display:grid;gap:12px}
.body h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.body ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:78ch}
.deps a{color:inherit;font-weight:600}
.empty{padding:20px 4px;color:var(--muted)}
@media (max-width:720px){
  .task summary{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"st id" "title title" "meta meta"}
  .task summary .st{grid-area:st;justify-self:start}.task summary .id{grid-area:id}.task summary .title{grid-area:title}.task summary .meta{grid-area:meta;justify-content:flex-start}
  .body{padding-left:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{display:flex;gap:8px;margin-top:28px;border-bottom:2px solid var(--fg)}
.tabs button{font:inherit;font-weight:600;font-size:15px;min-height:48px;padding:0 20px;border:0;border-radius:30px 30px 0 0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px}
#graph{width:100%;height:620px;background:var(--soft);display:block;touch-action:none}
#graph text{font:500 11px var(--body);fill:var(--ink-2);pointer-events:none}
#graph line{stroke:var(--line);stroke-width:1.2}
#graph line.hot{stroke:var(--fg);stroke-width:2}
#graph .n{cursor:pointer;stroke:var(--bg);stroke-width:1.5}
#graph .n.sel{stroke:var(--fg);stroke-width:3}
#graph .dim{opacity:.15}
.k-area{fill:var(--volt)}.k-decision{fill:var(--fg)}.k-constraint{fill:var(--block)}.k-lesson{fill:#c26a00}.k-environment{fill:var(--done)}.k-session{fill:var(--muted)}.k-task{fill:var(--bg);stroke:var(--fg)!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.reader{border-top:2px solid var(--fg);padding-top:14px;max-height:620px;overflow:auto}
.reader h2{font-size:30px;overflow-wrap:anywhere}
.reader .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.reader p,.reader ul{margin:10px 0;max-width:70ch}
.reader ul{padding-left:20px}
.reader code{font-size:13px;background:var(--soft);padding:1px 5px;overflow-wrap:anywhere}
.reader a,.reader button.lk{color:inherit;font-weight:600;text-decoration:underline;background:none;border:0;padding:0;font:inherit;font-weight:600;cursor:pointer}
.reader h3{font-size:13px;color:var(--muted);margin:18px 0 4px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}#graph{height:440px}.reader{max-height:none}}
</style>

<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:10px">
      <p class="muted" id="sub"></p>
      <h1>Build board</h1>
    </div>
    <p class="muted" style="max-width:44ch">One task at a time: tests first, then code, then verify. A task is ready when every task it depends on is done.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Board views">
    <button role="tab" id="tb-tasks" aria-controls="tab-tasks" aria-selected="true">Tasks</button>
    <button role="tab" id="tb-memory" aria-controls="tab-memory" aria-selected="false">Memory</button>
  </div>
  <div id="tab-tasks" role="tabpanel" aria-labelledby="tb-tasks">
  <div class="counts" id="counts"></div>
  <div class="bar" aria-hidden="true"><i id="overall"></i></div>
  <section class="ready" aria-labelledby="readyh">
    <h2 id="readyh">Ready to start</h2>
    <ul id="readylist"></ul>
  </section>
  <div class="filters" role="group" aria-label="Filters">
    <div id="phasechips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <label><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Status</span><select id="fstatus"><option value="">Any status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="ready">Ready now</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Priority</span><select id="fprio"><option value="">Any priority</option><option>P0</option><option>P1</option><option>P2</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Owner</span><select id="fowner"><option value="">Anyone</option><option value="claude">Claude</option><option value="owner">Owner</option></select></label>
    <input type="search" id="fq" placeholder="Search tasks" aria-label="Search tasks">
  </div>
  <div id="phases"></div>
  </div>
  <div id="tab-memory" role="tabpanel" aria-labelledby="tb-memory" hidden>
    <div class="filters" role="group" aria-label="Memory filters">
      <div id="mchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <input type="search" id="mq" placeholder="Search memory" aria-label="Search memory">
    </div>
    <div class="legend" id="legend"></div>
    <div class="mgrid">
      <svg id="graph" role="img" aria-label="Memory graph. Click a node to read its note."></svg>
      <article class="reader" id="reader" aria-live="polite"></article>
    </div>
  </div>
</div>

<script>
const BOARD = {"project": "FitSphere v1", "updated": "2026-11-12", "status_values": ["todo", "in_progress", "blocked", "done"], "phases": [{"id": "O", "name": "Owner", "goal": "Decisions, accounts and people only the owner can provide."}, {"id": "S0", "name": "Setup", "goal": "An empty app that builds, tests and deploys a preview on every pull request."}, {"id": "M1", "name": "Foundation", "goal": "Sign-in, 18+ sign-up, roles, app shells, account and consent, with access rules proven by tests."}, {"id": "M2", "name": "Library", "goal": "Boxing, S&C and Gym lessons people can browse, search, save and complete, with author, review and publish."}, {"id": "M3", "name": "Training", "goal": "Coaches build and share programs; athletes train, log and see progress; coaches see logs and give feedback."}, {"id": "M4", "name": "Marketplace", "goal": "Athletes find, compare, hire and pay coaches; coaches earn; reviews are verified."}, {"id": "M5", "name": "AI guide", "goal": "Cited, safe answers from published lessons, with a daily limit and a passing eval set."}, {"id": "M6", "name": "Launch", "goal": "Public pages, legal, every state, PWA, speed, accessibility, security, QA, then production."}], "tasks": [{"id": "O-01", "phase": "O", "title": "Confirm the stack: Next.js only, Supabase, Razorpay", "priority": "P0", "size": "S", "deps": [], "status": "done", "owner": "owner", "test": "manual", "ac": ["Owner confirms or changes the choices in section 1 of the engineering plan", "Decision recorded in MEMORY.md"], "done_on": "2026-11-05", "ready": false}, {"id": "O-02", "phase": "O", "title": "Create Supabase (Mumbai), Vercel, Anthropic API and Google OAuth accounts", "priority": "P0", "size": "S", "deps": ["O-01"], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Keys shared through a password manager or Vercel and GitHub secrets, never in chat or the repo", "Google OAuth client has the preview and production callback URLs"], "ready": true}, {"id": "O-03", "phase": "O", "title": "Upgrade this PC to Node 22 LTS", "priority": "P0", "size": "S", "deps": [], "status": "done", "owner": "owner", "test": "manual", "ac": ["node --version prints v22 or later (installed v26.13.0 LTS)"], "done_on": "2026-11-05", "ready": false}, {"id": "O-04", "phase": "O", "title": "Payment provider account, KYC, business and GST registration", "priority": "P0", "size": "M", "deps": ["O-01"], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Test-mode keys available before M4-09", "Route (split payouts) enabled before M4-12", "Live mode stays off until M4-16 passes"], "ready": true}, {"id": "O-05", "phase": "O", "title": "Set the platform fee %, refund and cancel terms, and the coach agreement", "priority": "P0", "size": "S", "deps": [], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Fee %, refund window and cancel rule written in MEMORY.md", "Coach agreement text ready for M4-02"], "ready": true}, {"id": "O-06", "phase": "O", "title": "Sign founding coaches: one boxing, one S&C or gym", "priority": "P0", "size": "M", "deps": [], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Each coach lists the first 20 skills or exercises a beginner needs", "Each records at least 5 lessons on YouTube before M6"], "ready": true}, {"id": "O-07", "phase": "O", "title": "Legal review of privacy policy and terms (DPDP, marketplace)", "priority": "P0", "size": "M", "deps": [], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Signed-off text available before M6-02"], "ready": true}, {"id": "O-08", "phase": "O", "title": "Decide on nutrition (meal plans or calorie targets)", "priority": "P2", "size": "S", "deps": [], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Decision in MEMORY.md; out of v1 unless stated"], "ready": true}, {"id": "O-09", "phase": "O", "title": "Answer the missing requirements Q-01 to Q-15", "priority": "P0", "size": "S", "deps": [], "status": "todo", "owner": "owner", "test": "manual", "ac": ["Each question in docs/architecture/risks-and-gaps.md has an answer or accepts the stated default", "Answers recorded in MEMORY.md decisions"], "ready": true}, {"id": "O-10", "phase": "O", "title": "Review design observations D1 to D6 and the key phone screens", "priority": "P1", "size": "S", "deps": [], "status": "done", "owner": "owner", "test": "manual", "ac": ["Each item in product-analysis.md section 6 is approved, changed or rejected", "No design file is edited without this approval"], "done_on": "2026-11-05", "ready": false}, {"id": "S0-01", "phase": "S0", "title": "Owner approves this plan and board", "priority": "P0", "size": "S", "deps": [], "status": "done", "owner": "owner", "test": "manual", "ac": ["Owner says the plan is approved, or lists changes", "Approved decisions saved to MEMORY.md", "Owner has read docs/architecture/ (product analysis, architecture, risks and gaps)"], "done_on": "2026-11-05", "ready": false}, {"id": "S0-02", "phase": "S0", "title": "Scaffold the monorepo: apps/web (Next.js, TypeScript strict), packages/core, packages/ui, packages/config, Turborepo", "priority": "P0", "size": "S", "deps": ["S0-01", "O-01", "O-03"], "status": "done", "owner": "claude", "test": "unit", "ac": ["npm workspaces and Turborepo; npm run verify runs typecheck, lint, unit tests and build across all workspaces and passes", "apps/web serves a page with npm run dev", "packages/core has a sample pure function with a Vitest test; apps/web imports it", "Lint rule blocks core from importing other workspaces", "No secrets in the repo; .env.example lists every variable"], "done_on": "2026-11-05", "commit": "c6cdf8f", "ready": false}, {"id": "S0-03", "phase": "S0", "title": "Fight Camp design tokens and base components", "priority": "P0", "size": "M", "deps": ["S0-02"], "status": "done", "owner": "claude", "test": "unit", "screens": ["All"], "ac": ["Tokens match the mockups: Anton + Inter, #111111 / #FFFFFF / #D4F000, pill buttons", "Button (ink, light, grey, volt, ghost, small), Tag, Input with label and inline error, Checkbox, Radio card, Tabs, Dialog", "Every control has a visible focus ring and a 44 px touch target", "Component tests cover each variant; axe finds no serious issue on a dev-only /styleguide page"], "done_on": "2026-11-09", "commit": "27f59bd", "ready": false}, {"id": "S0-04", "phase": "S0", "title": "Local Supabase, migrations folder and pgTAP test harness", "priority": "P0", "size": "S", "deps": ["S0-02"], "status": "done", "owner": "claude", "test": "db", "ac": ["supabase start runs locally", "npm run test:db runs a sample pgTAP test", "Migrations apply from scratch with no errors", "Typed database client generated into the app"], "done_on": "2026-11-09", "commit": "1942f05", "ready": false}, {"id": "S0-05", "phase": "S0", "title": "CI on GitHub Actions", "priority": "P0", "size": "S", "deps": ["S0-04"], "status": "done", "owner": "claude", "test": "ci", "ac": ["Every pull request runs typecheck, lint, unit, database tests and build", "A failing test blocks the merge", "Main branch is protected"], "done_on": "2026-11-12", "commit": "5eb789a", "note": "Branch protection needs GitHub Pro or a public repo (owner decision). Until then, merge only on a green CI run.", "ready": false}, {"id": "S0-06", "phase": "S0", "title": "Vercel preview deploys and environment variables", "priority": "P0", "size": "S", "deps": ["S0-05", "O-02"], "status": "todo", "owner": "claude", "test": "manual", "ac": ["Each pull request gets a preview URL", "Preview uses a separate Supabase project from production", "Production deploy needs the owner's approval"], "ready": false}, {"id": "S0-07", "phase": "S0", "title": "Playwright end-to-end harness with seeded test users", "priority": "P0", "size": "S", "deps": ["S0-04"], "status": "todo", "owner": "claude", "test": "e2e", "ac": ["Seed creates one athlete, two coaches, one reviewer, one admin", "A sample end-to-end test passes locally and in CI", "Tests run at 390 px (phone) an  "unit+e2e", "ac": ["Follows the approved design X-Book and X-Booked", "A slot can be booked once; a second booking of the same slot fails (database constraint test)", "Booking needs payment; cancel follows the refund terms"], "screens": ["X-Book", "X-Booked"], "ready": false}, {"id": "M4-18", "phase": "M4", "title": "Reports, suspension and admin report queue", "priority": "P1", "size": "M", "deps": ["M4-08", "M4-14", "O-09", "O-10"], "status": "todo", "owner": "claude", "test": "db+e2e", "ac": ["Follows the approved design X-Report, X-ReportSent and R-Reports", "Any user can report a review, message or coach", "Admin can read only reported messages, hide content and suspend a user; every action is logged"], "screens": ["X-Report", "X-ReportSent", "R-Reports"], "ready": false}, {"id": "M4-16", "phase": "M4", "title": "Payments go-live checklist and milestone check M4", "priority": "P0", "size": "M", "deps": ["M4-09", "M4-10", "M4-11", "M4-12", "M4-13", "M4-14"], "status": "todo", "owner": "claude", "test": "all", "ac": ["All 20 checklist items audited against the code: webhook signatures, failed payments, refunds, upgrades, idempotency, server-side gating, status sync, test clocks, billing page, receipts, event logging, expired cards, tax, trials, duplicate charges, currency, cancel flow, retries, failed-webhook alerts, full test as a customer", "The design doc's M4 Verify list passes", "Codex final-diff review; findings fixed or rejected with evidence", "Live mode only after the owner approves"], "ready": false}, {"id": "M5-01", "phase": "M5", "title": "Retrieval over published, non-sample content", "priority": "P0", "size": "M", "deps": ["M2-11"], "status": "todo", "owner": "claude", "test": "db", "ac": ["Ranked full-text search returns item ids for citation", "pgTAP: draft, in-review and sample items are never returned"], "ready": false}, {"id": "M5-02", "phase": "M5", "title": "Answer service: Claude call, citations, labels, safety", "priority": "P0", "size": "M", "deps": ["M5-01", "M1-08"], "status": "todo", "owner": "claude", "test": "unit", "ac": ["Every answer carries the 'AI explanation' label", "Unit: every cited id exists and is published", "No-match answers say 'no library source' and contain no sets, reps or loads", "Injury questions get a referral and no diagnosis; unsafe requests are refused", "Personal data sent: sport, level, goals; health fields only with consent; never name or contact details"], "ready": false}, {"id": "M5-03", "phase": "M5", "title": "Daily question limit and usage log", "priority": "P0", "size": "S", "deps": ["M5-02"], "status": "todo", "owner": "claude", "test": "unit", "ac": ["Unit: the 11th question of the day is blocked with a clear message", "Each question logs user, tokens and cost"], "ready": false}, {"id": "M5-04", "phase": "M5", "title": "Ask AI screen with history and actions", "priority": "P0", "size": "M", "deps": ["M5-03"], "status": "todo", "owner": "claude", "test": "e2e", "screens": ["C-AI"], "ac": ["Citations link to lessons; 'Add to Today' works", "A pain report creates a flag on the coach dashboard", "End-to-end: ask, get a cited answer, open the cited lesson", "Phone layout matches the reviewed phone board at 390 px (decision D2)"], "ready": false}, {"id": "M5-05", "phase": "M5", "title": "AI eval set and milestone check M5", "priority": "P0", "size": "M", "deps": ["M5-04"], "status": "todo", "owner": "claude", "test": "eval", "ac": ["npm run eval:ai runs at least 30 questions (boxing, S&C, gym, beginner, injury, unsafe, off-topic, no-match) 3 times", "100% on code-checked rules in all 3 runs", "Judge average at least 90%"], "ready": false}, {"id": "M6-01", "phase": "M6", "title": "Public pages: landing, programs, about, help, for coaches", "priority": "P0", "size": "M", "deps": ["M4-16"], "status": "todo", "owner": "claude", "test": "e2e", "screens": ["C-Landing", "P-Programs", "P-Program", "G-Program", "P-About", "P-Help"], "ac": ["Match the canvas at 390 and 1440 px", "No invented numbers; every count comes from the database", "Re-enable the claude-seo plugin (claude plugin enable claude-seo@agricidaniel-claude-seo) and fix every critical finding from /seo audit on public pages"], "ready": false}, {"id": "M6-02", "phase": "M6", "title": "Privacy policy and terms", "priority": "P0", "size": "S", "deps": ["O-07"], "status": "todo", "owner": "claude", "test": "manual", "screens": ["P-Legal"], "ac": ["Uses the owner's signed-off text", "Names Anthropic and the payment provider as processors"], "ready": false}, {"id": "M6-03", "phase": "M6", "title": "Empty, loading and error states on every route; 404", "priority": "P0", "size": "M", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "e2e", "screens": ["P-NotFound"], "ac": ["A route audit script lists every route and finds no dead button or placeholder", "Each data screen has a designed empty state", "Coach empty states follow the approved design K-CoachEmpty"], "ready": false}, {"id": "M6-04", "phase": "M6", "title": "Installable PWA", "priority": "P1", "size": "S", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "manual", "ac": ["Manifest, icons and an offline fallback page", "Installs on Android Chrome and iOS Safari"], "ready": false}, {"id": "M6-05", "phase": "M6", "title": "Speed on low-end Android", "priority": "P0", "size": "M", "deps": ["M6-01"], "status": "todo", "owner": "claude", "test": "manual", "ac": ["Lighthouse mobile performance at least 80 on landing, library and Today", "Images served in modern formats at the right size"], "ready": false}, {"id": "M6-06", "phase": "M6", "title": "Accessibility audit", "priority": "P0", "size": "S", "deps": ["M6-03"], "status": "todo", "owner": "claude", "test": "e2e", "ac": ["axe finds no serious or critical issue on any route", "Keyboard-only path through sign-up, a session and checkout"], "ready": false}, {"id": "M6-07", "phase": "M6", "title": "Security review and rate limits", "priority": "P0", "size": "M", "deps": ["M6-03"], "status": "todo", "owner": "claude", "test": "all", "ac": ["Rate limits on sign-in, AI and payment routes", "/security-review and a Codex review of the full app; findings resolved", "No secrets in the repo or client bundle"], "ready": false}, {"id": "M6-08", "phase": "M6", "title": "Final QA and production launch", "priority": "P0", "size": "M", "deps": ["M6-02", "M6-04", "M6-05", "M6-06", "M6-07", "M5-05"], "status": "todo", "owner": "claude", "test": "all", "ac": ["/qa on the production candidate finds no high-severity bugs", "Design doc M6 Verify list passes", "Owner approves the production deploy"], "ready": false}], "memory": [{"id": "ai-assistant", "type": "area", "description": "The grounded AI instructional assistant (milestone M5)", "updated": "2026-11-12", "body": "- Answers cite published, non-sample content: [[decision-ai-grounding]].\n- Health limitations need separate consent: [[decision-health-consent]].\n- Claude via the Anthropic API, server-side. Retrieval: Postgres full-text search in the plan.\n- Labelled apart from coach-verified content.", "links": ["decision-ai-grounding", "decision-health-consent"]}, {"id": "architecture-docs", "type": "area", "description": "Pre-build analysis, risks, open questions and missing screens", "updated": "2026-11-12", "body": "Written in [[session-3e]] in `docs/architecture/`:\n- `product-analysis.md`: roles, 12 feature areas, journeys J1–J15, assets, design observations D1–D6.\n- `architecture.md`: route map, components, backend modules, endpoints, ERD, conventions.\n- `risks-and-gaps.md`: risks R1–R16, questions Q-01–Q-15, missing screens G1–G8.\n- Rendered page: https://claude.ai/artifact/NuWTJNJ1GZsYCznVN8CDWk (rebuild with `python docs/architecture/build_page.py`).\n- D1–D6 approved in [[session-3f]]. Q-01–Q-15 wait on the owner ([[O-09]]).\n- Still open: G5 invoices, G7 email templates, G8 offline page.", "links": ["O-09", "session-3e", "session-3f"]}, {"id": "build-board", "type": "area", "description": "board.json, the renderer, the artifact, and the working loop", "updated": "2026-11-12", "body": "- `docs/plans/board.json` is the source of truth for tasks. `python docs/plans/build_board.py` validates it, checks the memory graph, and renders `board.html`.\n- Published at https://claude.ai/artifact/BPCG8ghatzZkV7v1haJ1z1. Republish after every task.\n- The board has two tabs: Tasks, and Memory, which draws [[memory-system]].\n- Working loop: one task in progress at a time. Tests first. `npm run verify` plus the task's end-to-end test. Mark done with date and commit. Re-render and republish.\n- Codex review at the end of each milestone for auth, RLS, payments and migrations.\n- Engineering plan: `docs/plans/engineering-plan.md`. Created in [[session-3d]].\n- Build inside the repo, not a temp folder ([[decision-build-in-repo]]).", "links": ["decision-build-in-repo", "memory-system", "session-3d"]}, {"id": "categories", "type": "area", "description": "The three sport categories and their libraries", "updated": "2026-11-12", "body": "Decided in [[decision-three-categories]] and [[decision-launch-sports]].\n\n- Boxing: primary.\n- Strength & Conditioning: S&C for boxers. It must not become a generic gym app.\n- Gym & Fitness: build muscle, lose fat, get stronger, get fitter. Library by goal and muscle group, workout player with overload targets, gym progress. Added in [[session-3c]].\n- Categories are data, so more can be added later ([[stack]]).\n- No meal plans or calorie targets: [[decision-no-nutrition]].", "links": ["decision-launch-sports", "decision-no-nutrition", "decision-three-categories", "session-3c", "stack"]}, {"id": "ci", "type": "area", "description": "GitHub Actions workflow, its jobs, and the merge rule", "updated": "2026-11-12", "body": "Built in [[S0-05]] ([[session-6]]), PR #1.\n\n- `.github/workflows/ci.yml` runs on every pull request and every push to `main`.\n- Job `verify`: `npm ci`, then `npm run verify`.\n- Job `db`: `npm run db:start`, `npm run test:db`, then regenerates types and fails if `database.types.ts` changed.\n- The web build needs no secrets in CI.\n- Branch protection is not possible on GitHub Free for a private repo (API 403). Until the owner decides ([[owner-decisions]]), merge only on a green run.\n- Pushing workflow files: [[lesson-gh-workflow-scope]]. Merging: [[lesson-auto-mode-merge]].", "links": ["S0-05", "lesson-auto-mode-merge", "lesson-gh-workflow-scope", "owner-decisions", "session-6"]}, {"id": "constraints", "type": "constraint", "description": "Project-wide rules that always hold", "updated": "2026-11-12", "body": "- No placeholder pages, dead buttons or fake data. Sample content carries a \"Sample\" label.\n- Do not deploy, delete data, or force-push without the owner's approval.\n- No secrets in the repo. Use `.env` files, which git ignores.\n- Demand evidence is zero. Pricing and usage assumptions are hypotheses.\n- Adults only in v1: [[decision-adults-only]]. Out of scope: [[decision-out-of-v1]].\n- Hub: [[project-overview]].", "links": ["decision-adults-only", "decision-out-of-v1", "project-overview"]}, {"id": "db", "type": "area", "description": "packages/db, local Supabase commands, keys and settings", "updated": "2026-11-12", "body": "Built in [[S0-04]] ([[session-5]]). Local Supabase needs Docker, not a cloud account ([[decision-local-supabase]]).\n\n- `packages/db` holds the Supabase project, migrations, pgTAP tests, generated types and `createDbClient`.\n- Root commands: `db:start`, `db:stop`, `db:reset`, `test:db`, `db:types`.\n- Studio: http://127.0.0.1:54323.\n- `apps/web/.env.local` holds the local keys and is git-ignored. Recreate it from `npx supabase status` in `packages/db`.\n- Analytics is off in `supabase/config.toml`. Nothing uses it, it took 559 MB, and its log shipper restart-looped.\n- Docker exists only on [[env-welcome-pc]]. [[ci]] runs the DB tests on every PR.", "links": ["S0-04", "ci", "decision-local-supabase", "env-welcome-pc", "session-5"]}, {"id": "decision-adults-only", "type": "decision", "description": "2026-11-04: adults only (18+) in v1", "updated": "2026-11-04", "body": "Why: India's DPDP Act needs verifiable parental consent for minors. Deferred to the academy phase. See [[constraints]].", "links": ["constraints"]}, {"id": "decision-ai-grounding", "type": "decision", "description": "2026-11-04: AI answers cite published, non-sample content; with no match it explains concepts only", "updated": "2026-11-04", "body": "The brief requires AI grounded in approved content and kept apart from coach-verified content. The AI never prescribes without a match. See [[ai-assistant]].", "links": ["ai-assistant"]}, {"id": "decision-build-in-repo", "type": "decision", "description": "2026-11-05: build inside the repo, never in a temp or scratch folder", "updated": "2026-11-05", "body": "The owner rejected a scaffold made in a scratchpad. See [[decision-project-folder]] and [[build-board]].", "links": ["build-board", "decision-project-folder"]}, {"id": "decision-coach-review-flow", "type": "decision", "description": "2026-11-04: coaches author, a reviewer publishes, nobody approves their own item", "updated": "2026-11-04", "body": "Why: content quality and cold start are the main risks. Coaches bring content and athletes. See [[project-overview]].", "links": ["project-overview"]}, {"id": "decision-fight-camp", "type": "decision", "description": "2026-11-04: visual direction Fight Camp (Anton + Inter, black/white, volt #D4F000, pill buttons)", "updated": "2026-11-05", "body": "The owner picked Fight Camp (Nike-grade) over Studio (Apple) and Coach (Airbnb) in [[session-2]].\n\n2026-11-05: keep the Fight Camp look when using Hallmark or ui-ux-pro-max. Use those tools for quality checks, not a new theme. The owner said the screens look good. See [[lesson-hallmark-floor]], [[design-system]], [[mockups]].", "links": ["design-system", "lesson-hallmark-floor", "mockups", "session-2"]}, {"id": "decision-git-author", "type": "decision", "description": "2026-11-04: git author is Kritagya Suryavanshi <kritagya.suryarock@gmail.com>", "updated": "2026-11-04", "body": "The owner's real name and email. See [[owner-profile]].", "links": ["owner-profile"]}, {"id": "decision-health-consent", "type": "decision", "description": "2026-11-04: separate consent before health limitations go to the AI; send minimum fields", "updated": "2026-11-04", "body": "Why: health data is sensitive and the AI provider sits outside India. See [[ai-assistant]].", "links": ["ai-assistant"]}, {"id": "decision-launch-sports", "type": "decision", "description": "2026-11-04: Boxing primary, S&C integrated support, multi-sport data model", "updated": "2026-11-04", "body": "Both suit adults. S&C must not become a generic gym app. Later extended by [[decision-three-categories]]. See [[categories]].", "links": ["categories", "decision-three-categories"]}, {"id": "decision-local-supabase", "type": "decision", "description": "2026-11-09: local Supabase on Docker, no cloud account needed for S0-04", "updated": "2026-11-09", "body": "Owner approved. [[O-02]] no longer blocks [[S0-04]]. See [[db]].", "links": ["O-02", "S0-04", "db"]}, {"id": "decision-marketplace-in-v1", "type": "decision", "description": "2026-11-05: coach marketplace is in v1 as milestone M4; AI moves to M5, launch to M6", "updated": "2026-11-05", "body": "Owner: \"add marketplace in v1\". Reverses part of [[decision-out-of-v1]]. Details and risks in [[marketplace]].", "links": ["decision-out-of-v1", "marketplace"]}, {"id": "decision-no-design-edits", "type": "decision", "description": "2026-11-05: no design edits without owner approval", "updated": "2026-11-05", "body": "Set in [[session-3e]] with board task O-10. See [[mockups]].", "links": ["mockups", "session-3e"]}, {"id": "decision-no-nutrition", "type": "decision", "description": "2026-11-05: no meal plans or calorie targets in v1; body weight optional and consent-gated", "updated": "2026-11-05", "body": "Why: nutrition advice is out of v1 scope and is health data. Still an open question for the owner ([[owner-decisions]]). See [[categories]], [[decision-health-consent]].", "links": ["categories", "decision-health-consent", "owner-decisions"]}, {"id": "decision-out-of-v1", "type": "decision", "description": "2026-11-04: out of v1, payments, academies, minors, phone OTP, Hindi, native apps, 3D, live, community", "updated": "2026-11-05", "body": "Why: keep v1 focused and get real-user evidence first. The marketplace and its payments came back in: [[decision-marketplace-in-v1]]. See [[constraints]].", "links": ["constraints", "decision-marketplace-in-v1"]}, {"id": "decision-project-folder", "type": "decision", "description": "2026-11-04: all project files, memory included, live in the fitSphere repo", "updated": "2026-11-12", "body": "Paths: `C:\\Users\\LENOVO\\Desktop\\Projects\\fitSphere` ([[env-lenovo-pc]]) and `C:\\Users\\WELCOME\\fitSphere` ([[env-welcome-pc]]). The repo is private: `kritagyasuryavanshi/fitSphere`. See [[owner-profile]].", "links": ["env-lenovo-pc", "env-welcome-pc", "owner-profile"]}, {"id": "decision-pwa-stack", "type": "decision", "description": "2026-11-04: mobile-first PWA on Next.js, Vercel, Supabase, YouTube embeds", "updated": "2026-11-04", "body": "Why: the house default stack, India-first, low cost, and no video hosting bill before revenue. Refined into [[decision-stack-locked]].", "links": ["decision-stack-locked"]}, {"id": "decision-stack-locked", "type": "decision", "description": "2026-11-05: monorepo stack locked (Next.js, Supabase, Razorpay, Claude)", "updated": "2026-11-05", "body": "Owner: \"start building with the build board; use the best stack you recommend; keep it scalable, I will add more categories and features later.\" This approved the plan ([[S0-01]]).\n\nWhy: one TypeScript monorepo keeps rules, UI and DB types shared. Categories as data and a metric registry let new sports arrive without code forks. Details in [[stack]].", "links": ["S0-01", "stack"]}, {"id": "decision-three-categories", "type": "decision", "description": "2026-11-05: three categories, Boxing, S&C and Gym & Fitness, each with its own library", "updated": "2026-11-05", "body": "The owner asked for gym training (weight loss, muscle building, hypertrophy), then asked to keep S&C as its own category. Gym is a full category, not boxing support. See [[categories]].", "links": ["categories"]}, {"id": "decision-three-pillars", "type": "decision", "description": "2026-11-04: v1 has three pillars, video library, AI assistant, coach-led training", "updated": "2026-11-04", "body": "The owner wants all three complete from day one and accepts a longer timeline. See [[project-overview]].", "links": ["project-overview"]}, {"id": "design-system", "type": "area", "description": "packages/ui components, tokens, and what is deferred", "updated": "2026-11-12", "body": "Built in [[S0-03]] ([[session-5]]). The look is Fight Camp: [[decision-fight-camp]].\n\n- Components: tokens, Button, Tag, Input, Checkbox, RadioCard, Tabs, Dialog.\n- Link buttons use `buttonClass()` with `next/link`.\n- Tailwind reads the package through `@source` in `apps/web/src/app/globals.css`.\n- Added beyond the board's list: a `danger` Button for the confirm screens, and a Dialog `alert` mode that keeps focus off the destructive button.\n- Deferred: checkbox cards from A-Onboard1 go in [[M1-03]]. Pill-style category links (C-Library) are links, not tabs, and go in [[M2-03]].\n- The real-browser check (axe with contrast, sizes, focus rings, dialog keyboard at 390 and 1440 px) ran as a one-off script. Move it into Playwright at [[S0-07]]. It found a bug jsdom missed: default buttons were 52 px, not 48 px.\n- Quality floor: [[lesson-hallmark-floor]].", "links": ["M1-03", "M2-03", "S0-03", "S0-07", "decision-fight-camp", "lesson-hallmark-floor", "session-5"]}, {"id": "env-lenovo-pc", "type": "environment", "description": "LENOVO PC, the Desktop path, Node 26, no Docker", "updated": "2026-11-12", "body": "- Repo: `C:\\Users\\LENOVO\\Desktop\\Projects\\fitSphere`.\n- Node 26.13, npm 11.20, git, WSL, `gh` logged in as `kritagyasuryavanshi` with the `workflow` scope.\n- No Docker and no WSL, so `db:start` and `test:db` do not run here. [[ci]] covers them. Docker is possible: 45 GB free on C:, 7.8 GB RAM, virtualization on. Install needs admin and a restart.\n- Bun 1.4.4 and Codex CLI 0.167.2 installed in [[session-6]] ([[tooling]]).\n- Python available (board and mockup scripts).\n- Checked in [[session-6]]. See [[lesson-stale-node-modules]], [[project-overview]].", "links": ["ci", "lesson-stale-node-modules", "project-overview", "session-6", "tooling"]}, {"id": "env-welcome-pc", "type": "environment", "description": "WELCOME PC, Node 22, Docker 29 on D:, local Supabase works", "updated": "2026-11-09", "body": "- Repo: `C:\\Users\\WELCOME\\fitSphere`.\n- Node 22.19, npm 11.6, Docker 29, `gh` at `C:\\Program Files\\GitHub CLI\\gh.exe`, logged in as `kritagyasuryavanshi`. Bun and Codex CLI not checked.\n- 8 GB RAM and little space on C:. See [[lesson-docker-welcome]].\n- Session transcripts stay on each PC; the repo carries the context.\n- Set up in [[session-5]]. See [[db]], [[project-overview]].", "links": ["db", "lesson-docker-welcome", "project-overview", "session-5"]}, {"id": "lesson-auto-mode-merge", "type": "lesson", "description": "Claude Code auto mode blocks Claude from merging its own PRs", "updated": "2026-11-12", "body": "`gh pr merge` was denied as \"merge without review\" in [[session-6]], even though CLAUDE.md allows pushes to main. The owner merges PRs, or adds a permission rule. See [[ci]], [[tooling]].", "links": ["ci", "session-6", "tooling"]}, {"id": "lesson-bun-gstack", "type": "lesson", "description": "gstack tools that need Bun fail until Bun is installed; use npm run verify", "updated": "2026-11-12", "body": "gstack setup failed for lack of Bun in [[session-1]]. Use `npm run verify` instead of gstack `/verify`. See [[tooling]], [[owner-decisions]].", "links": ["owner-decisions", "session-1", "tooling"]}, {"id": "lesson-docker-welcome", "type": "lesson", "description": "Docker on the WELCOME PC, low disk space, exec format errors, WSL 1603", "updated": "2026-11-12", "body": "- C: has little space, so Docker storage lives on `D:\\Docker`. npm's cache was cleared to fit WSL.\n- WSL install error 1603: check disk space in the installer log.\n- \"exec format error\" after the first `supabase start`: images unpacked with empty programs during the parallel pull. Remove the Supabase images and `docker pull` them one at a time.\n- Docker Desktop does not always start on its own after a restart.\n\nFrom [[session-5]]. See [[env-welcome-pc]], [[db]].", "links": ["db", "env-welcome-pc", "session-5"]}, {"id": "lesson-gh-workflow-scope", "type": "lesson", "description": "Pushing .github/workflows needs the gh workflow scope and gh as the git credential helper", "updated": "2026-11-12", "body": "GitHub rejects the push with \"refusing to allow an OAuth App to create or update workflow without workflow scope\". Fix: `gh auth refresh -h github.com -s workflow`, then `gh auth setup-git`. Done on [[env-lenovo-pc]] in [[session-6]]. See [[ci]].", "links": ["ci", "env-lenovo-pc", "session-6"]}, {"id": "lesson-github-push-500", "type": "lesson", "description": "GitHub pushes sometimes fail with Internal Server Error; retry after a few seconds", "updated": "2026-11-12", "body": "Seen in [[session-2]]. A retry works. See [[tooling]].", "links": ["session-2", "tooling"]}, {"id": "lesson-hallmark-floor", "type": "lesson", "description": "Hallmark is a quality floor only; three of its Floor rules stay unmet by choice", "updated": "2026-11-12", "body": "Used for focus rings, 44 px targets, active and disabled states, no invented metrics, no em-dashes in copy. Its Floor rules 48, 54 and 63 conflict with the canvas format and the Fight Camp voice, so they stay unmet. ui-ux-pro-max style picks were rejected; its UX rules were used (empty states, inline errors, destructive confirms). From [[session-3]]. See [[decision-fight-camp]], [[design-system]].", "links": ["decision-fight-camp", "design-system", "session-3"]}, {"id": "lesson-headless-chrome-500px", "type": "lesson", "description": "Headless Chrome cannot go below 500 px wide; phone checks need a fixed 390 px root", "updated": "2026-11-12", "body": "Found in [[session-3b]]. See [[mockups]].", "links": ["mockups", "session-3b"]}, {"id": "lesson-seo-plugins", "type": "lesson", "description": "claude-seo is disabled until launch; OpenSEO is enabled and paid", "updated": "2026-11-12", "body": "claude-seo comes back at board task M6-01. OpenSEO uses a paid hosted service (app.openseo.so) and needs sign-in on first use. See [[tooling]].", "links": ["tooling"]}, {"id": "lesson-skills-cli-node", "type": "lesson", "description": "The skills CLI needs Node 22.20 or later", "updated": "2026-11-12", "body": "Run it with `npx -y -p node@22 -p skills skills ...` when Node is older. Found in [[session-3]]. See [[tooling]].", "links": ["session-3", "tooling"]}, {"id": "lesson-stale-node-modules", "type": "lesson", "description": "Run npm ci after pulling on a PC that has been idle", "updated": "2026-11-12", "body": "In [[session-6]], `verify` failed on [[env-lenovo-pc]]: `@supabase/supabase-js` was missing because `node_modules` predated [[S0-04]]. `npm ci` fixed it.", "links": ["S0-04", "env-lenovo-pc", "session-6"]}, {"id": "lesson-unsplash", "type": "lesson", "description": "The Unsplash search API refuses scripts; download by known photo ID instead", "updated": "2026-11-12", "body": "Download from images.unsplash.com by photo ID. Found in [[session-3c]]. See [[mockups]].", "links": ["mockups", "session-3c"]}, {"id": "marketplace", "type": "area", "description": "Coach marketplace in v1 (milestone M4)", "updated": "2026-11-12", "body": "Decided in [[decision-marketplace-in-v1]].\n\n- Scope: discover, compare, shortlist, hire, chat, pay, payouts, verified reviews, coach clients and earnings, admin credential checks.\n- Payment provider recommended: Razorpay with Route. The owner confirms before M4 ([[owner-decisions]]).\n- Risks: empty marketplace before about 20 coaches, payment milestone size, credential checks, client-story consent.\n- Unblocked design tasks: [[M4-17]] (1:1 booking), [[M4-18]] (reports and moderation).", "links": ["M4-17", "M4-18", "decision-marketplace-in-v1", "owner-decisions"]}, {"id": "memory-system", "type": "area", "description": "How the project memory graph works and the end-of-session routine", "updated": "2026-11-12", "body": "Project memory is a graph of small notes in `docs/memory/`. Each note holds one topic. Notes link with `[[slug]]`. A link can also name a board task, such as `[[S0-05]]`.\n\nNote types:\n- **area:** a hub for one part of the project. Every other note links to at least one area.\n- **decision:** a choice with its date and reason.\n- **constraint:** a rule that holds for the whole project.\n- **lesson:** something learned the hard way.\n- **environment:** facts about one PC.\n- **session:** what one session did, with links to the notes it changed.\n\nFrontmatter fields: `name` (same as the file name), `type`, `description` (one line), `updated` (date).\n\n`MEMORY.md` holds only the current state and points here. `INDEX.md` lists every note and is generated.\n\nThe board's Memory tab draws this graph: https://claude.ai/artifact/BPCG8ghatzZkV7v1haJ1z1. See [[build-board]].\n\nEnd of every session:\n1. Add a `session-N` note that links to every note the session touched.\n2. Update or add notes for new decisions, lessons and facts. Update `updated` on each.\n3. Update the current state in `MEMORY.md`.\n4. Run `python docs/plans/build_board.py`. It fails on a broken link or an orphan note.\n5. Commit, push and republish the board.\n\nStart of a session: read `MEMORY.md`, then `INDEX.md`, then open only the notes the task needs. Search with `grep -rl <word> docs/memory`.\n\nStarted in [[session-6]]. Hub: [[project-overview]].", "links": ["build-board", "project-overview", "session-6"]}, {"id": "mockups", "type": "area", "description": "Design canvas, mockup sources, build scripts and screenshot tooling", "updated": "2026-11-12", "body": "- Canvas: https://claude.ai/artifact/YVnwgT8qzwA2SerCSPasBe. Look: [[decision-fight-camp]].\n- Sources in `docs/mockups/`. Generators in `docs/mockups/build/`: `build.py` writes `.dc.html` from shared fragments. `phone.py` makes 390 px phone versions (`M-*.dc.html`). `pages_gaps.py` holds the gap screens.\n- Photos: Unsplash, credits in `docs/mockups/images/CREDITS.md`. [[lesson-unsplash]].\n- Demo people (fictional): coaches Vikram Rathore (boxing), Ananya Iyer (S&C), Rohan Desai (reviewer); athletes Kabir Malhotra and Neha (gym). Real coach photos replace the models before launch.\n- Rule: canvas edits win. Before a rebuild, port hand edits into the sources.\n- Rule: [[decision-no-design-edits]].\n- Screenshots: playwright-core with installed Chrome; it sizes the window to the full page. [[lesson-headless-chrome-500px]].\n- Design review record: `docs/designs/design-review-2026-11-05.md`, page https://claude.ai/artifact/DnbZRbQHPG74SwxnUg5Mft.\n- Known typo, left alone: the confirm screens' warning icon path reads `M12 3l10 28H2z`; the correct one, used in [[design-system]], is `M12 3l10 18H2z`.\n- History: [[session-2]], [[session-3]], [[session-3b]], [[session-3c]], [[session-3f]].", "links": ["decision-fight-camp", "decision-no-design-edits", "design-system", "lesson-headless-chrome-500px", "lesson-unsplash", "session-2", "session-3", "session-3b", "session-3c", "session-3f"]}, {"id": "owner-decisions", "type": "area", "description": "Open items that wait on the owner", "updated": "2026-11-12", "body": "- Branch protection for `main`: needs GitHub Pro (paid) or a public repo. See [[ci]].\n- [[O-02]]: Supabase, Vercel, Anthropic and Google OAuth accounts. Blocks [[S0-06]] and Google sign-in.\n- [[O-09]]: answer Q-01–Q-15 or accept the defaults ([[architecture-docs]]).\n- O-04 to O-08 on the board.\n- Before M4: payment provider, fee %, refund and cancel terms, business and GST registration, coach agreement ([[marketplace]]).\n- Nutrition for fat-loss users ([[decision-no-nutrition]]).\n- Mobbin: only unofficial MCPs exist; needs a paid account. The owner must say \"install mobbin-mcp\".\n- Setup on [[env-lenovo-pc]] ([[tooling]]): apply the project permission allow list, run `codex login`, install the Codex Claude plugin, install WSL and Docker Desktop (admin and a restart).", "links": ["O-02", "O-09", "S0-06", "architecture-docs", "ci", "decision-no-nutrition", "env-lenovo-pc", "marketplace", "tooling"]}, {"id": "owner-profile", "type": "area", "description": "Who the owner is and how they like to work", "updated": "2026-11-12", "body": "The owner is Kritagya Suryavanshi. Git author: `Kritagya Suryavanshi <kritagya.suryarock@gmail.com>` ([[decision-git-author]]).\n\n- Answer with a decision and move on. Avoid long question chains. The owner skipped several multi-question prompts.\n- Ask only when confused or when the direction is unclear. Otherwise act ([[session-6]]).\n- Works from two PCs: [[env-lenovo-pc]] and [[env-welcome-pc]].\n- Parallel task: meet one boxing coach and one S&C coach (the assignment in the design doc).\n- Wants all project files, memory included, in the repo ([[decision-project-folder]]).", "links": ["decision-git-author", "decision-project-folder", "env-lenovo-pc", "env-welcome-pc", "session-6"]}, {"id": "project-overview", "type": "area", "description": "Root hub. What fitSphere is, v1 scope, and links to every area", "updated": "2026-11-12", "body": "fitSphere is a sports learning, training and coaching platform for adult boxing beginners and independent coaches in Indian cities.\n\nv1 has three pillars ([[decision-three-pillars]]): a video learning library, a grounded AI assistant ([[ai-assistant]]), and coach-led training. The coach marketplace is in v1 too ([[marketplace]]).\n\nSources of truth: `PROJECT.md`, `docs/designs/fitsphere-v1.md`, `docs/PRODUCT_BRIEF.md`.\n\nAreas:\n- [[stack]]: the code structure and tools.\n- [[categories]]: Boxing, S&C, Gym & Fitness.\n- [[design-system]] and [[mockups]]: the Fight Camp look.\n- [[db]]: Supabase, migrations and tests.\n- [[ci]]: GitHub Actions.\n- [[build-board]]: tasks and the working loop.\n- [[architecture-docs]]: analysis, risks and open questions.\n- [[owner-decisions]]: what waits on the owner.\n- [[constraints]]: project-wide rules.\n- [[memory-system]]: how this memory works.\n- [[tooling]]: Claude tools, plugins and permissions.\n- Environments: [[env-lenovo-pc]], [[env-welcome-pc]].\n- Owner: [[owner-profile]].", "links": ["ai-assistant", "architecture-docs", "build-board", "categories", "ci", "constraints", "db", "decision-three-pillars", "design-system", "env-lenovo-pc", "env-welcome-pc", "marketplace", "memory-system", "mockups", "owner-decisions", "owner-profile", "stack", "tooling"]}, {"id": "session-1", "type": "session", "description": "2026-11-04: repo, brief, office hours, approved v1 design", "updated": "2026-11-04", "body": "- Created the repo, the docs scaffold and the private GitHub remote ([[decision-project-folder]], [[decision-git-author]]).\n- Saved the brief to `docs/PRODUCT_BRIEF.md`. Ran /office-hours. Approved design: `docs/designs/fitsphere-v1.md`.\n- Decisions: [[decision-three-pillars]], [[decision-launch-sports]], [[decision-coach-review-flow]], [[decision-ai-grounding]], [[decision-adults-only]], [[decision-pwa-stack]], [[decision-health-consent]], [[decision-out-of-v1]].\n- One review round found 6 blocking issues, all fixed.\n- Lesson: [[lesson-bun-gstack]]. Owner style: [[owner-profile]].", "links": ["decision-adults-only", "decision-ai-grounding", "decision-coach-review-flow", "decision-git-author", "decision-health-consent", "decision-launch-sports", "decision-out-of-v1", "decision-project-folder", "decision-pwa-stack", "decision-three-pillars", "lesson-bun-gstack", "owner-profile"]}, {"id": "session-2", "type": "session", "description": "2026-11-04: moved to Desktop, three visual directions, Fight Camp chosen", "updated": "2026-11-04", "body": "- Moved the project to the Desktop folder ([[decision-project-folder]]).\n- Built Studio, Coach and Fight Camp directions. Owner chose [[decision-fight-camp]].\n- Built 10 Fight Camp screens with demo data and 20 Unsplash photos ([[mockups]]).\n- Lesson: [[lesson-github-push-500]].", "links": ["decision-fight-camp", "decision-project-folder", "lesson-github-push-500", "mockups"]}, {"id": "session-3", "type": "session", "description": "2026-11-05: every site screen as a linked design", "updated": "2026-11-05", "body": "- Added 37 screens and rewired the first 10 so Play from Landing clicks through every flow ([[mockups]]).\n- A half-written prototype app in `docs/prototype/` was deleted unused.\n- Installed ponytail, ui-ux-pro-max and hallmark ([[tooling]], [[lesson-hallmark-floor]], [[lesson-skills-cli-node]]).", "links": ["lesson-hallmark-floor", "lesson-skills-cli-node", "mockups", "tooling"]}, {"id": "session-3b", "type": "session", "description": "2026-11-05: review fixes and phone versions of every screen", "updated": "2026-11-05", "body": "- Build runs from the repo; real disabled buttons; confirm screens for destructive actions; proper list markup.\n- Phone versions of every screen on the canvas page \"Phone · full site\" ([[mockups]]).\n- Lesson: [[lesson-headless-chrome-500px]].", "links": ["lesson-headless-chrome-500px", "mockups"]}, {"id": "session-3c", "type": "session", "description": "2026-11-05: Gym & Fitness category added", "updated": "2026-11-05", "body": "- Gym library, bench press page, Muscle Builder program, gym Today, workout player, workout done, gym progress, 4-step sign-up ([[categories]], [[decision-three-categories]]).\n- 10 gym photos ([[lesson-unsplash]]).", "links": ["categories", "decision-three-categories", "lesson-unsplash"]}, {"id": "session-3d", "type": "session", "description": "2026-11-05: engineering plan and build board; marketplace moves into v1", "updated": "2026-11-05", "body": "- [[decision-marketplace-in-v1]].\n- Engineering plan and board created ([[build-board]]). Walkthrough: https://claude.ai/artifact/217yXiVPoycExyuUg6haex.", "links": ["build-board", "decision-marketplace-in-v1"]}, {"id": "session-3e", "type": "session", "description": "2026-11-05: pre-implementation analysis", "updated": "2026-11-05", "body": "- Wrote [[architecture-docs]]. Board grew to 84 tasks.\n- [[decision-no-design-edits]].", "links": ["architecture-docs", "decision-no-design-edits"]}, {"id": "session-3f", "type": "session", "description": "2026-11-05: design changes D1–D6 applied, gap screens", "updated": "2026-11-05", "body": "- Owner approved D1–D6. Five phone screens fixed from real screenshots. 9 new screens for G1–G4, G6 and notifications ([[mockups]], [[architecture-docs]]).\n- Board at 85 tasks. [[M4-17]] and [[M4-18]] unblocked ([[marketplace]]).", "links": ["M4-17", "M4-18", "architecture-docs", "marketplace", "mockups"]}, {"id": "session-4", "type": "session", "description": "2026-11-05: build starts, stack locked, monorepo scaffold", "updated": "2026-11-05", "body": "- [[decision-stack-locked]], [[decision-build-in-repo]].\n- Node 26 installed on [[env-lenovo-pc]]. [[S0-02]] done ([[stack]]).", "links": ["S0-02", "decision-build-in-repo", "decision-stack-locked", "env-lenovo-pc", "stack"]}, {"id": "session-5", "type": "session", "description": "2026-11-09: WELCOME PC, design system and local Supabase", "updated": "2026-11-09", "body": "- Set up [[env-welcome-pc]] ([[lesson-docker-welcome]]).\n- [[S0-03]] done ([[design-system]]). [[S0-04]] done ([[db]], [[decision-local-supabase]]).\n- Vitest upgraded to 5, which cleared two critical audit advisories. Moderate dev-only advisories remain through typescript-eslint and eslint-config-next; the suggested fix is breaking.", "links": ["S0-03", "S0-04", "db", "decision-local-supabase", "design-system", "env-welcome-pc", "lesson-docker-welcome"]}, {"id": "session-6", "type": "session", "description": "2026-11-12: back on LENOVO, CI, memory graph, permissions audit", "updated": "2026-11-12", "body": "- [[S0-05]] done ([[ci]]), PR #1, first run green.\n- Lessons: [[lesson-gh-workflow-scope]], [[lesson-auto-mode-merge]], [[lesson-stale-node-modules]].\n- Moved memory from `MEMORY.md` into this graph ([[memory-system]]). The board got a Memory tab ([[build-board]]).\n- Checked [[env-lenovo-pc]]. Audited permissions and the folder ([[tooling]]). Installed Bun and the Codex CLI.\n- Folder audit: no secrets tracked, `.env` files ignored, no production advisories, 7 moderate dev-only advisories (known). `README.md` and `PROJECT.md` were stale (no Gym, marketplace listed as out of v1, old milestones) and were rewritten. `docs/mockups` is 21 MB, 6.6 MB of it before/after screenshots; left as is.\n- Owner direction: act without asking on small tasks; ask only when confused or the direction is unclear ([[owner-profile]]).", "links": ["S0-05", "build-board", "ci", "env-lenovo-pc", "lesson-auto-mode-merge", "lesson-gh-workflow-scope", "lesson-stale-node-modules", "memory-system", "owner-profile", "tooling"]}, {"id": "stack", "type": "area", "description": "Monorepo layout, frameworks and services", "updated": "2026-11-12", "body": "Locked in [[decision-stack-locked]].\n\n- npm workspaces + Turborepo.\n- `apps/web`: Next.js 16 App Router, TypeScript strict. Fonts via `next/font/google` (Anton, Inter) in the root layout. Tailwind 4 via `@import \"tailwindcss\"` with `@theme` tokens.\n- `packages/core`: pure rules and the metric-type registry.\n- `packages/ui`: the Fight Camp design system. See [[design-system]].\n- `packages/db`: Supabase migrations, types, pgTAP. See [[db]].\n- `packages/config`: shared config.\n- Services: Supabase (Mumbai), Razorpay, Claude API, Vercel.\n- Extensibility: categories are data, metric types are a registry, features are modules, a feature flags table. Details: `docs/architecture/architecture.md` §5.\n- Checks: `npm run verify` runs typecheck, lint, test and build. gstack `/verify` needs Bun ([[lesson-bun-gstack]]). CI runs the same checks: [[ci]].\n- Built by [[S0-02]]. Earlier stack choice: [[decision-pwa-stack]].", "links": ["S0-02", "ci", "db", "decision-pwa-stack", "decision-stack-locked", "design-system", "lesson-bun-gstack"]}, {"id": "tooling", "type": "area", "description": "Claude Code tools, plugins, skills and permissions for this project", "updated": "2026-11-12", "body": "- Permissions: `.claude/settings.json` lists commands that run without a prompt. Audited in [[session-6]]: auto mode blocks Claude from editing permission files or merging PRs, so the owner applies the allow list. A proposed list (git, gh pr/run, npm, npx supabase/playwright, docker, with deny rules for force-push, secrets, `supabase db push`/`link` and Vercel) was handed to the owner.\n- Bun 1.4.4 installed with winget on [[env-lenovo-pc]] in [[session-6]]; gstack setup now passes. Only `/cso` fails (needs the MSVC toolchain); it is switched off anyway.\n- Codex CLI 0.167.2 installed globally with npm; `~/.codex/config.toml` sets `model = \"gpt-6-astra\"`. Needs `codex login` by the owner. The Claude Code Codex plugin is not installed yet.\n- The `github` Claude plugin fails to connect (bad Authorization header). `gh` does the same work, so it is not needed.\n- Plugins: ponytail, ui-ux-pro-max, hallmark skill ([[lesson-hallmark-floor]]), OpenSEO, claude-seo (off until launch, [[lesson-seo-plugins]]).\n- History: [[lesson-bun-gstack]].\n- `gh` push of workflow files: [[lesson-gh-workflow-scope]].\n- `skills` CLI: [[lesson-skills-cli-node]].", "links": ["env-lenovo-pc", "lesson-bun-gstack", "lesson-gh-workflow-scope", "lesson-hallmark-floor", "lesson-seo-plugins", "lesson-skills-cli-node", "session-6"]}]};
const LABEL = {todo:'To do', in_progress:'In progress', blocked:'Blocked', done:'Done'};
const byId = Object.fromEntries(BOARD.tasks.map(t => [t.id, t]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {phase:'', status:'', prio:'', owner:'', q:''};
try { state = Object.assign(state, JSON.parse(localStorage.getItem('fs-board') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('fs-board', JSON.stringify(state)); } catch (e) {} };

function counts() {
  const n = s => BOARD.tasks.filter(t => t.status === s).length;
  const total = BOARD.tasks.length, done = n('done');
  document.getElementById('sub').textContent = `${BOARD.project} · updated ${BOARD.updated}`;
  document.getElementById('counts').innerHTML = [['Tasks', total], ['Done', done], ['In progress', n('in_progress')], ['Blocked', n('blocked')], ['Ready now', BOARD.tasks.filter(t => t.ready).length]]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  document.getElementById('overall').style.width = (total ? done * 100 / total : 0) + '%';
  const ready = BOARD.tasks.filter(t => t.ready || t.status === 'in_progress');
  document.getElementById('readylist').innerHTML = ready.length ? ready.map(t => `<li><a href="#t-${t.id}">${t.status === 'in_progress' ? 'Now: ' : ''}${esc(t.id)} · ${esc(t.title)}</a></li>`).join('') : '<li>Nothing is ready. Check blocked tasks.</li>';
}

function chips() {
  const el = document.getElementById('phasechips');
  el.innerHTML = [{id:'', name:'All phases'}].concat(BOARD.phases).map(p => `<button class="chip" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.id ? esc(p.id) + ' ' : ''}${esc(p.name)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state.phase = b.dataset.phase; save(); chips(); render(); };
}

function match(t) {
  if (state.phase && t.phase !== state.phase) return false;
  if (state.status === 'ready' ? !t.ready : state.status && t.status !== state.status) return false;
  if (state.prio && t.priority !== state.prio) return false;
  if (state.owner && t.owner !== state.owner) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(t.id + ' ' + t.title + ' ' + t.ac.join(' ')).toLowerCase().includes(q)) return false; }
  return true;
}

function row(t) {
  const deps = t.deps.length ? t.deps.map(d => `<a href="#t-${d}">${esc(d)}</a> <span class="muted">(${LABEL[byId[d].status]})</span>`).join(', ') : 'None';
  const screens = t.screens ? `<div><h3>Screens on the canvas</h3><p>${t.screens.map(esc).join(', ')}</p></div>` : '';
  const why = t.blocked_reason ? `<div><h3>Why blocked</h3><p>${esc(t.blocked_reason)}</p></div>` : '';
  const doneLine = t.status === 'done' ? `<div><h3>Finished</h3><p>${esc(t.done_on || '')}${t.commit ? ' · commit ' + esc(t.commit) : ''}</p></div>` : '';
  return `<details class="task" id="t-${t.id}">
    <summary><span class="st ${t.status}">${LABEL[t.status]}</span><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}${t.ready ? '<span class="rdy">Ready</span>' : ''}</span>
      <span class="meta"><span class="tag ${t.priority === 'P0' ? 'p0' : ''}">${t.priority}</span><span class="tag">${t.size === 'S' ? 'Small' : 'Medium'}</span><span class="tag ${t.owner === 'owner' ? 'own' : ''}">${t.owner === 'owner' ? 'Owner' : 'Claude'}</span><span class="tag">${esc(t.test)}</span></span></summary>
    <div class="body"><div><h3>Acceptance criteria</h3><ul>${t.ac.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="deps"><h3>Depends on</h3><p>${deps}</p></div>${why}${screens}${doneLine}</div></details>`;
}

function render() {
  document.getElementById('phases').innerHTML = BOARD.phases.map(p => {
    const all = BOARD.tasks.filter(t => t.phase === p.id);
    if (state.phase && state.phase !== p.id) return '';
    const shown = all.filter(match);
    const done = all.filter(t => t.status === 'done').length;
    return `<section class="phase" aria-labelledby="ph-${p.id}"><div class="phead"><div><h2 id="ph-${p.id}">${esc(p.id)} · ${esc(p.name)}</h2><p class="goal">${esc(p.goal)}</p></div><span class="pct">${done} / ${all.length} done</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${all.length ? done * 100 / all.length : 0}%"></i></div>
      ${shown.length ? shown.map(row).join('') : '<p class="empty">No tasks match these filters.</p>'}</section>`;
  }).join('');
}

for (const [id, key] of [['fstatus', 'status'], ['fprio', 'prio'], ['fowner', 'owner']]) {
  const el = document.getElementById(id); el.value = state[key]; el.onchange = () => { state[key] = el.value; save(); render(); };
}
const fq = document.getElementById('fq'); fq.value = state.q; fq.oninput = () => { state.q = fq.value; save(); render(); };
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#t-"]'); if (!a) return; const d = document.querySelector(a.getAttribute('href')); if (d) { if (state.phase && !d) return; d.open = true; } });
counts(); chips(); render();

// ---- Memory tab: notes from docs/memory, links as edges, linked board tasks as square nodes
const NOTES = BOARD.memory || [];
const KINDS = ['area', 'decision', 'constraint', 'lesson', 'environment', 'session', 'task'];
const noteById = Object.fromEntries(NOTES.map(n => [n.id, n]));
let mstate = {kind: '', q: '', sel: 'project-overview'};
try { Object.assign(mstate, JSON.parse(localStorage.getItem('fs-mem') || '{}')); } catch (e) {}
const msave = () => { try { localStorage.setItem('fs-mem', JSON.stringify(mstate)); } catch (e) {} };
const backlinks = id => NOTES.filter(n => n.links.includes(id)).map(n => n.id);
const linkHtml = id => noteById[id] || byId[id] ? `<button class="lk" data-go="${esc(id)}">${esc(id)}</button>` : esc(id);

function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]|]+)\]\]/g, (m, id) => linkHtml(id))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return src.split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^(- |\d+\. )/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^(- |\d+\. )/, ''))}</li>`).join('')}</ul>`;
    const first = lines.findIndex(l => /^(- |\d+\. )/.test(l));
    if (first > 0) return `<p>${inline(lines.slice(0, first).join(' '))}</p>` + md(lines.slice(first).join('\n'));
    return `<p>${inline(lines.join(' '))}</p>`;
  }).join('');
}

function read(id) {
  mstate.sel = id; msave();
  const el = document.getElementById('reader');
  const t = byId[id], n = noteById[id];
  if (t) {
    el.innerHTML = `<p class="kind">Board task · ${LABEL[t.status]}</p><h2>${esc(t.id)}</h2><p>${esc(t.title)}</p>
      <p><button class="lk" data-task="${esc(t.id)}">Open in the Tasks tab</button></p>
      <h3>Notes that link here</h3><p>${backlinks(id).map(linkHtml).join(', ') || 'None'}</p>`;
  } else if (n) {
    const back = backlinks(id);
    el.innerHTML = `<p class="kind">${esc(n.type)} · updated ${esc(n.updated)}</p><h2>${esc(n.id)}</h2><p class="muted">${esc(n.description)}</p>${md(n.body)}
      <h3>Linked from</h3><p>${back.map(linkHtml).join(', ') || 'Nothing links here yet'}</p>
      <p class="muted" style="font-size:13px">File: docs/memory/${esc(n.id)}.md</p>`;
  } else { el.innerHTML = '<p class="muted">Click a node to read its note.</p>'; }
  highlight();
}

let gsel = null;
function highlight() {
  if (!gsel) return;
  const q = mstate.q.toLowerCase();
  const hit = d => (!mstate.kind || d.kind === mstate.kind) && (!q || d.text.includes(q));
  const near = new Set([mstate.sel]);
  gsel.links.each(l => { if (l.source.id === mstate.sel) near.add(l.target.id); if (l.target.id === mstate.sel) near.add(l.source.id); });
  gsel.nodes.classed('dim', d => !hit(d)).classed('sel', d => d.id === mstate.sel);
  gsel.labels.classed('dim', d => !hit(d));
  gsel.links.classed('hot', l => l.source.id === mstate.sel || l.target.id === mstate.sel)
    .classed('dim', l => !(hit(l.source) && hit(l.target)) && !(near.has(l.source.id) && near.has(l.target.id)));
}

function graph() {
  const svg = d3.select('#graph');
  const box = svg.node().getBoundingClientRect();
  const W = box.width || 800, H = box.height || 600;
  svg.attr('viewBox', [0, 0, W, H]);
  const taskIds = [...new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l]))];
  const nodes = NOTES.map(n => ({id: n.id, kind: n.type, text: (n.id + ' ' + n.description + ' ' + n.body).toLowerCase()}))
    .concat(taskIds.map(id => ({id, kind: 'task', text: (id + ' ' + byId[id].title).toLowerCase()})));
  const links = NOTES.flatMap(n => n.links.map(l => ({source: n.id, target: l})));
  const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  const r = d => d.kind === 'task' ? 6 : 5 + Math.min(12, Math.sqrt(deg[d.id] || 1) * 2.2);
  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([.2, 4]).on('zoom', e => { root.attr('transform', e.transform); root.selectAll('text').style('font-size', 12 / e.transform.k + 'px'); });
  svg.call(zoom);
  const fit = () => {
    const b = root.node().getBBox(); if (!b.width) return;
    const k = Math.min(1.4, .94 * Math.min(W / b.width, H / b.height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (b.x + b.width / 2), H / 2 - k * (b.y + b.height / 2)).scale(k));
  };
  const lk = root.append('g').selectAll('line').data(links).join('line');
  const shapes = root.append('g').selectAll('path').data(nodes).join('path')
    .attr('class', d => 'n k-' + d.kind)
    .attr('d', d => d.kind === 'task' ? d3.symbol(d3.symbolSquare, 110)() : d3.symbol(d3.symbolCircle, Math.PI * r(d) ** 2)())
    .on('click', (e, d) => read(d.id));
  shapes.append('title').text(d => d.id);
  const lb = root.append('g').selectAll('text').data(nodes.filter(d => d.kind === 'area' || d.kind === 'task' || (deg[d.id] || 0) > 5)).join('text')
    .text(d => d.id).attr('dx', d => r(d) + 3).attr('dy', 4);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.source.kind === 'area' && l.target.kind === 'area' ? 120 : 55))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => r(d) + 4));
  const tick = () => {
    lk.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    shapes.attr('transform', d => `translate(${d.x},${d.y})`);
    lb.attr('x', d => d.x).attr('y', d => d.y);
  };
  sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); tick(); fit();
  if (!reduce) sim.on('tick', tick);
  shapes.call(d3.drag()
    .on('start', (e, d) => { if (!e.active && !reduce) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; if (reduce) { d.x = e.x; d.y = e.y; tick(); } })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  gsel = {nodes: shapes, links: lk, labels: lb};
}

function mchips() {
  const count = k => k === 'task' ? new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l])).size : NOTES.filter(n => n.type === k).length;
  document.getElementById('mchips').innerHTML = [''].concat(KINDS).map(k => `<button class="chip" data-kind="${k}" aria-pressed="${mstate.kind === k}">${k ? k[0].toUpperCase() + k.slice(1) + ' ' + count(k) : 'All ' + NOTES.length + ' notes'}</button>`).join('');
  document.getElementById('legend').innerHTML = KINDS.map(k => `<span><i class="k-${k}"></i>${k}</span>`).join('');
  document.querySelectorAll('#legend i').forEach((i, n) => { i.style.background = getComputedStyle(i).fill; if (KINDS[n] === 'task') i.style.border = '1.5px solid var(--fg)'; });
}

let drawn = false;
function showTab(name) {
  const mem = name === 'memory';
  document.getElementById('tab-tasks').hidden = mem; document.getElementById('tab-memory').hidden = !mem;
  document.getElementById('tb-tasks').setAttribute('aria-selected', !mem); document.getElementById('tb-memory').setAttribute('aria-selected', mem);
  try { localStorage.setItem('fs-tab', name); } catch (e) {}
  if (mem && !drawn) {
    drawn = true; mchips();
    if (window.d3) graph(); else document.getElementById('graph').outerHTML = '<p class="empty">The graph library did not load. Notes are still readable from the links in the reader.</p>';
    read(mstate.sel);
  }
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.id === 'tb-memory' ? 'memory' : 'tasks'); };
document.querySelector('.tabs').onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const m = document.getElementById('tb-tasks').getAttribute('aria-selected') === 'true'; showTab(m ? 'memory' : 'tasks'); document.getElementById(m ? 'tb-memory' : 'tb-tasks').focus(); } };
document.getElementById('mchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; mstate.kind = b.dataset.kind; msave(); mchips(); highlight(); };
const mq = document.getElementById('mq'); mq.value = mstate.q; mq.oninput = () => { mstate.q = mq.value; msave(); highlight(); };
document.getElementById('reader').onclick = e => {
  const g = e.target.closest('[data-go]'); if (g) return read(g.dataset.go);
  const t = e.target.closest('[data-task]'); if (t) { showTab('tasks'); const d = document.getElementById('t-' + t.dataset.task); if (d) { d.open = true; d.scrollIntoView(); } }
};
let startTab = location.hash === '#memory' ? 'memory' : 'tasks';
try { if (!location.hash) startTab = localStorage.getItem('fs-tab') || 'tasks'; } catch (e) {}
showTab(startTab);
</script>
