<title>FitSphere Build Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phase sections stacked, one dense row per task, details on demand. Fight Camp type, black and white, volt marks what is ready. */
:root{
  --bg:#ffffff; --fg:#111111; --soft:#f5f5f5; --line:#e2e2e2; --muted:#6b6b6e; --ink-2:#39393b;
  --volt:#D4F000; --on-volt:#111111; --done:#00653a; --done-bg:#e3f4ec; --block:#a3001a; --block-bg:#fde8eb; --prog-bg:#f6fbcc;
  --display:Anton, Impact, "Arial Narrow", sans-serif; --body:Inter, Helvetica, Arial, sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f10;--fg:#f2f2f2;--soft:#1b1b1d;--line:#2c2c2f;--muted:#a3a3a7;--ink-2:#cfcfd2;--done:#5fd39b;--done-bg:#12301f;--block:#ff8a96;--block-bg:#3a1418;--prog-bg:#2c3008;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance}
h1{font-size:clamp(48px,8vw,96px)}
h2{font-size:clamp(30px,4vw,44px)}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.counts{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;border-top:2px solid var(--fg);padding-top:16px}
.counts div{min-width:110px}
.counts b{display:block;font-family:var(--display);font-size:44px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);margin-top:10px}
.bar > i{display:block;height:100%;background:var(--fg)}
.ready{margin-top:32px;background:var(--fg);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:12px}
.ready h2{font-size:28px}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.ready li a{display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:0 16px;border-radius:30px;background:var(--volt);color:var(--on-volt);font-weight:600;text-decoration:none}
.filters{margin-top:32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:30px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=search]{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--line);border-radius:30px;padding:0 14px;background:var(--bg);color:var(--fg)}
input[type=search]{min-width:0;flex:1 1 180px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
section.phase{margin-top:48px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:12px}
.phead .goal{max-width:62ch;color:var(--ink-2);margin-top:8px}
.phead .pct{font-variant-numeric:tabular-nums;font-weight:600}
.task{border-bottom:1px solid var(--line)}
.task summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:110px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;min-height:52px}
.task summary::-webkit-details-marker{display:none}
.task summary:hover{background:var(--soft)}
.st{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:30px;white-space:nowrap}
.st.todo{border:1px solid var(--line);color:var(--muted)}
.st.in_progress{background:var(--volt);color:var(--on-volt)}
.st.blocked{background:var(--block-bg);color:var(--block)}
.st.done{background:var(--done-bg);color:var(--done)}
.id{font-weight:600;font-variant-numeric:tabular-nums}
.title{min-width:0}
.title .rdy{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;background:var(--volt);color:var(--on-volt);padding:2px 8px;border-radius:30px;vertical-align:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);padding:3px 9px;border-radius:30px;white-space:nowrap}
.tag.p0{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag.own{border-style:dashed}
.body{padding:4px 4px 20px 186px;display:grid;gap:12px}
.body h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.body ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:78ch}
.deps a{color:inherit;font-weight:600}
.empty{padding:20px 4px;color:var(--muted)}
@media (max-width:720px){
  .task summary{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"st id" "title title" "meta meta"}
  .task summary .st{grid-area:st;justify-self:start}.task summary .id{grid-area:id}.task summary .title{grid-area:title}.task summary .meta{grid-area:meta;justify-content:flex-start}
  .body{padding-left:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{display:flex;gap:8px;margin-top:28px;border-bottom:2px solid var(--fg)}
.tabs button{font:inherit;font-weight:600;font-size:15px;min-height:48px;padding:0 20px;border:0;border-radius:30px 30px 0 0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px}
#graph{width:100%;height:620px;background:var(--soft);display:block;touch-action:none}
#graph text{font:500 11px var(--body);fill:var(--ink-2);pointer-events:none}
#graph line{stroke:var(--line);stroke-width:1.2}
#graph line.hot{stroke:var(--fg);stroke-width:2}
#graph .n{cursor:pointer;stroke:var(--bg);stroke-width:1.5}
#graph .n.sel{stroke:var(--fg);stroke-width:3}
#graph .dim{opacity:.15}
.k-area{fill:var(--volt)}.k-decision{fill:var(--fg)}.k-constraint{fill:var(--block)}.k-lesson{fill:#c26a00}.k-environment{fill:var(--done)}.k-session{fill:var(--muted)}.k-task{fill:var(--bg);stroke:var(--fg)!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.reader{border-top:2px solid var(--fg);padding-top:14px;max-height:620px;overflow:auto}
.reader h2{font-size:30px;overflow-wrap:anywhere}
.reader .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.reader p,.reader ul{margin:10px 0;max-width:70ch}
.reader ul{padding-left:20px}
.reader code{font-size:13px;background:var(--soft);padding:1px 5px;overflow-wrap:anywhere}
.reader a,.reader button.lk{color:inherit;font-weight:600;text-decoration:underline;background:none;border:0;padding:0;font:inherit;font-weight:600;cursor:pointer}
.reader h3{font-size:13px;color:var(--muted);margin:18px 0 4px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}#graph{height:440px}.reader{max-height:none}}
</style>

<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:10px">
      <p class="muted" id="sub"></p>
      <h1>Build board</h1>
    </div>
    <p class="muted" style="max-width:44ch">One task at a time: tests first, then code, then verify. A task is ready when every task it depends on is done.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Board views">
    <button role="tab" id="tb-tasks" aria-controls="tab-tasks" aria-selected="true">Tasks</button>
    <button role="tab" id="tb-memory" aria-controls="tab-memory" aria-selected="false">Memory</button>
  </div>
  <div id="tab-tasks" role="tabpanel" aria-labelledby="tb-tasks">
  <div class="counts" id="counts"></div>
  <div class="bar" aria-hidden="true"><i id="overall"></i></div>
  <section class="ready" aria-labelledby="readyh">
    <h2 id="readyh">Ready to start</h2>
    <ul id="readylist"></ul>
  </section>
  <div class="filters" role="group" aria-label="Filters">
    <div id="phasechips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <label><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Status</span><select id="fstatus"><option value="">Any status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="ready">Ready now</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Priority</span><select id="fprio"><option value="">Any priority</option><option>P0</option><option>P1</option><option>P2</option></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Owner</span><select id="fowner"><option value="">Anyone</option><option value="claude">Claude</option><option value="owner">Owner</option></select></label>
    <input type="search" id="fq" placeholder="Search tasks" aria-label="Search tasks">
  </div>
  <div id="phases"></div>
  </div>
  <div id="tab-memory" role="tabpanel" aria-labelledby="tb-memory" hidden>
    <div class="filters" role="group" aria-label="Memory filters">
      <div id="mchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <input type="search" id="mq" placeholder="Search memory" aria-label="Search memory">
    </div>
    <div class="legend" id="legend"></div>
    <div class="mgrid">
      <svg id="graph" role="img" aria-label="Memory graph. Click a node to read its note."></svg>
      <article class="reader" id="reader" aria-live="polite"></article>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const BOARD = /*__DATA__*/null;
const LABEL = {todo:'To do', in_progress:'In progress', blocked:'Blocked', done:'Done'};
const byId = Object.fromEntries(BOARD.tasks.map(t => [t.id, t]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {phase:'', status:'', prio:'', owner:'', q:''};
try { state = Object.assign(state, JSON.parse(localStorage.getItem('fs-board') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('fs-board', JSON.stringify(state)); } catch (e) {} };

function counts() {
  const n = s => BOARD.tasks.filter(t => t.status === s).length;
  const total = BOARD.tasks.length, done = n('done');
  document.getElementById('sub').textContent = `${BOARD.project} · updated ${BOARD.updated}`;
  document.getElementById('counts').innerHTML = [['Tasks', total], ['Done', done], ['In progress', n('in_progress')], ['Blocked', n('blocked')], ['Ready now', BOARD.tasks.filter(t => t.ready).length]]
    .map(([k, v]) => `<div><b>${v}</b><span class="muted">${k}</span></div>`).join('');
  document.getElementById('overall').style.width = (total ? done * 100 / total : 0) + '%';
  const ready = BOARD.tasks.filter(t => t.ready || t.status === 'in_progress');
  document.getElementById('readylist').innerHTML = ready.length ? ready.map(t => `<li><a href="#t-${t.id}">${t.status === 'in_progress' ? 'Now: ' : ''}${esc(t.id)} · ${esc(t.title)}</a></li>`).join('') : '<li>Nothing is ready. Check blocked tasks.</li>';
}

function chips() {
  const el = document.getElementById('phasechips');
  el.innerHTML = [{id:'', name:'All phases'}].concat(BOARD.phases).map(p => `<button class="chip" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.id ? esc(p.id) + ' ' : ''}${esc(p.name)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state.phase = b.dataset.phase; save(); chips(); render(); };
}

function match(t) {
  if (state.phase && t.phase !== state.phase) return false;
  if (state.status === 'ready' ? !t.ready : state.status && t.status !== state.status) return false;
  if (state.prio && t.priority !== state.prio) return false;
  if (state.owner && t.owner !== state.owner) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(t.id + ' ' + t.title + ' ' + t.ac.join(' ')).toLowerCase().includes(q)) return false; }
  return true;
}

function row(t) {
  const deps = t.deps.length ? t.deps.map(d => `<a href="#t-${d}">${esc(d)}</a> <span class="muted">(${LABEL[byId[d].status]})</span>`).join(', ') : 'None';
  const screens = t.screens ? `<div><h3>Screens on the canvas</h3><p>${t.screens.map(esc).join(', ')}</p></div>` : '';
  const why = t.blocked_reason ? `<div><h3>Why blocked</h3><p>${esc(t.blocked_reason)}</p></div>` : '';
  const doneLine = t.status === 'done' ? `<div><h3>Finished</h3><p>${esc(t.done_on || '')}${t.commit ? ' · commit ' + esc(t.commit) : ''}</p></div>` : '';
  return `<details class="task" id="t-${t.id}">
    <summary><span class="st ${t.status}">${LABEL[t.status]}</span><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}${t.ready ? '<span class="rdy">Ready</span>' : ''}</span>
      <span class="meta"><span class="tag ${t.priority === 'P0' ? 'p0' : ''}">${t.priority}</span><span class="tag">${t.size === 'S' ? 'Small' : 'Medium'}</span><span class="tag ${t.owner === 'owner' ? 'own' : ''}">${t.owner === 'owner' ? 'Owner' : 'Claude'}</span><span class="tag">${esc(t.test)}</span></span></summary>
    <div class="body"><div><h3>Acceptance criteria</h3><ul>${t.ac.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="deps"><h3>Depends on</h3><p>${deps}</p></div>${why}${screens}${doneLine}</div></details>`;
}

function render() {
  document.getElementById('phases').innerHTML = BOARD.phases.map(p => {
    const all = BOARD.tasks.filter(t => t.phase === p.id);
    if (state.phase && state.phase !== p.id) return '';
    const shown = all.filter(match);
    const done = all.filter(t => t.status === 'done').length;
    return `<section class="phase" aria-labelledby="ph-${p.id}"><div class="phead"><div><h2 id="ph-${p.id}">${esc(p.id)} · ${esc(p.name)}</h2><p class="goal">${esc(p.goal)}</p></div><span class="pct">${done} / ${all.length} done</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${all.length ? done * 100 / all.length : 0}%"></i></div>
      ${shown.length ? shown.map(row).join('') : '<p class="empty">No tasks match these filters.</p>'}</section>`;
  }).join('');
}

for (const [id, key] of [['fstatus', 'status'], ['fprio', 'prio'], ['fowner', 'owner']]) {
  const el = document.getElementById(id); el.value = state[key]; el.onchange = () => { state[key] = el.value; save(); render(); };
}
const fq = document.getElementById('fq'); fq.value = state.q; fq.oninput = () => { state.q = fq.value; save(); render(); };
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#t-"]'); if (!a) return; const d = document.querySelector(a.getAttribute('href')); if (d) { if (state.phase && !d) return; d.open = true; } });
counts(); chips(); render();

// ---- Memory tab: notes from docs/memory, links as edges, linked board tasks as square nodes
const NOTES = BOARD.memory || [];
const KINDS = ['area', 'decision', 'constraint', 'lesson', 'environment', 'session', 'task'];
const noteById = Object.fromEntries(NOTES.map(n => [n.id, n]));
let mstate = {kind: '', q: '', sel: 'project-overview'};
try { Object.assign(mstate, JSON.parse(localStorage.getItem('fs-mem') || '{}')); } catch (e) {}
const msave = () => { try { localStorage.setItem('fs-mem', JSON.stringify(mstate)); } catch (e) {} };
const backlinks = id => NOTES.filter(n => n.links.includes(id)).map(n => n.id);
const linkHtml = id => noteById[id] || byId[id] ? `<button class="lk" data-go="${esc(id)}">${esc(id)}</button>` : esc(id);

function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]|]+)\]\]/g, (m, id) => linkHtml(id))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return src.split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^(- |\d+\. )/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^(- |\d+\. )/, ''))}</li>`).join('')}</ul>`;
    const first = lines.findIndex(l => /^(- |\d+\. )/.test(l));
    if (first > 0) return `<p>${inline(lines.slice(0, first).join(' '))}</p>` + md(lines.slice(first).join('\n'));
    return `<p>${inline(lines.join(' '))}</p>`;
  }).join('');
}

function read(id) {
  mstate.sel = id; msave();
  const el = document.getElementById('reader');
  const t = byId[id], n = noteById[id];
  if (t) {
    el.innerHTML = `<p class="kind">Board task · ${LABEL[t.status]}</p><h2>${esc(t.id)}</h2><p>${esc(t.title)}</p>
      <p><button class="lk" data-task="${esc(t.id)}">Open in the Tasks tab</button></p>
      <h3>Notes that link here</h3><p>${backlinks(id).map(linkHtml).join(', ') || 'None'}</p>`;
  } else if (n) {
    const back = backlinks(id);
    el.innerHTML = `<p class="kind">${esc(n.type)} · updated ${esc(n.updated)}</p><h2>${esc(n.id)}</h2><p class="muted">${esc(n.description)}</p>${md(n.body)}
      <h3>Linked from</h3><p>${back.map(linkHtml).join(', ') || 'Nothing links here yet'}</p>
      <p class="muted" style="font-size:13px">File: docs/memory/${esc(n.id)}.md</p>`;
  } else { el.innerHTML = '<p class="muted">Click a node to read its note.</p>'; }
  highlight();
}

let gsel = null;
function highlight() {
  if (!gsel) return;
  const q = mstate.q.toLowerCase();
  const hit = d => (!mstate.kind || d.kind === mstate.kind) && (!q || d.text.includes(q));
  const near = new Set([mstate.sel]);
  gsel.links.each(l => { if (l.source.id === mstate.sel) near.add(l.target.id); if (l.target.id === mstate.sel) near.add(l.source.id); });
  gsel.nodes.classed('dim', d => !hit(d)).classed('sel', d => d.id === mstate.sel);
  gsel.labels.classed('dim', d => !hit(d));
  gsel.links.classed('hot', l => l.source.id === mstate.sel || l.target.id === mstate.sel)
    .classed('dim', l => !(hit(l.source) && hit(l.target)) && !(near.has(l.source.id) && near.has(l.target.id)));
}

function graph() {
  const svg = d3.select('#graph');
  const box = svg.node().getBoundingClientRect();
  const W = box.width || 800, H = box.height || 600;
  svg.attr('viewBox', [0, 0, W, H]);
  const taskIds = [...new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l]))];
  const nodes = NOTES.map(n => ({id: n.id, kind: n.type, text: (n.id + ' ' + n.description + ' ' + n.body).toLowerCase()}))
    .concat(taskIds.map(id => ({id, kind: 'task', text: (id + ' ' + byId[id].title).toLowerCase()})));
  const links = NOTES.flatMap(n => n.links.map(l => ({source: n.id, target: l})));
  const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  const r = d => d.kind === 'task' ? 6 : 5 + Math.min(12, Math.sqrt(deg[d.id] || 1) * 2.2);
  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([.2, 4]).on('zoom', e => { root.attr('transform', e.transform); root.selectAll('text').style('font-size', 12 / e.transform.k + 'px'); });
  svg.call(zoom);
  const fit = () => {
    const b = root.node().getBBox(); if (!b.width) return;
    const k = Math.min(1.4, .94 * Math.min(W / b.width, H / b.height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (b.x + b.width / 2), H / 2 - k * (b.y + b.height / 2)).scale(k));
  };
  const lk = root.append('g').selectAll('line').data(links).join('line');
  const shapes = root.append('g').selectAll('path').data(nodes).join('path')
    .attr('class', d => 'n k-' + d.kind)
    .attr('d', d => d.kind === 'task' ? d3.symbol(d3.symbolSquare, 110)() : d3.symbol(d3.symbolCircle, Math.PI * r(d) ** 2)())
    .on('click', (e, d) => read(d.id));
  shapes.append('title').text(d => d.id);
  const lb = root.append('g').selectAll('text').data(nodes.filter(d => d.kind === 'area' || d.kind === 'task' || (deg[d.id] || 0) > 5)).join('text')
    .text(d => d.id).attr('dx', d => r(d) + 3).attr('dy', 4);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.source.kind === 'area' && l.target.kind === 'area' ? 120 : 55))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => r(d) + 4));
  const tick = () => {
    lk.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    shapes.attr('transform', d => `translate(${d.x},${d.y})`);
    lb.attr('x', d => d.x).attr('y', d => d.y);
  };
  sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); tick(); fit();
  if (!reduce) sim.on('tick', tick);
  shapes.call(d3.drag()
    .on('start', (e, d) => { if (!e.active && !reduce) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; if (reduce) { d.x = e.x; d.y = e.y; tick(); } })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  gsel = {nodes: shapes, links: lk, labels: lb};
}

function mchips() {
  const count = k => k === 'task' ? new Set(NOTES.flatMap(n => n.links).filter(l => byId[l] && !noteById[l])).size : NOTES.filter(n => n.type === k).length;
  document.getElementById('mchips').innerHTML = [''].concat(KINDS).map(k => `<button class="chip" data-kind="${k}" aria-pressed="${mstate.kind === k}">${k ? k[0].toUpperCase() + k.slice(1) + ' ' + count(k) : 'All ' + NOTES.length + ' notes'}</button>`).join('');
  document.getElementById('legend').innerHTML = KINDS.map(k => `<span><i class="k-${k}"></i>${k}</span>`).join('');
  document.querySelectorAll('#legend i').forEach((i, n) => { i.style.background = getComputedStyle(i).fill; if (KINDS[n] === 'task') i.style.border = '1.5px solid var(--fg)'; });
}

let drawn = false;
function showTab(name) {
  const mem = name === 'memory';
  document.getElementById('tab-tasks').hidden = mem; document.getElementById('tab-memory').hidden = !mem;
  document.getElementById('tb-tasks').setAttribute('aria-selected', !mem); document.getElementById('tb-memory').setAttribute('aria-selected', mem);
  try { localStorage.setItem('fs-tab', name); } catch (e) {}
  if (mem && !drawn) {
    drawn = true; mchips();
    if (window.d3) graph(); else document.getElementById('graph').outerHTML = '<p class="empty">The graph library did not load. Notes are still readable from the links in the reader.</p>';
    read(mstate.sel);
  }
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.id === 'tb-memory' ? 'memory' : 'tasks'); };
document.querySelector('.tabs').onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const m = document.getElementById('tb-tasks').getAttribute('aria-selected') === 'true'; showTab(m ? 'memory' : 'tasks'); document.getElementById(m ? 'tb-memory' : 'tb-tasks').focus(); } };
document.getElementById('mchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; mstate.kind = b.dataset.kind; msave(); mchips(); highlight(); };
const mq = document.getElementById('mq'); mq.value = mstate.q; mq.oninput = () => { mstate.q = mq.value; msave(); highlight(); };
document.getElementById('reader').onclick = e => {
  const g = e.target.closest('[data-go]'); if (g) return read(g.dataset.go);
  const t = e.target.closest('[data-task]'); if (t) { showTab('tasks'); const d = document.getElementById('t-' + t.dataset.task); if (d) { d.open = true; d.scrollIntoView(); } }
};
let startTab = location.hash === '#memory' ? 'memory' : 'tasks';
try { if (!location.hash) startTab = localStorage.getItem('fs-tab') || 'tasks'; } catch (e) {}
showTab(startTab);
</script>
